let AC = null; const bufs = new Map();
const toBuf = b64 => {
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a.buffer;
};
async function fire(s, btn) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") await AC.resume();
    let b = bufs.get(s.n);
    if (!b) { b = await AC.decodeAudioData(toBuf(s.b64)); bufs.set(s.n, b); }
    const src = AC.createBufferSource(); src.buffer = b;
    src.connect(AC.destination); src.start();
    btn.classList.add("hot"); setTimeout(() => btn.classList.remove("hot"), 260);
  } catch (e) { document.getElementById("hint").textContent = "AUDIO BLOCKED — OPEN IN SAFARI"; }
}
const grid = document.getElementById("grid");
for (const s of S) {
  const b = document.createElement("button");
  b.innerHTML = '<span class="num">' + String(s.n).padStart(2, "0") + '</span>' +
                '<span class="nm">' + s.name + '</span>';
  b.addEventListener("click", () => fire(s, b));
  grid.appendChild(b);
}
