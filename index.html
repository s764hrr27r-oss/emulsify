#lidprint>*{position:absolute;inset:0;pointer-events:none}
/* focus pull + saturation: soft pale copy under, sharp copy over, passing focus and returning */
.lid-soft{background:var(--lid) center/cover;filter:blur(2.2px) saturate(.88)}
.lid-sharp{background:var(--lid) center/cover;opacity:0;animation:lidfocus .9s cubic-bezier(.16,.9,.22,1) .25s both}
@keyframes lidfocus{0%{opacity:0}70%{opacity:1}84%{opacity:.9}100%{opacity:1}}
/* the iris closes: overexposed copy settling to the true exposure */
.lid-hot{background:var(--lid) center/cover;filter:brightness(1.75) contrast(.88);animation:lidout .8s ease-out .15s both}
@keyframes lidout{from{opacity:1}to{opacity:0}}
/* the glass: the print reflects in the black beneath it, and the water goes still */
.lid-mirror{top:100%;height:38%;background:var(--lid) center bottom/100% auto;transform:scaleY(-1);filter:blur(3px) brightness(.32);
  -webkit-mask:linear-gradient(to top,#000,transparent 92%);mask:linear-gradient(to top,#000,transparent 92%);opacity:0;
  animation:lidin .8s ease .55s both, lidstill 1.6s cubic-bezier(.2,.7,.2,1) .55s both}
@keyframes lidin{to{opacity:1}}
@keyframes lidstill{0%{transform:scaleY(-1) scaleX(1.02) skewX(1.2deg)}40%{transform:scaleY(-1) scaleX(.995) skewX(-.6deg)}70%{transform:scaleY(-1) scaleX(1.003) skewX(.2deg)}100%{transform:scaleY(-1)}}
/* the sunset warms as it settles */
.lid-warm{mix-blend-mode:screen;background:radial-gradient(circle at 50% 62%, rgba(240,150,60,.20), rgba(240,150,60,.05) 72%);opacity:0;animation:lidin .9s ease .3s both}
/* the room's lamp on the glass, split into its colours, breathing; and the tungsten inrush on switch-on */
.lid-bloom{inset:-15%;mix-blend-mode:screen;background:
  radial-gradient(circle at 77.4% 22%, rgba(255,70,40,.16), transparent 42%),
  radial-gradient(circle at 78% 22%, rgba(255,205,130,.22), transparent 42%),
  radial-gradient(circle at 78.6% 22.6%, rgba(90,150,255,.12), transparent 42%);
  animation:lidbreath 3.2s ease-in-out infinite}
@keyframes lidbreath{0%,100%{opacity:.55}50%{opacity:1}}
.lid-inrush{inset:-15%;mix-blend-mode:screen;background:radial-gradient(circle at 78% 22%, rgba(255,225,170,.5), transparent 46%);opacity:0;animation:lidinrush 1.5s ease-out .05s both}
@keyframes lidinrush{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
/* halation: the stock's own red halo around the horizon glow */
.lid-halo{mix-blend-mode:screen;background:radial-gradient(ellipse at 52% 74%, rgba(255,90,40,.28), rgba(255,120,60,.10) 30%, transparent 56%);opacity:0;animation:lidin .7s ease .6s both}
/* light at the seam: the lid opening, as light rather than object, fading as the print develops */
.lid-seam{height:24%;bottom:auto;mix-blend-mode:screen;background:linear-gradient(to bottom, rgba(255,200,120,.6), rgba(255,160,60,.18) 42%, transparent 100%);animation:lidout .75s ease-out .1s both}
/* the enlarger pass: one band of light down the print */
.lid-passwrap{overflow:hidden}
.lid-pass{position:absolute;left:0;right:0;top:-8%;height:8%;background:linear-gradient(to bottom, transparent, rgba(255,240,220,.13), transparent);animation:lidpass 1.1s ease-in-out .2s both}
@keyframes lidpass{from{transform:translateY(0)}to{transform:translateY(1500%)}}
/* light crossing the frame: two soft rays, moving */
.lid-rays{overflow:hidden}
.lid-rays i{position:absolute;left:-40%;width:180%;height:9%;background:linear-gradient(90deg,transparent,rgba(255,236,200,.09),transparent);filter:blur(7px);opacity:.35}
.lid-rays i:nth-child(1){top:-30%;animation:lidray 4s linear infinite}
.lid-rays i:nth-child(2){top:-45%;animation:lidray 5.6s linear .9s infinite;opacity:.22}
@keyframes lidray{from{transform:rotate(-21deg) translateY(0)}to{transform:rotate(-21deg) translateY(1500%)}}
/* the emulsion: silver grain, lightening only, coalescing toward the picture then drifting */
.lid-grain{inset:0;background-image:var(--grain);mix-blend-mode:screen;animation:lidgrain .6s ease-out both, liddrift 4s ease-in-out infinite alternate}
@keyframes lidgrain{from{opacity:.45}to{opacity:.12}}
@keyframes liddrift{from{transform:translate(0,0)}to{transform:translate(2px,-1.5px)}}
/* the edge lights: the print as an object on the glass, then just a print */
.lid-edge{border:1px solid rgba(255,236,206,.75);box-sizing:border-box;opacity:0;animation:lidedge 1.4s ease .45s both}
@keyframes lidedge{0%{opacity:0}35%{opacity:1}100%{opacity:.25}}
/* case dust in the light: three motes settling, and one catching the lamp */
.lid-dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,240,220,.95);filter:blur(1px);opacity:0;animation:liddust 2.6s linear infinite}
.lid-dust i:nth-child(1){left:22%;top:18%;animation-delay:.3s}
.lid-dust i:nth-child(2){left:61%;top:34%;animation-delay:.9s;animation-duration:3.1s}
.lid-dust i:nth-child(3){left:41%;top:58%;animation-delay:1.4s;animation-duration:2.9s}
.lid-dust i:nth-child(4){left:-4%;top:30%;width:5px;height:5px;filter:blur(2.5px);animation:lidcatch 2.4s linear .2s infinite}
@keyframes liddust{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}85%{opacity:.4}100%{transform:translate(9px,64px);opacity:0}}
@keyframes lidcatch{0%{transform:translate(0,0);opacity:0}20%{opacity:.16}80%{opacity:.14}100%{transform:translate(108vw,-5vh);opacity:0}}
/* develop-out: the undeveloped print is milk-white, cyan-tinged; the picture comes up through it */
.lid-milk{background:rgba(214,236,240,1);animation:lidmilk 1.3s cubic-bezier(.5,0,.3,1) .1s both}
@keyframes lidmilk{0%{opacity:1}30%{opacity:.85}100%{opacity:0}}
/* the white first frame: the launch flash carried on, then let go */
.lid-white{position:absolute;inset:0;background:#fff;animation:lidflash .55s ease-out both}
@keyframes lidflash{from{opacity:1}to{opacity:0}}
</style>

                                        c.toBlob(b => { done = true; clearTimeout(stall); r(b); }, "image/jpeg", 0.93); });
  if (!blob) { flagError("NEGATIVE FAILED"); c.width = c.height = 0; return; }   /* toBlob can hand back null under memory pressure */
  if (voice) { lastNeg = blob; }              /* the double's memory: the same bytes, no second encode */
  c.width = c.height = 0;
  pending++; cooking.add(id); labStage = ""; paintWind(); if (pending === 1) bathToneStart();
  try { await paintChip(); } catch (e) { try { flashState("CHIP: " + String(e && e.message || e).slice(0, 14).toUpperCase()); } catch (e2) {} }
  try {
    labAwake(true);
    const { jpg, secs } = await labDevelop(await blob.arrayBuffer(), seed, id, full);
    if (!full) adaptRung(secs);        /* a full-size shot must not demote the rung */
    try { localStorage["t" + id] = secs || ""; } catch (e) {}
    const printBlob = new Blob([jpg], { type: "image/jpeg" });
    await put("prints", id, printBlob);          // balanced in the lab: final
    await put("thumbs", id, await makeThumb(printBlob));
    prints.push(id);
  } catch (e) { console.error(e); flagError(String(e && e.message || e).slice(0, 18).toUpperCase() || "DEVELOP FAILED"); }
  const wasWatched = (watching === id);
  cooking.delete(id); cookThumbs.delete(id);
  pending--; if (pending <= 0) labAwake(false);
  paintWind(); if (pending <= 0) bathToneStop();
  lastLanded = { id, t: Date.now() };                                     /* 10: the newest print, still wet */
  paintChip();
  if (wasWatched && $("print").classList.contains("on")) openPrint(id);
  else if ($("print").classList.contains("on")) buildStrip(watching || current);
}

/* ---------- anamorphic: the adapter squeezes, the lab unsqueezes ----------
   An adapter compresses the horizontal axis optically, so the sensor records
   a squeezed frame. That squeezed frame IS the negative: the chemistry runs
   on it exactly as shot, which is why the grain comes out oval once the
   print is stretched back - the same thing that happens on real anamorphic
   film. The viewfinder shows the desqueezed framing by shrinking the preview
   vertically, so what you compose is what you get. */
/* OPTICS - the glass you own, one record each. `s` is the ONLY field that
   makes a lens anamorphic: desqueeze, the oval grain, --sq, the portrait lock
   and body.ana all read it, so a tele or a macro carries s:1 and inherits
   ANA-OFF behaviour by construction rather than by six remembered exclusions.
     s     optical squeeze (horizontal compression)
     m     focal multiplier (tele); 1 for anamorphic
     crop  DIGITAL crop applied at capture to clear the adapter's vignette
     minE  narrowest physical camera the glass can cover, 35mm-e
     tint  measured transmission R,G,B with white balance locked; null = none
     tintS fraction of that tint corrected out
   Two 1.55x from different brands are two records: same squeeze, own tint. */

/* PINCH FOR GLASS. Two fingers on the finder: spread to step up the ladder,

/* THE SHARE CARD. Not the bare file: the print on a dark mount, its edge code
   and bath time set beneath in the app's face, the roll letter in the corner.
   The plain print rides along as a second file. */
async function shareCard() {
  try {
    if (!armedFile) return;
    const im = new Image(); const url = URL.createObjectURL(armedFile);
    await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = url; });
    try { await document.fonts.load("600 40px 'Red Hat Display'"); } catch (e) {}
    const mW = 1400, pad = 110, maxW = mW - 2 * pad, ar = im.naturalWidth / im.naturalHeight;
    const pw = Math.min(maxW, im.naturalWidth * 1.0), ph = pw / ar, mH = Math.round(ph + pad * 2 + 130);
    const c = Object.assign(document.createElement("canvas"), { width: mW, height: mH }), g = c.getContext("2d");

/* THE ROLL AS ONE IMAGE: the contact sheet rendered to a single picture */
