<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<title>Emulsify</title>
<style>
:root{ --k:#0a0a0a; --w:#f4f2ed; --mute:#8a8a86; --dot:#e0913a; --hair:#232323 }
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--k);color:var(--w);
     font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif;
     font-weight:300;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}

/* ---------- camera (portrait-locked presentation) ---------- */
#camera{position:fixed;inset:0;display:flex;flex-direction:column;
        padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:center;padding:16px 0 12px}
#frame{flex:1;display:grid;place-items:center;min-height:0;padding:0 0 6px}
#glass{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#000}
#glass video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
   linear-gradient(to right, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to right, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px)),
   linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px))}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .1s}
#denied{position:absolute;inset:0;display:none;place-items:center;
        font-size:13px;color:var(--mute);text-align:center;padding:40px}
.deck{display:flex;align-items:center;justify-content:space-between;
      padding:18px 34px calc(22px + env(safe-area-inset-bottom))}
#chip{width:46px;height:46px;border-radius:4px;border:1px solid var(--hair);
      overflow:hidden;position:relative;display:grid;place-items:center;flex:0 0 auto}
#chip img{width:100%;height:100%;object-fit:cover;display:block}
#chip .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,10,10,.55)}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
#chip .busy .dot{animation:breathe 1.6s ease-in-out infinite}
#shutterwrap{position:relative;flex:0 0 auto}
#shutter{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--w);
         display:grid;place-items:center}
#shutter i{width:64px;height:64px;border-radius:50%;background:var(--w);
           display:block;transition:transform .1s}
#shutter:active i, #shutter.pressed i{transform:scale(.88)}
/* a real, invisible native switch rides the shutter: the finger's own tap
   toggles it, so iOS plays the Taptic tick — no script, nothing to patch */
#hap{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
     clip-path:circle(50%);-webkit-appearance:auto}
.lensbtn{width:46px;height:46px;flex:0 0 auto;border-radius:50%;
  border:1px solid var(--hair);color:var(--mute);
  font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.05em}
.lensbtn:active{color:var(--w);border-color:var(--mute)}

/* ---------- landscape: 5:4 horizontal format, controls on the right ---------- */
@media (orientation: landscape){
  .top{position:absolute;top:calc(4px + env(safe-area-inset-top));left:0;right:0;
       z-index:3;padding:8px 0}
  #frame{padding:calc(30px + env(safe-area-inset-top)) 116px 10px
                 calc(10px + env(safe-area-inset-left))}
  #glass{width:auto;height:100%;aspect-ratio:5/4}
  .deck{position:absolute;top:0;bottom:0;
        right:calc(env(safe-area-inset-right));width:112px;
        flex-direction:column;justify-content:center;gap:26px;padding:0}
  #shutterwrap{order:1}
  #shutter{width:70px;height:70px}
  #shutter i{width:57px;height:57px}
  #chip{order:2}
  .spacer{display:none}
}

/* ---------- print ---------- */
#print{position:fixed;inset:0;background:var(--k);display:none;flex-direction:column;
       z-index:10;padding-top:env(safe-area-inset-top)}
#print.on{display:flex}
#print .bar{display:flex;align-items:center;padding:12px 18px}
#back{width:34px;height:34px;position:relative}
#back::before{content:"";position:absolute;left:11px;top:9px;width:12px;height:12px;
  border-left:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);
  transform:rotate(45deg)}
#rering{width:34px;height:34px;margin-left:auto;position:relative;visibility:hidden}
#rering::before{content:"";position:absolute;left:8px;top:8px;width:15px;height:15px;
  border:1.5px solid var(--dot);border-radius:50%;opacity:.35}
#rering:active::before{opacity:.8}
#stage{flex:1;position:relative;min-height:0;margin:0 16px}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           -webkit-touch-callout:default;user-select:auto}
@keyframes comeup{from{opacity:0;filter:brightness(1.8) contrast(.4)}to{opacity:1;filter:none}}
#stage img.fresh{animation:comeup 1.2s ease-out both}
@media(prefers-reduced-motion:reduce){#stage img.fresh{animation:none}}
#print .foot{display:flex;flex-direction:column;align-items:center;gap:16px;
             padding:16px 0 calc(22px + env(safe-area-inset-bottom))}
#strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:0 22px;
       -webkit-overflow-scrolling:touch}
#strip button{flex:0 0 auto;width:44px;height:44px;border-radius:3px;overflow:hidden;
              border:1px solid transparent}
#strip button.sel{border-color:var(--w)}
#strip img{width:100%;height:100%;object-fit:cover;display:block}
#save{font-size:13px;letter-spacing:.22em;color:var(--w);
      border:1px solid var(--hair);border-radius:999px;padding:12px 34px}
#save:active{background:var(--hair)}
@media (orientation: landscape){
  #print .foot{flex-direction:row;justify-content:center;gap:16px;
               padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
  #strip{flex:1;max-width:none}
  #strip button{width:36px;height:36px}
}

/* ---------- ring (the printer's easel) ----------
   The print arrives first, full frame, then settles back into the reticle as
   its neighbors breathe in. vertical = tint (green up) · horizontal = warmth
   (warm right) · the frame under the reticle is the live pick · tap it to
   lock. Left alone, the reticle fades and the as-developed frame locks
   itself — the easel is a pause, not a demand. */
#ring{position:fixed;inset:0;background:var(--k);display:none;z-index:20;
      overflow:hidden;touch-action:none}
#ring.on{display:block}
#ringfield{position:absolute;left:0;top:0;will-change:transform;
           opacity:0;transition:opacity .45s ease}
#ring.live #ringfield{opacity:1}
#ringfield canvas{position:absolute;border-radius:2px;transition:opacity .35s ease}
#ringfield canvas.chosen{transition:opacity .35s ease, transform .42s ease;z-index:2}
#ringdot{position:absolute;width:7px;height:7px;border-radius:50%;
         background:var(--dot);opacity:.9;pointer-events:none}
#ringhero{position:absolute;inset:0;display:none;pointer-events:none;
          transition:transform .45s ease}
#ring.hero #ringhero{display:block}
#ringhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#ringhero img.fresh{animation:comeup 1.2s ease-out both}
@media(prefers-reduced-motion:reduce){
  #ringhero img.fresh{animation:none}
  #ringhero,#ringfield,#ringfield canvas,#reticle{transition:none}
}
#reticle{position:absolute;border:1.5px solid rgba(224,145,58,.75);border-radius:4px;
         pointer-events:none;transition:opacity .3s ease}
</style>
</head>
<body>

<div id="camera">
  <div class="top"><span class="dot"></span></div>
  <div id="frame">
    <div id="glass">
      <video id="video" autoplay playsinline muted></video>
      <div id="grid"></div>
      <div id="flash"></div>
      <div id="denied">Allow camera access in Settings › Safari.</div>
    </div>
  </div>
  <div class="deck">
    <button id="chip" aria-label="Prints"></button>
    <span id="shutterwrap"><button id="shutter" aria-label="Shutter"><i></i></button><input type="checkbox" switch id="hap" aria-label="Shutter" tabindex="-1"></span>
    <button id="lens" class="lensbtn" aria-label="Lens" style="visibility:hidden">1×</button>
  </div>
</div>

<div id="ring">
  <div id="ringfield"></div>
  <div id="ringhero"><img id="ringheroimg" alt=""></div>
  <div id="reticle"></div>
</div>

<div id="print">
  <div class="bar"><button id="back" aria-label="Close"></button><button id="rering" aria-label="Adjust tint"></button></div>
  <div id="stage"></div>
  <div class="foot">
    <div id="strip"></div>
    <button id="save">SAVE</button>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const MAX_NEG = 2200;
const aspect = () => matchMedia("(orientation: landscape)").matches ? 5/4 : 4/5;
const calmMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- store ---------- */
const DB = await new Promise((res, rej) => {
  const q = indexedDB.open("emulsify-one", 3);
  q.onupgradeneeded = () => {
    const db = q.result;
    if (!db.objectStoreNames.contains("prints")) db.createObjectStore("prints");
    if (!db.objectStoreNames.contains("thumbs")) db.createObjectStore("thumbs");
    if (!db.objectStoreNames.contains("negs"))   db.createObjectStore("negs");
  };
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
});
const put = (s, k, v) => new Promise((res, rej) => {
  try {
    if (!DB.objectStoreNames.contains(s)) return res();   // store missing: skip
    const t = DB.transaction(s, "readwrite");
    t.objectStore(s).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error);
  } catch (e) { res(); }                                   // archival never blocks
});
const get = (s, k) => new Promise((res, rej) => {
  const r = DB.transaction(s).objectStore(s).get(k);
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
/* prints listing skips easel side-records (keys with ":") */
const allKeys = () => new Promise((res, rej) => {
  const r = DB.transaction("prints").objectStore("prints").getAllKeys();
  r.onsuccess = () => res(r.result.filter(k => !String(k).includes(":")).sort());
  r.onerror = () => rej(r.error);
});
let prints = await allKeys();
let pending = 0;

const urls = new Set();
const mkURL = b => { const u = URL.createObjectURL(b); urls.add(u); return u; };
const revokeAll = () => { for (const u of urls) URL.revokeObjectURL(u); urls.clear(); };

async function makeThumb(blob) {
  const bmp = await createImageBitmap(blob);
  const s = 220 / Math.max(bmp.width, bmp.height);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  const t = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  c.width = c.height = 0;
  return t;
}
async function thumbOf(id) {
  let t = await get("thumbs", id);
  if (!t) { const p = await get("prints", id);
    if (!p) return null; t = await makeThumb(p); await put("thumbs", id, t); }
  return t;
}
const chosenOf = id => { try { return localStorage["wt" + id]; } catch (e) { return "0,0"; } };

/* ---------- lab ---------- */
const worker = new Worker("lab-worker.js?v=10");
let msgId = 0; const waits = new Map();
worker.onmessage = e => {
  const { id, ok, result, secs, error, ready } = e.data;
  if (ready !== undefined || e.data.progress) return;
  const w = waits.get(id); if (!w) return; waits.delete(id);
  ok ? w.res({ jpg: result, secs }) : w.rej(new Error(error));
};
const labDevelop = (buf, seed, size) => {
  const id = ++msgId;
  return new Promise((res, rej) => {
    waits.set(id, { res, rej });
    worker.postMessage({ id, neg: buf, profile: "honey",
                         seed: seed, size: size || 1100 });
  });
};
const labBake = (buf, w, t, secs) => {
  const id = ++msgId;
  return new Promise((res, rej) => {
    waits.set(id, { res, rej });
    worker.postMessage({ id, bake: true, jpg: buf, w: w, t: t, secs: secs });
  });
};

/* ---------- camera: multi-lens, no rotation handling by design ---------- */
let stream = null, restarting = false;
let lenses = [], lensIdx = 0;
async function startCamera(deviceId) {
  if (restarting) return; restarting = true;
  try {
    stream?.getTracks().forEach(t => t.stop());
    $("video").srcObject = null;
    const video = deviceId
      ? { deviceId: { exact: deviceId },
          width: { ideal: 4032 }, height: { ideal: 3024 } }
      : { facingMode: "environment",
          width: { ideal: 4032 }, height: { ideal: 3024 } };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    $("video").srcObject = stream;
    $("denied").style.display = "none";
    discoverLenses();
  } catch { $("denied").style.display = "grid"; }
  restarting = false;
}
async function discoverLenses() {
  if (lenses.length) return;
  const devs = await navigator.mediaDevices.enumerateDevices();
  const back = devs.filter(d => d.kind === "videoinput" &&
                                !/front|user/i.test(d.label));
  const rank = l => /ultra/i.test(l) ? 0 : /tele/i.test(l) ? 2 : 1;
  const mark = l => /ultra/i.test(l) ? "0.5×" : /tele/i.test(l) ? "2×" : "1×";
  back.sort((a, b) => rank(a.label) - rank(b.label));
  lenses = back.map(d => ({ id: d.deviceId, mark: mark(d.label) }));
  if (lenses.length > 1) {
    lensIdx = Math.max(0, lenses.findIndex(l => l.mark === "1×"));
    const b = $("lens");
    b.textContent = lenses[lensIdx].mark;
    b.style.visibility = "visible";
  }
}
$("lens").onclick = () => {
  if (lenses.length < 2 || restarting) return;
  lensIdx = (lensIdx + 1) % lenses.length;
  $("lens").textContent = lenses[lensIdx].mark;
  startCamera(lenses[lensIdx].id);
};
startCamera();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") setTimeout(startCamera, 250);
  else ringHoldTimers();   // never auto-lock behind the user's back
});

/* ---------- snap feedback ----------
   Haptic: the invisible native switch over the shutter ticks the Taptic
   Engine on the physical tap itself (iOS 17.4+, survives the 26.5 patch);
   navigator.vibrate covers Android. Sound: a synthesized kachunk — curtain
   snap, low thump, claw tick — honest Web Audio, no asset, and it respects
   the mute switch like a real camera. */
let AC = null;
function shutterVoice() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime, out = AC.createGain();
    out.gain.value = 0.9; out.connect(AC.destination);
    const noise = (at, dur, freq, q, amp) => {
      const b = AC.createBuffer(1, Math.max(1, (AC.sampleRate * dur) | 0), AC.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.4);
      const s = AC.createBufferSource(); s.buffer = b;
      const f = AC.createBiquadFilter(); f.type = "bandpass";
      f.frequency.value = freq; f.Q.value = q;
      const g = AC.createGain(); g.gain.value = amp;
      s.connect(f); f.connect(g); g.connect(out);
      s.start(t0 + at);
    };
    noise(0,     0.045, 2300, 0.9, 0.30);   // curtain
    noise(0.068, 0.018, 3400, 1.4, 0.12);   // claw tick
    const o = AC.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(165, t0);
    o.frequency.exponentialRampToValueAtTime(68, t0 + 0.10);
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.30, t0 + 0.007);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g2); g2.connect(out);
    o.start(t0); o.stop(t0 + 0.13);
  } catch (e) {}
}
const hapEl = $("hap");
hapEl.addEventListener("pointerdown", () => $("shutter").classList.add("pressed"));
const unpress = () => $("shutter").classList.remove("pressed");
hapEl.addEventListener("pointerup", unpress);
hapEl.addEventListener("pointercancel", unpress);

/* shutter: crop the sensor to the exact 4:5 the frame shows (cover-centered)
   The develop never interrupts: the chip carries the news; the easel waits
   inside the print's first opening. */
$("shutterwrap").onclick = async () => {
  const v = $("video");
  if (!v.videoWidth || restarting || pending > 2) return;
  const vw = v.videoWidth, vh = v.videoHeight, A = aspect();
  let cw, ch;
  if (vw / vh > A) { ch = vh; cw = Math.round(vh * A); }
  else { cw = vw; ch = Math.round(vw / A); }
  const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
  const s = Math.min(1, MAX_NEG / Math.max(cw, ch));
  const c = document.createElement("canvas");
  c.width = Math.round(cw * s); c.height = Math.round(ch * s);
  c.getContext("2d").drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  $("flash").style.opacity = 1;
  setTimeout(() => $("flash").style.opacity = 0, 110);
  shutterVoice();
  try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.93));
  c.width = c.height = 0;
  pending++; paintChip();
  const id = String(Date.now());
  const seed = (Number(id) % 9000) + 1;
  try {
    const { jpg, secs } = await labDevelop(await blob.arrayBuffer(), seed);
    try { localStorage["t" + id] = secs || ""; } catch (e) {}
    const printBlob = new Blob([jpg], { type: "image/jpeg" });
    await put("prints", id, printBlob);          // as-developed until locked
    await put("prints", id + ":p", printBlob);   // pristine kept for the easel
    await put("thumbs", id, await makeThumb(printBlob));
    prints.push(id);
  } catch (e) { console.error(e); flagError(); }
  pending--; paintChip();
};
function flagError() {
  const chip = $("chip");
  chip.style.borderColor = "#7c2d12";
  setTimeout(() => chip.style.borderColor = "", 2500);
}

/* ---------- chip ---------- */
async function paintChip() {
  const chip = $("chip"); chip.innerHTML = "";
  const last = prints[prints.length - 1];
  if (last) {
    const t = await thumbOf(last);
    if (t) { const img = document.createElement("img"); img.src = mkURL(t);
             chip.appendChild(img); }
  }
  if (pending) {
    const b = document.createElement("div"); b.className = "busy";
    b.innerHTML = '<span class="dot"></span>';
    chip.appendChild(b);
  }
}
paintChip();
$("chip").onclick = () => { if (prints.length) openPrint(prints[prints.length - 1]); };

/* ---------- ring: the printer's easel ---------- */
const RT = { tS: 8, tMax: 40, wS: 8, wMax: 16, gap: 10,
             settleAt: 1500, settleMs: 450, breathAt: 250, lockAt: 3200 };
const rows = []; for (let t = RT.tMax; t >= -RT.tMax; t -= RT.tS) rows.push(t);  // green top
const cols = []; for (let w = -RT.wMax; w <= RT.wMax; w += RT.wS) cols.push(w);  // cool left
const RING = { id: null, secs: 1, tw: 0, th: 0, x: 0, y: 0, anim: 0,
               tiles: [], lim: null, busy: false, awake: false,
               heroing: false, reveal: false, timers: [] };

const S2L = new Float32Array(256);
for (let i = 0; i < 256; i++) { const x = i / 255;
  S2L[i] = x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
const L2S = new Uint8ClampedArray(4096);
for (let i = 0; i < 4096; i++) { const x = i / 4095;
  L2S[i] = Math.round(255 * (x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055)); }
const lutv = l => L2S[l <= 0 ? 0 : l >= 1 ? 4095 : Math.round(l * 4095)];
/* density-neutral by construction: gains mean exactly 1; matches worker bake() */
function tintPixels(d, wPct, tPct) {
  const t = tPct / 100, w = wPct / 100;
  const gr = 1 - t / 3 + w / 2, gg = 1 + 2 * t / 3, gb = 1 - t / 3 - w / 2;
  for (let i = 0; i < d.length; i += 4) {
    d[i]     = lutv(S2L[d[i]]     * gr);
    d[i + 1] = lutv(S2L[d[i + 1]] * gg);
    d[i + 2] = lutv(S2L[d[i + 2]] * gb);
  }
}

const colOf = w => cols.indexOf(w), rowOf = t => rows.indexOf(t);
function fieldPosFor(w, t) {
  const cx = (innerWidth - RING.tw) / 2, cy = (innerHeight - RING.th) / 2;
  return [cx - colOf(w) * (RING.tw + RT.gap), cy - rowOf(t) * (RING.th + RT.gap)];
}
function selOf(x, y) {
  const cx = (innerWidth - RING.tw) / 2, cy = (innerHeight - RING.th) / 2;
  let ci = Math.round((cx - x) / (RING.tw + RT.gap));
  let ri = Math.round((cy - y) / (RING.th + RT.gap));
  ci = Math.max(0, Math.min(cols.length - 1, ci));
  ri = Math.max(0, Math.min(rows.length - 1, ri));
  return [cols[ci], rows[ri]];
}
function applyXY(x, y) {
  RING.x = x; RING.y = y;
  $("ringfield").style.transform = "translate3d(" + x + "px," + y + "px,0)";
  fadeOpacities();
}
/* neighbors are progressive: at rest only the first ring breathes in;
   the far field materializes once the hand moves */
function fadeOpacities(yOff) {
  const cx = innerWidth / 2, cy = innerHeight / 2 + (yOff || 0);
  const ux = RING.tw + RT.gap, uy = RING.th + RT.gap;
  for (const c of RING.tiles) {
    const tx = RING.x + c._x + RING.tw / 2, ty = RING.y + c._y + RING.th / 2;
    const d = Math.hypot((tx - cx) / ux, (ty - cy) / uy);
    const o = (!RING.awake && d > 1.6) ? 0 : Math.max(0.05, Math.pow(0.5, d));
    c.style.opacity = o.toFixed(3);
  }
}
function setSel(w, t, animate) {
  const [X, Y] = fieldPosFor(w, t);
  if (animate === false) { applyXY(X, Y); return; }
  cancelAnimationFrame(RING.anim);
  const x0 = RING.x, y0 = RING.y, t0 = performance.now();
  const step = n => {
    const p = Math.min(1, (n - t0) / 180), e = 1 - Math.pow(1 - p, 3);
    applyXY(x0 + (X - x0) * e, y0 + (Y - y0) * e);
    if (p < 1) RING.anim = requestAnimationFrame(step);
  };
  RING.anim = requestAnimationFrame(step);
}

const later = (fn, ms) => { const h = setTimeout(fn, ms); RING.timers.push(h); return h; };
function ringHoldTimers() { for (const h of RING.timers) clearTimeout(h); RING.timers = []; }
function wakeRing() {                    /* any touch: the easel is yours */
  ringHoldTimers();
  const ret = $("reticle");
  ret.style.transition = "opacity .3s ease"; ret.style.opacity = 1;
  if (!RING.awake) { RING.awake = true; fadeOpacities(); }
  if (RING.heroing || $("ring").classList.contains("hero")) endHero(true);
}
function endHero(fast) {
  const ringNow = $("ring");
  if (!RING.heroing && !ringNow.classList.contains("hero")) return;
  RING.heroing = false;
  const hero = $("ringhero");
  if (fast || calmMotion) {
    $("ring").classList.remove("hero"); $("ring").classList.add("live");
    hero.style.transform = "none";
    afterSettle();
    return;
  }
  const bmp = { w: RING.pw, h: RING.ph };
  const cw = Math.min(innerWidth, innerHeight * bmp.w / bmp.h);
  const s = RING.tw / cw;
  hero.style.transform = "scale(" + s + ")";
  $("ring").classList.add("live");
  later(() => { $("ring").classList.remove("hero"); afterSettle(); }, RT.settleMs + 30);
}
function afterSettle() {
  if (!$("ring").classList.contains("on")) return;
  if (!RING.reveal) return;              // deliberate re-ring: no timers at all
  if (RING.awake) return;                // a touched easel never auto-locks
  later(breath, RT.breathAt);
  const ret = $("reticle");              // the closing window, wordless
  ret.style.transition = "opacity " + RT.lockAt + "ms linear";
  ret.style.opacity = 0.25;
  later(() => { if ($("ring").classList.contains("on")) autoLock(); }, RT.lockAt);
}
function breath() {                      /* one 6px exhale: "this moves" */
  if (calmMotion || RING.awake) return;
  const t0 = performance.now();
  const step = n => {
    if (RING.awake) { fadeOpacities(); return; }
    const p = Math.min(1, (n - t0) / 600);
    const off = -6 * Math.sin(Math.PI * p);
    $("ringfield").style.transform =
      "translate3d(" + RING.x + "px," + (RING.y + off) + "px,0)";
    fadeOpacities(-off);
    if (p < 1) RING.anim = requestAnimationFrame(step);
    else applyXY(RING.x, RING.y);
  };
  cancelAnimationFrame(RING.anim);
  RING.anim = requestAnimationFrame(step);
}
function autoLock() {
  const c = RING.tiles.find(x => Number(x.dataset.w) === 0 && Number(x.dataset.t) === 0);
  animateOut(c, 0, 0);
}
function animateOut(tileEl, w, t) {      /* the pick swells back to full frame */
  ringHoldTimers();
  if (tileEl && !calmMotion) {
    const cw = Math.min(innerWidth, innerHeight * RING.pw / RING.ph);
    tileEl.classList.add("chosen");
    tileEl.style.opacity = 1;
    tileEl.style.transform = "scale(" + (cw / RING.tw) + ")";
    for (const s of RING.tiles) if (s !== tileEl) s.style.opacity = 0;  // siblings fade as the pick grows
    later(() => lockRing(w, t), 430);
  } else lockRing(w, t);
}

async function openRing(id, w0, t0, reveal) {
  const pure = await get("prints", id + ":p") || await get("prints", id);
  if (!pure) return;
  ringHoldTimers();
  RING.id = id; RING.secs = Number(localStorage["t" + id]) || 1;
  RING.tiles = []; RING.busy = false; RING.awake = false;
  RING.reveal = !!reveal; RING.heroing = false;
  const bmp = await createImageBitmap(pure);
  RING.pw = bmp.width; RING.ph = bmp.height;
  const vw = innerWidth, vh = innerHeight;
  const tw = Math.round(Math.min(vw * 0.56, vh * 0.34 * bmp.width / bmp.height));
  const th = Math.round(tw * bmp.height / bmp.width);
  RING.tw = tw; RING.th = th;
  const base = document.createElement("canvas");
  base.width = Math.round(tw * 1.5); base.height = Math.round(th * 1.5);
  const bctx = base.getContext("2d", { willReadFrequently: true });
  bctx.drawImage(bmp, 0, 0, base.width, base.height);
  bmp.close();
  const baseData = bctx.getImageData(0, 0, base.width, base.height);
  base.width = base.height = 0;
  const field = $("ringfield");
  field.innerHTML = "";
  const ret = $("reticle");
  ret.style.transition = "opacity .3s ease"; ret.style.opacity = 1;
  ret.style.width  = (tw + 10) + "px"; ret.style.height = (th + 10) + "px";
  ret.style.left = ((vw - tw) / 2 - 5) + "px";
  ret.style.top  = ((vh - th) / 2 - 5) + "px";
  RING.lim = {
    minX: fieldPosFor(cols[cols.length - 1], rows[0])[0],
    maxX: fieldPosFor(cols[0], rows[0])[0],
    minY: fieldPosFor(cols[0], rows[rows.length - 1])[1],
    maxY: fieldPosFor(cols[0], rows[0])[1]
  };
  setSel(w0 || 0, t0 || 0, false);
  const ring = $("ring");
  ring.classList.remove("live", "hero");
  const hero = $("ringhero");
  hero.style.transition = "none"; hero.style.transform = "none";
  if (RING.reveal) {                     /* the print arrives first, as always */
    RING.heroing = true;
    const hi = $("ringheroimg");
    hi.classList.remove("fresh"); hi.src = mkURL(pure);
    void hi.offsetWidth; hi.classList.add("fresh");
    ring.classList.add("hero");
    requestAnimationFrame(() => { hero.style.transition = "transform " + RT.settleMs + "ms ease"; });
    later(() => endHero(false), calmMotion ? 60 : RT.settleAt);
  } else {
    ring.classList.add("live");
    RING.awake = true;                   /* re-ring: the whole field, no timers */
  }
  ring.classList.add("on");
  let idx = 0; const total = rows.length * cols.length, myId = id;
  const buildSome = () => {
    if (RING.id !== myId || !ring.classList.contains("on")) return;
    for (let n = 0; n < 6 && idx < total; n++, idx++) {
      const ri = Math.floor(idx / cols.length), ci = idx % cols.length;
      const t = rows[ri], w = cols[ci];
      const c = document.createElement("canvas");
      c.width = baseData.width; c.height = baseData.height;
      c.style.width = tw + "px"; c.style.height = th + "px";
      c._x = ci * (tw + RT.gap); c._y = ri * (th + RT.gap);
      c.style.left = c._x + "px"; c.style.top = c._y + "px";
      c.dataset.w = w; c.dataset.t = t;
      const d = new ImageData(new Uint8ClampedArray(baseData.data), baseData.width, baseData.height);
      tintPixels(d.data, w, t);
      c.getContext("2d").putImageData(d, 0, 0);
      field.appendChild(c); RING.tiles.push(c);
      if (w === 0 && t === 0) {
        const dot = document.createElement("i"); dot.id = "ringdot";
        dot.style.left = (c._x - 15) + "px";
        dot.style.top  = (c._y + th / 2 - 3.5) + "px";
        field.appendChild(dot);
      }
    }
    fadeOpacities();
    if (idx < total) requestAnimationFrame(buildSome);
  };
  buildSome();
}

async function lockRing(w, t) {
  if (RING.busy) return; RING.busy = true;
  ringHoldTimers();
  const id = RING.id;
  $("ring").classList.remove("on", "live", "hero");
  $("ringfield").innerHTML = ""; RING.tiles = [];
  try {
    if (w !== 0 || t !== 0) {
      const pure = await get("prints", id + ":p") || await get("prints", id);
      const { jpg } = await labBake(await pure.arrayBuffer(), w / 100, t / 100, RING.secs);
      const finalBlob = new Blob([jpg], { type: "image/jpeg" });
      await put("prints", id, finalBlob);
      await put("thumbs", id, await makeThumb(finalBlob));
    }                                    /* center lock: pristine stays, byte-for-byte */
    try { localStorage["wt" + id] = w + "," + t; } catch (e) {}
  } catch (e) { console.error(e); flagError(); }
  RING.busy = false;
  paintChip();
  openPrint(id);
}

let RD = null;
const ringEl = $("ring");
ringEl.addEventListener("pointerdown", e => {
  wakeRing();
  RD = { x: e.clientX, y: e.clientY, fx: RING.x, fy: RING.y, moved: false };
  cancelAnimationFrame(RING.anim);
  ringEl.setPointerCapture(e.pointerId);
});
ringEl.addEventListener("pointermove", e => {
  if (!RD) return;
  const dx = e.clientX - RD.x, dy = e.clientY - RD.y;
  if (Math.hypot(dx, dy) > 8) RD.moved = true;
  if (RD.moved && RING.lim) {
    applyXY(Math.max(RING.lim.minX, Math.min(RING.lim.maxX, RD.fx + dx)),
            Math.max(RING.lim.minY, Math.min(RING.lim.maxY, RD.fy + dy)));
  }
});
ringEl.addEventListener("pointerup", e => {
  if (!RD) return;
  const moved = RD.moved; RD = null;
  const [w, t] = selOf(RING.x, RING.y);
  if (moved) { setSel(w, t); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.parentElement === $("ringfield") && el.tagName === "CANVAS") {
    const ew = Number(el.dataset.w), et = Number(el.dataset.t);
    if (ew === w && et === t) animateOut(el, w, t);   // tap the reticle frame: lock
    else setSel(ew, et);                              // tap elsewhere: glide it in
  } else setSel(w, t);
});
ringEl.addEventListener("pointercancel", () => {
  if (!RD) return; RD = null;
  const [w, t] = selOf(RING.x, RING.y); setSel(w, t);
});
addEventListener("resize", () => {
  if ($("ring").classList.contains("on") && !RING.busy) {
    const [w, t] = selOf(RING.x, RING.y);
    openRing(RING.id, w, t, false);
  }
});

/* ---------- print view (save pre-armed for instant share) ---------- */
let current = null, stageURL = null, armedFile = null;
async function openPrint(id) {
  const pure = await get("prints", id + ":p");
  if (pure && !chosenOf(id)) {           /* unchosen: the reveal waits here */
    $("print").classList.remove("on");
    openRing(id, 0, 0, true);
    return;
  }
  current = id;
  const stage = $("stage"); stage.innerHTML = "";
  if (stageURL) { URL.revokeObjectURL(stageURL); urls.delete(stageURL); }
  const blob = await get("prints", id);
  if (!blob) return;
  const secs = localStorage["t" + id] || "";
  armedFile = new File([blob],
    "EMULSIFY-222" + (secs ? "-" + secs + "s" : "") + "-" + id.slice(-4) + ".jpg",
    { type: "image/jpeg" });
  const img = document.createElement("img");
  stageURL = mkURL(blob); img.src = stageURL;
  stage.appendChild(img);
  $("rering").style.visibility = pure ? "visible" : "hidden";

  const strip = $("strip"); strip.innerHTML = "";
  for (const k of [...prints].reverse().slice(0, 40)) {
    const t = await thumbOf(k); if (!t) continue;
    const b = document.createElement("button");
    if (k === id) b.className = "sel";
    const ti = document.createElement("img"); ti.src = mkURL(t);
    b.appendChild(ti); b.onclick = () => openPrint(k);
    strip.appendChild(b);
  }
  $("print").classList.add("on");
}
$("back").onclick = () => { $("print").classList.remove("on"); revokeAll(); paintChip(); };
$("rering").onclick = () => {
  if (!current) return;
  const wt = (chosenOf(current) || "0,0").split(",");
  $("print").classList.remove("on"); revokeAll();
  openRing(current, Number(wt[0]) || 0, Number(wt[1]) || 0, false);
};
$("save").onclick = () => {
  if (!armedFile) return;
  if (navigator.canShare && navigator.canShare({ files: [armedFile] })) {
    navigator.share({ files: [armedFile] }).catch(() => {});
  } else {
    const a = document.createElement("a");
    a.href = mkURL(armedFile); a.download = armedFile.name; a.click();
  }
};
