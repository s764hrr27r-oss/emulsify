*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--k);background-image:var(--grain);color:var(--w);
     font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif;
     font-weight:300;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}

/* ---------- camera (portrait-locked presentation) ---------- */
#camera{position:fixed;inset:0;display:flex;flex-direction:column;
        padding-top:env(safe-area-inset-top);
        transition:transform .26s var(--ease), opacity .24s var(--ease)}
body.paged #camera{transform:scale(.97)}
/* ---------- THE CAMERA BACK ----------
   A status panel of the kind that sits beside the eyepiece: frame count, the
   glass in front, the film speed, and whether the shutter is set. It is the
   thing that makes a small finder read as a finder rather than a bug. */
.top{height:36px;flex:0 0 auto;display:flex;align-items:center;padding:0 18px}
#backlcd{flex:1;display:flex;align-items:baseline;gap:5px;flex-wrap:nowrap;overflow:hidden;
  font:11px ui-monospace,Menlo,monospace;color:var(--mute);
  border:1px solid var(--hair);border-radius:5px;padding:4px 9px;
  background:rgba(255,255,255,.012);white-space:nowrap}
#backlcd .seg{font-size:12.5px;letter-spacing:.05em;color:#cfcdc7;flex:0 0 auto;display:inline-block;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#edgecode,#evrow .val{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#backlcd #lcdframe.late{color:#e0a050}
body.cocked #backlcd #lcdframe.late{color:#f0b060}
/* 5. ODOMETER: a changed digit arrives from below, the way a mechanical counter turns */
#backlcd .seg.tick{animation:odometer .42s cubic-bezier(.2,.8,.2,1)}
@keyframes odometer{0%{transform:translateY(9px);opacity:0;filter:blur(1px)}60%{opacity:1}100%{transform:none;filter:none}}
#backlcd .lbl{font-size:7.5px;letter-spacing:.14em;opacity:.55;margin-right:4px;flex:0 0 auto;transition:color .4s var(--ease),opacity .4s var(--ease)}
#backlcd .lbl.warn{color:#e0a050;opacity:.95;animation:warnpulse 1.8s ease-in-out infinite}
@keyframes warnpulse{0%,100%{opacity:.6}50%{opacity:1}}
#backlcd .state{margin-left:auto;font-size:8.5px;letter-spacing:.14em;opacity:.75;flex:0 0 auto;white-space:nowrap}
#backlcd .build{font-size:7.5px;letter-spacing:.04em;opacity:.3;margin-left:6px;flex:0 0 auto}
#backlcd.selftest .seg,#backlcd.selftest .state{color:#e6c37a;opacity:.85;text-shadow:0 0 6px rgba(229,180,90,.35)}
/* on the narrowest portrait widths the build yields before anything wraps */
@media (max-width: 400px) and (orientation: portrait){ #backlcd .build{display:none} }
body.cocked #backlcd .state{color:var(--ready);opacity:1}
body.cocked #backlcd{border-color:rgba(229,180,90,.45)}
#frame{flex:1;display:grid;place-items:center;min-height:0;padding:0 0 6px;position:relative}
/* ---------- THE POCKET UNIVERSE ----------
   When the shutter is set, something is lit behind the finder. Never shown
   directly: it leaks around the edges of the gate the way a lamp shows around
   a door. Five soft sources, emerald, ruby, tanzanite, gold, silver, drifting
   slowly against each other so the leak never settles, plus a slow breath.
   Everything about it is implied. If you can name a colour it is too strong. */
#aura{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;background:transparent;
  transition:opacity 1.4s var(--ease)}
/* Animating box-shadow re-rasterises the blur every frame, which on a phone
   is the difference between a camera and a space heater. So: two children,
   each holding one static shadow state, crossfading on opacity, which the
   compositor does for free. Same drift, no cost. */
#aura::before,#aura::after{content:"";position:absolute;inset:0;background:transparent;
  box-shadow:-20px -8px 46px 5px rgba(214,216,222,.055), 22px -10px 46px 5px rgba(214,216,222,.045),
             18px 20px 46px 5px rgba(214,216,222,.055), -18px 22px 46px 5px rgba(214,216,222,.05), 0 0 30px 2px rgba(236,238,242,.025)}
#aura::after{box-shadow:-12px 20px 46px 5px rgba(214,216,222,.05), -22px -10px 46px 5px rgba(214,216,222,.055),
             20px -16px 46px 5px rgba(214,216,222,.045), 18px 18px 46px 5px rgba(214,216,222,.055), 0 0 32px 2px rgba(236,238,242,.025);
             opacity:0}
body.cocked #aura{opacity:1;animation:seambreathe 3.4s ease-in-out infinite}
body.cocked #aura::before{animation:seamA 14s ease-in-out infinite alternate}
body.cocked #aura::after{animation:seamB 14s ease-in-out infinite alternate}
@keyframes seamA{from{opacity:1}to{opacity:0}}
@keyframes seamB{from{opacity:0}to{opacity:1}}
@keyframes seambreathe{0%,100%{filter:brightness(.85)}50%{filter:brightness(1.15)}}
body.released #aura{transition:opacity .4s var(--ease);opacity:0;animation:none}
#glass{position:relative;z-index:1}
/* SPARKLE. Tiny silver points scattered just inside the gate's edge, each one
   glinting on its own cycle, never two at once. They are the size of grain and
   nearly the brightness of nothing; you catch one in the corner of your eye
   and it is gone. Idle they do not exist. */
#sparkle{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .9s var(--ease);
  background-image:
    radial-gradient(circle at 3% 12%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
    radial-gradient(circle at 97% 9%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
    radial-gradient(circle at 5% 88%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
    radial-gradient(circle at 96% 91%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
    radial-gradient(circle at 2% 50%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px),
    radial-gradient(circle at 98% 44%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px),
    radial-gradient(circle at 48% 2%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px),
    radial-gradient(circle at 53% 98%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px),
    radial-gradient(circle at 12% 4%, rgba(255,236,200,.85) 0 .5px, transparent 1.1px),
    radial-gradient(circle at 90% 96%, rgba(255,236,200,.85) 0 .5px, transparent 1.1px),
    radial-gradient(circle at 7% 30%, rgba(240,242,246,.8) 0 .4px, transparent 1px),
    radial-gradient(circle at 94% 70%, rgba(240,242,246,.8) 0 .4px, transparent 1px)}
body.cocked #sparkle{opacity:1;animation:glint 7s linear infinite}
/* one mask sweeps the field so different points catch the light at different
   moments: a soft band of visibility travelling diagonally, everything outside
   it dark. Hence never all at once. */
@keyframes glint{
  0%{-webkit-mask-image:radial-gradient(circle at -20% -20%, #000 0 6%, transparent 14%);mask-image:radial-gradient(circle at -20% -20%, #000 0 6%, transparent 14%)}
  25%{-webkit-mask-image:radial-gradient(circle at 110% 10%, #000 0 6%, transparent 14%);mask-image:radial-gradient(circle at 110% 10%, #000 0 6%, transparent 14%)}
  50%{-webkit-mask-image:radial-gradient(circle at 90% 115%, #000 0 6%, transparent 14%);mask-image:radial-gradient(circle at 90% 115%, #000 0 6%, transparent 14%)}
  75%{-webkit-mask-image:radial-gradient(circle at -10% 90%, #000 0 6%, transparent 14%);mask-image:radial-gradient(circle at -10% 90%, #000 0 6%, transparent 14%)}
  100%{-webkit-mask-image:radial-gradient(circle at -20% -20%, #000 0 6%, transparent 14%);mask-image:radial-gradient(circle at -20% -20%, #000 0 6%, transparent 14%)}}
body.released #sparkle{transition:opacity .3s var(--ease);opacity:0}
/* the readouts turn gold and radiate when the shutter is set */
#backlcd .seg{transition:color .6s var(--ease), text-shadow .6s var(--ease)}
body.cocked #backlcd .seg{color:#e6c37a;
  text-shadow:0 0 5px rgba(236,196,106,.35), 0 0 14px rgba(229,180,90,.14)}
body.cocked #backlcd .lbl{color:#c9a862;opacity:.7;transition:color .6s var(--ease)}
body.cocked #backlcd{background:rgba(229,180,90,.02)}
/* ---------- EXPENSIVE LINES ----------
   A flat 1px hairline is a wireframe. A 1px line that carries a gradient,
   catches a highlight at one corner and falls to shadow at the other, is a
   jewelry box. Every outline gets the treatment; when the shutter is set the
   highlights turn to silver and gold and breathe, slightly out of phase, so
   nothing on the back of the camera is ever quite still. */
.deck::before,.lensbtn,#chip,#wind,#backlcd{
  border-color:transparent !important;
  background-image:linear-gradient(var(--edge-a,135deg),
     rgba(214,214,208,.30) 0%, rgba(96,96,92,.14) 38%, rgba(40,40,38,.18) 62%, rgba(196,196,190,.24) 100%);
  background-origin:border-box;background-clip:border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);mask-composite:exclude}
/* the ones that also hold content keep it: mask only the ring layer via a pseudo */
.lensbtn,#chip,#wind,#backlcd{-webkit-mask:none;mask:none;background-image:none;position:relative}
.lensbtn::after,#chip::after,#wind::after,#backlcd::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;
  pointer-events:none;padding:1px;
  background:linear-gradient(135deg, rgba(214,214,208,.34), rgba(96,96,92,.14) 40%, rgba(40,40,38,.16) 60%, rgba(196,196,190,.26));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask-composite:exclude;
  transition:opacity .6s var(--ease)}
/* set: silver brightens to a live sheen and breathes; the wind and panel go gold */
body.cocked .lensbtn::after,body.cocked #chip::after{
  background:linear-gradient(135deg, rgba(240,240,236,.85), rgba(150,150,146,.35) 42%, rgba(70,70,68,.3) 58%, rgba(230,230,226,.7));
  animation:silverbreath 3.2s ease-in-out infinite}
body.cocked #finder::after{animation-delay:-.6s}
body.cocked #lens::after{animation-delay:-1.3s}
body.cocked #ana::after{animation-delay:-2.1s}
body.cocked #chip::after{animation-delay:-1.7s}
@keyframes silverbreath{0%,100%{opacity:.55;filter:brightness(.9)}50%{opacity:1;filter:brightness(1.25)}}
body.cocked #wind::after,body.cocked #backlcd::after{
  background:linear-gradient(135deg, rgba(246,220,150,.9), rgba(196,150,70,.35) 40%, rgba(120,90,40,.3) 60%, rgba(236,196,106,.85));
  animation:goldshimmer 5s linear infinite;background-size:220% 220%}
@keyframes goldshimmer{0%{background-position:0% 0%}100%{background-position:100% 100%}}
/* the deck outline: a silver hairline that lights when set */
.deck::before{opacity:.75;transition:opacity .6s var(--ease)}
body.cocked .deck::before{opacity:1;
  background-image:linear-gradient(135deg, rgba(236,236,232,.55), rgba(120,120,116,.16) 40%, rgba(60,60,58,.18) 60%, rgba(220,220,216,.45))}
/* the shutter rim turns to metal when set */
#shutter{transition:opacity .25s var(--ease), box-shadow .6s var(--ease)}
body.cocked #shutter{box-shadow:0 0 0 1px rgba(236,236,232,.55), 0 0 0 3px rgba(20,20,20,1), 0 0 0 4px rgba(214,214,208,.35),
                     0 0 22px rgba(229,180,90,.18);animation:rimbreath 3.2s ease-in-out infinite}
@keyframes rimbreath{0%,100%{box-shadow:0 0 0 1px rgba(236,236,232,.45), 0 0 0 3px rgba(20,20,20,1), 0 0 0 4px rgba(214,214,208,.25), 0 0 18px rgba(229,180,90,.12)}
                     50%{box-shadow:0 0 0 1px rgba(246,246,242,.85), 0 0 0 3px rgba(20,20,20,1), 0 0 0 4px rgba(226,226,220,.5), 0 0 30px rgba(229,180,90,.26)}}
/* THE GRID IS LIT. Not thicker: a 1px white core that carries a radiant
   sheath, the way a blade of light does. The core is constant; only the
   sheath breathes, and it breathes slowly and barely, so the lines feel alive
   rather than blink. Two shadows: a tight warm halo and a wide faint one. */
body.cocked.f-grid #lockgrid{
  filter:drop-shadow(0 0 1.6px rgba(255,236,200,.62)) drop-shadow(0 0 8px rgba(236,150,60,.20));
  animation:lockin .5s cubic-bezier(.16,.9,.22,1) both, saber 3.6s ease-in-out .5s infinite}
/* THE RANGEFINDER PATCH, set: the small rectangle is the hottest thing on the
   glass. Its border goes from cool blue to a warm white core with a fire sheath
   heavier than the grid's, and it breathes faster. The corner brackets take a
   lesser share of the same heat. */
#rf b{transition:border-color .5s var(--ease), filter .5s var(--ease)}
body.cocked #rf b{border-color:rgba(59,130,246,.95);   /* the patch keeps its blue */
  filter:drop-shadow(0 0 2px rgba(255,220,170,.85)) drop-shadow(0 0 9px rgba(240,140,50,.42)) drop-shadow(0 0 22px rgba(236,120,40,.22));
  animation:rfire 2.6s ease-in-out .4s infinite}
@keyframes rfire{
  0%,100%{filter:drop-shadow(0 0 2px rgba(255,220,170,.80)) drop-shadow(0 0 8px rgba(240,140,50,.36)) drop-shadow(0 0 20px rgba(236,120,40,.18))}
  50%{filter:drop-shadow(0 0 3px rgba(255,232,190,1)) drop-shadow(0 0 14px rgba(244,140,44,.58)) drop-shadow(0 0 30px rgba(236,120,40,.34))}}
body.cocked #rf i{border-color:rgba(255,236,206,.9);
  filter:drop-shadow(0 0 1.5px rgba(255,220,170,.6)) drop-shadow(0 0 7px rgba(236,140,50,.26));
  animation:rfire2 2.6s ease-in-out 1.0s infinite}
@keyframes rfire2{
  0%,100%{filter:drop-shadow(0 0 1.5px rgba(255,220,170,.55)) drop-shadow(0 0 6px rgba(236,140,50,.22))}
  50%{filter:drop-shadow(0 0 2.2px rgba(255,232,190,.85)) drop-shadow(0 0 11px rgba(244,140,44,.40))}}
/* fire, not gold: the sheath runs amber into orange, and the outer glow is the
   part that moves. The 1px white core still never changes. */
@keyframes saber{
  0%,100%{filter:drop-shadow(0 0 1.6px rgba(255,236,200,.56)) drop-shadow(0 0 7px rgba(236,150,60,.16))}
  50%{filter:drop-shadow(0 0 2.4px rgba(255,240,210,.80)) drop-shadow(0 0 12px rgba(240,140,50,.30))}}
/* the corner marks breathe with it, a beat behind */
body.cocked #tension i{animation:drawin .34s var(--ease) both, cornerglow 4.2s ease-in-out 1.2s infinite}
@keyframes cornerglow{
  0%,100%{box-shadow:0 0 6px rgba(236,150,60,.26)}
  50%{box-shadow:0 0 12px rgba(240,140,50,.44)}}
/* THE LEVEL. A short hairline at the centre of the gate that tilts with the
   phone. Silver while off, gold when the horizon is within a degree. Only
   while the shutter is set, and only if the phone agrees to say which way is
   down. The kind of thing you stop noticing until the day you need it. */
#level{position:absolute;left:50%;top:50%;width:26%;height:0;translate:-50% 0;pointer-events:none;
  opacity:0;transition:opacity .5s var(--ease)}
#level i{position:absolute;left:0;right:0;top:-.5px;height:1px;background:rgba(214,216,222,.55);
  transform-origin:50% 50%;transition:background .3s var(--ease), box-shadow .3s var(--ease)}
#level::before,#level::after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;
  border:1px solid rgba(214,216,222,.5);background:transparent}
#level::before{left:-7px} #level::after{right:-7px}
body.cocked.haslevel #level{opacity:1}
#level.true i{background:rgba(236,196,106,.95);box-shadow:0 0 6px rgba(229,180,90,.45)}
#level.true::before,#level.true::after{border-color:rgba(236,196,106,.9)}
/* On a 3x screen a 1px CSS line is three device pixels. A hairline should be
   one. Every line that is meant to be fine is drawn at a third of a pixel
   where the screen can do it, which keeps the white core of the grid a true
   core and lets the sheath do the glowing. */
@media (min-resolution: 2dppx){
  #lockgrid{background:
   linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to right, transparent calc(66.66% - .5px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + .5px)),
   linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + .5px))}
  #level i{height:.5px}
  #rf b{border-width:.5px}
  .lensbtn::after,#chip::after,#wind::after,#backlcd::after{padding:.5px}
}
/* the tension corners pick up the same warmth */
body.cocked #tension i{border-color:rgba(255,240,205,.95);
  box-shadow:0 0 8px rgba(229,180,90,.35)}
@keyframes bootin{from{opacity:0;transform:scale(.965)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#chips{animation:rise .5s var(--ease) both .08s}
#shutterwrap{animation:rise .5s var(--ease) both .16s}
#rightstack{animation:rise .5s var(--ease) both .24s}
.ghost{opacity:0 !important;pointer-events:none}
#glass{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#000;
       animation:bootin .5s var(--ease) both}
#screen{position:absolute;inset:0;transform-origin:50% 50%;overflow:hidden;
        transition:transform .58s cubic-bezier(.16,.9,.22,1),
                   box-shadow .4s var(--ease),border-radius .5s var(--ease)}
#glass video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             opacity:0;transition:opacity .4s var(--ease)}
/* idle: the finder is a small bright window in the middle of the camera back */
body:not(.cocked) #screen{transform:scale(.26);border-radius:3px;
                          box-shadow:0 0 0 1px rgba(255,255,255,.28), 0 0 26px rgba(0,0,0,.9)}
body.cocked #screen{transform:none;border-radius:0}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 26px 6px rgba(0,0,0,.72), inset 0 0 4px rgba(0,0,0,.6);
  border-radius:inherit;opacity:1;transition:opacity .5s var(--ease)}
body.cocked #screen::after{opacity:0}
body.released #screen{transition:transform .24s cubic-bezier(.5,0,.9,.4)}
#glass video.live{opacity:1}
/* ---------- finder overlays ----------
   Each mode draws only under its own body class, so no mode is "the absence
   of the others" - that pattern is what let RF and OFF look identical for a
   while. The marks themselves are as they were: b70 restyled the grid and the
   rangefinder and both were worse. */
#grid{position:absolute;inset:0;pointer-events:none;display:none;opacity:.5;
  background:
   linear-gradient(to right, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to right, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px)),
   linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px))}
body.f-grid #grid{display:block}
/* QUADRANTS - halves rather than thirds. Same weight as the grid on purpose:
   it is the same kind of mark, just two lines instead of four. */
#quad{position:absolute;inset:0;pointer-events:none;display:none;opacity:.5;
  background:
   linear-gradient(to right, transparent calc(50% - .5px), rgba(244,242,237,.45) 50%, transparent calc(50% + .5px)),
   linear-gradient(to bottom, transparent calc(50% - .5px), rgba(244,242,237,.45) 50%, transparent calc(50% + .5px))}
body.f-quad #quad{display:block}
/* SPOT - a reticle, not a grid, so it is drawn at full strength like the
   rangefinder marks. Width is a percentage of the glass, so it stays a circle
   and cannot collapse the way a bare aspect-ratio box would. */
#spot{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;
      translate:-50% -50%;display:none;pointer-events:none;
      border:1px solid rgba(244,242,237,.65);border-radius:50%}
body.f-spot #spot{display:block}
#spot::before{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;
  translate:-50% -50%;border-radius:50%;background:rgba(244,242,237,.85)}
#spot i{position:absolute;background:rgba(244,242,237,.85)}
#spot i:nth-child(-n+2){left:50%;width:1px;height:26%;translate:-50% 0}
#spot i:nth-child(1){top:-38%}
#spot i:nth-child(2){bottom:-38%}
#spot i:nth-child(n+3){top:50%;height:1px;width:26%;translate:0 -50%}
#spot i:nth-child(3){left:-38%}
#spot i:nth-child(4){right:-38%}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;
       translate:-50% -50%;display:none;pointer-events:none;
       filter:drop-shadow(0 0 1.4px rgba(0,0,0,.8))}
body.f-cross #cross{display:block}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(244,242,237,.85)}
/* a gap at dead centre: a solid cross hides the very thing it points at */
#cross::before{left:0;right:0;top:50%;height:1px;
  -webkit-mask:linear-gradient(to right,#000 0 38%,transparent 38% 62%,#000 62% 100%);
          mask:linear-gradient(to right,#000 0 38%,transparent 38% 62%,#000 62% 100%)}
#cross::after{top:0;bottom:0;left:50%;width:1px;
  -webkit-mask:linear-gradient(to bottom,#000 0 38%,transparent 38% 62%,#000 62% 100%);
          mask:linear-gradient(to bottom,#000 0 38%,transparent 38% 62%,#000 62% 100%)}
#anawarn{position:absolute;inset:0;z-index:4;display:none;pointer-events:none;
   background:#000;place-items:center;align-content:center;gap:18px;
   color:var(--mute);animation:bootin .4s var(--ease) both}
#anawarn.on{display:grid}
#anawarn svg{animation:breathe 2.4s ease-in-out infinite;transform:scaleX(-1)}
#anawarn span{font-family:ui-monospace,Menlo,monospace;font-size:11px;
   letter-spacing:.14em;text-align:center;padding:0 24px;opacity:.85}
#evrow{position:absolute;left:10px;top:50%;translate:0 -50%;height:min(58%,300px);
  width:34px;display:grid;justify-items:center;touch-action:none;z-index:2}
#evrow .track{position:relative;width:1px;height:100%;background:var(--hair)}
#evrow .tick{position:absolute;top:50%;left:-3px;height:1px;width:7px;
  background:var(--mute);opacity:.6}
#evrow .fill{position:absolute;left:0;width:1px;background:var(--dot)}
#evrow .thumb{position:absolute;left:50%;top:50%;width:12px;height:12px;
  border-radius:50%;background:var(--w);translate:-50% -50%;
  transition:translate .18s var(--ease)}
#evrow .val{position:absolute;left:14px;top:50%;translate:0 -50%;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;
  color:var(--dot);opacity:0;transition:opacity .22s var(--ease)}
#evrow.live .val{opacity:1}
@media(prefers-reduced-motion:reduce){#evrow .thumb,#evrow .val{transition:none}}
#rf{position:absolute;inset:0;pointer-events:none;display:none}
body.f-rf #rf{display:block}
#rf i{position:absolute;width:18px;height:18px;border:0 solid rgba(244,242,237,.8)}
#rf i:nth-child(1){left:7%;top:7%;border-left-width:2px;border-top-width:2px}
#rf i:nth-child(2){right:7%;top:7%;border-right-width:2px;border-top-width:2px}
#rf i:nth-child(3){left:7%;bottom:7%;border-left-width:2px;border-bottom-width:2px}
#rf i:nth-child(4){right:7%;bottom:7%;border-right-width:2px;border-bottom-width:2px}
#rf b{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:5/3;
      translate:-50% -50%;border:1px solid rgba(59,130,246,.75)}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .1s}
/* in slow light the shutter's halo turns amber: the shake warning lives on
   the button you are about to press */
body.cocked.slowlight #shutter{box-shadow:0 0 0 1px rgba(236,236,232,.55), 0 0 0 3px rgba(20,20,20,1), 0 0 0 4px rgba(224,160,80,.55),
                              0 0 26px rgba(236,150,60,.30);animation:none}
/* asleep: the finder and the back fall away until touched */
body.sleep #glass{filter:brightness(.22) saturate(.5) !important;transition:filter 1.6s var(--ease)}
body.sleep .deck,body.sleep #backlcd{opacity:.3 !important;transition:opacity 1.6s var(--ease)}
body.sleep #aura,body.sleep #sparkle{opacity:0 !important}
/* the back is open: dark while the roll rewinds, the film running backwards */
body.rewinding #glass{filter:brightness(.04) !important;transition:filter .35s var(--ease)}
body.rewinding #backlcd .seg{color:var(--mute);text-shadow:none}
body.rewinding #lcdframe{color:#e0a050 !important}
body.rewinding #lcdstate{color:var(--ready)}
body.rewinding #wind .perf{animation:filmback .5s linear infinite;transition:none}
@keyframes filmback{from{transform:translateX(0)}to{transform:translateX(20px)}}
/* a digit arriving from above: the counter running down */
#backlcd .seg.down{animation:odometerdown .12s cubic-bezier(.2,.8,.2,1)}
@keyframes odometerdown{0%{transform:translateY(-7px);opacity:.2}100%{transform:none;opacity:1}}
/* the roll letter turns over like a card */
#backlcd .seg.flip{animation:rollflip .52s cubic-bezier(.3,.7,.2,1)}
@keyframes rollflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg);opacity:.3}51%{opacity:.3}100%{transform:rotateX(0);opacity:1}}
/* ---------- THE ADVANCE ----------
   A camera will not fire until the film is wound on. The strip below the
   finder is that wind: pressing it drags one frame of perforations past and
   cocks the shutter. The finder tightens while cocked and lets go when the
   frame is taken, which is the whole tension of shooting film. */
#windwrap{display:block;position:relative;width:100%;margin:0;height:34px}
#haw{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
     -webkit-appearance:auto;border-radius:8px}   /* native switch = real Taptic on iOS */
#wind{display:block;width:100%;margin:0;height:34px;position:relative;
  background:none;border:1px solid rgba(229,180,90,.30);border-radius:8px;overflow:hidden;padding:0;
  -webkit-tap-highlight-color:transparent}
#wind .perf{position:absolute;inset:0;
  background-image:radial-gradient(circle at 10px 50%, var(--hair) 0 3.2px, transparent 3.3px);
  background-size:20px 100%;background-repeat:repeat-x;opacity:.85;
  /* the sprocket holes sit one pitch further along for every frame on the
     roll, so the film is visibly somewhere in its travel; a new roll snaps back */
  background-position-x:calc(var(--film,0) * -20px);
  transform:translateX(0);transition:background-position-x .6s var(--ease)}
#wind b{position:absolute;inset:0;display:grid;place-items:center;
  font:9px ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--ready);opacity:.62}
#wind:active{border-color:var(--ready)}
#wind.winding .perf{transition:transform .58s cubic-bezier(.18,.85,.28,1);transform:translateX(-60px)}
#wind.winding b{opacity:.25}
body.cocked #wind{border-color:var(--ready);opacity:.72}
body.cocked #wind b{color:var(--ready)}
/* THE TINY FINDER. Between frames the camera has only a small bright window
   of the scene, sharp and real, sitting in the middle of the dark. Winding on
   enlarges it to the full gate over exactly the length of the lever stroke, so
   the picture grows while the ratchet runs. */
#glass{transition:transform .3s var(--ease), filter .34s var(--ease)}
body:not(.cocked) #glass{filter:brightness(.9) saturate(.9) contrast(.98)}
body:not(.cocked) #grid,body:not(.cocked) #quad{opacity:.10}
body:not(.cocked) #rf,body:not(.cocked) #spot,body:not(.cocked) #cross{opacity:.2}
body.cocked #glass{filter:brightness(1.04) saturate(1.05) contrast(1.02)}
body:not(.cocked) .deck{opacity:.6;transition:opacity .3s var(--ease)}
.deck,#backlcd{filter:brightness(var(--ambient,1));transition:filter 1.2s var(--ease)}
/* LOCK IN: the grid goes from a grey suggestion to a hard white frame line.
   Idle it is barely there; set, it is the brightest thing on the glass. */
#lockgrid{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:
   linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + 1px)),
   linear-gradient(to right, transparent calc(66.66% - 1px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + 1px)),
   linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + 1px)),
   linear-gradient(to bottom, transparent calc(66.66% - 1px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + 1px));
  transition:opacity .3s var(--ease)}
body.cocked.f-grid #lockgrid{opacity:1;animation:lockin .5s cubic-bezier(.16,.9,.22,1) both}
@keyframes lockin{0%{transform:scale(1.2);opacity:0;filter:blur(2px)}
                  55%{opacity:1;filter:blur(0)}
                  72%{transform:scale(.992)}
                  100%{transform:none;opacity:1;filter:blur(0)}}
body.released #lockgrid{animation:lockout .32s var(--ease) both}
@keyframes lockout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.9);filter:blur(1.5px)}}
/* tension: corner marks that draw in when the shutter is cocked */
#tension{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .28s var(--ease)}
#tension i{position:absolute;width:20px;height:20px;border:2px solid rgba(255,255,255,.95)}
#tension i:nth-child(1){top:10px;left:10px;border-right:0;border-bottom:0}
#tension i:nth-child(2){top:10px;right:10px;border-left:0;border-bottom:0}
#tension i:nth-child(3){bottom:10px;left:10px;border-right:0;border-top:0}
#tension i:nth-child(4){bottom:10px;right:10px;border-left:0;border-top:0}
body.cocked #tension{opacity:1}
body.cocked #tension i{animation:drawin .34s var(--ease) both}
@keyframes drawin{from{transform:translate(var(--dx,0),var(--dy,0)) scale(1.9);opacity:0}
                  to{transform:none;opacity:1}}
/* the finder itself leans in while cocked, and lets go on release */

body.cocked #grid,body.cocked #quad{opacity:.85}
body.released #glass{animation:letgo .42s cubic-bezier(.34,1.56,.64,1) both}
@keyframes letgo{0%{transform:scale(1.012)}45%{transform:scale(.994)}100%{transform:none}}
/* shutter sits dark until the film is wound */
#shutter{transition:opacity .25s var(--ease)}
body:not(.cocked) #shutter{opacity:.38}
#wind.nudge{animation:nudge .3s}
/* ASKING. Everything else on the idle back is still, so the one thing that
   moves is the thing to press. The label breathes on a long cycle, the border
   with it, both faint. It is not a blink; it is a pulse you notice after a
   moment of looking. */
body:not(.cocked) #wind b{animation:askglow 4.6s ease-in-out infinite}
@keyframes askglow{0%,100%{opacity:.5;text-shadow:none}
                   50%{opacity:.95;text-shadow:0 0 8px rgba(229,180,90,.45)}}
body:not(.cocked) #wind::after{animation:askring 4.6s ease-in-out infinite}
@keyframes askring{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#denied{position:absolute;inset:0;display:none;place-items:center;
        font-size:13px;color:var(--mute);text-align:center;padding:40px}
.deck{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;row-gap:14px;
      align-items:center;padding:16px 34px calc(22px + env(safe-area-inset-bottom));position:relative}
#windwrap{grid-column:1 / -1;grid-row:1}
#chips{grid-row:2;grid-column:1}
#shutterwrap{grid-row:2;grid-column:2}
#rightstack{grid-row:2;grid-column:3}
.deck::before{content:"";position:absolute;pointer-events:none;
      inset:6px 16px calc(env(safe-area-inset-bottom) + 10px);
      border:1px solid var(--hair);border-radius:16px}
#chips{display:flex;gap:10px;align-items:center;justify-self:start}
#rightstack{justify-self:end;display:flex;flex-direction:column;gap:10px;align-items:center}
#shutterwrap{justify-self:center}
#chip{width:46px;height:46px;border-radius:5px;border:1px solid var(--hair);
      overflow:hidden;position:relative;display:grid;place-items:center;flex:0 0 auto}
#chip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
          transition:opacity .22s var(--ease)}
#chip img.step{animation:stepup 2.4s var(--ease) both}
#chip .scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
#chip .play{position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:0;height:0;border-left:9px solid rgba(244,242,237,.92);
  border-top:6px solid transparent;border-bottom:6px solid transparent;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.8));pointer-events:none}
#chip.hasimg .play{opacity:.85}
#chip .dot{position:relative;display:none}
#chip.cooking .dot{display:inline-block}
#chip .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#chip,#strip button{transition:transform .22s var(--ease)}
#chip:active,#strip button:active{transform:scale(.94);transition-duration:.07s}
#back:active{opacity:.55}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes chipin{from{opacity:0;transform:scale(.9)}}
@keyframes stepup{
  from{opacity:0;filter:brightness(1.65) contrast(.55) saturate(.85)}
  55%{opacity:1}
  to{opacity:1;filter:none}}
#shutterwrap{position:relative;flex:0 0 auto}
#shutter{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--w);
         display:grid;place-items:center}
#shutter i{width:64px;height:64px;border-radius:50%;background:var(--w);
           display:block;transition:transform .22s var(--ease)}
#shutter:active i, #shutter.pressed i{transform:scale(.88);transition-duration:.07s}
/* a real, invisible native switch rides the shutter: the finger's own tap
   toggles it, so iOS plays the Taptic tick — no script, nothing to patch */
#hap{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
     clip-path:circle(50%);-webkit-appearance:auto}
.lensbtn{position:relative;width:46px;height:46px;flex:0 0 auto;border-radius:50%;
  transition:opacity .3s var(--ease);
  border:1px solid var(--hair);color:var(--mute);
  font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.05em}
.lensbtn.locked{opacity:.45}
.lensbtn img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);
  object-fit:contain;pointer-events:none;display:block}
.lensbtn:active{color:var(--w);border-color:var(--mute)}
#anamenu{left:24px;right:auto}
#lensmenu,#anamenu,#findermenu{position:fixed;display:none;flex-direction:column;gap:2px;z-index:12;
  background-color:var(--k);background-image:var(--grain);
  border:1px solid var(--hair);border-radius:14px;
  padding:8px 4px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 106px)}

#lensmenu button,#anamenu button,#findermenu button{font-family:ui-monospace,Menlo,monospace;font-size:12px;
  letter-spacing:.05em;color:var(--mute);padding:8px 18px;border-radius:8px;
  position:relative}
.hapov{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
       -webkit-appearance:auto}
#lensmenu button.cur,#anamenu button.cur,#findermenu button.cur{color:var(--dot)}
#lensmenu button:disabled,#anamenu button:disabled,#findermenu button:disabled{opacity:.25}
#lensveil{position:fixed;inset:0;display:none;z-index:11}
#lensveil.on{display:block}
#lensmenu,#anamenu,#findermenu{display:flex;opacity:0;pointer-events:none;
  transform:translateY(8px) scale(.97);
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
#lensmenu.on,#anamenu.on,#findermenu.on{opacity:1;pointer-events:auto;transform:none}

/* ---------- landscape: 5:4 horizontal format, controls on the right ---------- */
@media (orientation: landscape){
  /* the back panel keeps its row in landscape, sized down, and spans only the
     gate's width so it never runs under the deck or the version */
  .top{height:26px;padding:0}
  /* four exposed edges instead of two: the seam carries a third of the light here */
  body.cocked #aura{opacity:.34}
  #backlcd{position:absolute;top:calc(3px + env(safe-area-inset-top));
           left:calc(43px + env(safe-area-inset-left));right:calc(189px + env(safe-area-inset-right));
           flex:none;padding:2px 10px;gap:5px}
  #backlcd .seg{font-size:12px}
  #backlcd .lbl{font-size:7.5px;margin-right:4px}
  #backlcd .state{font-size:8.5px}
  body.flip #backlcd{left:calc(189px + env(safe-area-inset-left));right:calc(43px + env(safe-area-inset-right))}
  body.ana #backlcd{left:calc(6px + env(safe-area-inset-left));right:calc(184px + env(safe-area-inset-right))}
  body.flip.ana #backlcd{left:calc(184px + env(safe-area-inset-left));right:calc(6px + env(safe-area-inset-right))}

  #frame{padding:0 calc(189px + env(safe-area-inset-right))
                 0 calc(43px + env(safe-area-inset-left))}
  #glass{width:auto;height:100%;aspect-ratio:5/4}
  /* one dimension must be real: aspect-ratio alone cannot size a box whose
     only child is absolutely positioned, and it collapsed to nothing. The
     frame is width-limited at every squeeze on a phone, so take the width
     and let the ratio give the height. */
  body.ana #glass{width:100%;height:auto;max-height:100%;
                  aspect-ratio:calc(1.25 * var(--sq, 1))}
  body.ana #frame{padding:0 calc(184px + env(safe-area-inset-right))
                    0 calc(6px + env(safe-area-inset-left))}
  body.flip.ana #frame{padding:0 calc(6px + env(safe-area-inset-right))
                         0 calc(184px + env(safe-area-inset-left))}
  body.ana #glass video{right:auto;left:50%;translate:-50% 0;
                        width:calc(100% / var(--sq, 1))}
  .deck{position:absolute;top:0;bottom:0;
        right:calc(38px + env(safe-area-inset-right));width:138px;
        display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto auto 1fr;
        align-items:center;justify-items:center;padding:34px 12px;gap:12px 0}
  /* the strip sits IN the column, between the lens pair and the shutter. It
     is a short horizontal strip here, same perforations as portrait, because
     the column is only 138px wide and a vertical rail beside it was the wrong
     place from the start. */
  #windwrap{position:static;width:100%;height:30px;margin:0;grid-column:auto;grid-row:auto;order:1}
  #wind{height:30px}
  #wind b{font-size:8px;letter-spacing:.14em}
  #chips,#shutterwrap,#rightstack{grid-column:auto;grid-row:auto}
  #chips,#shutterwrap,#rightstack{justify-self:center}
  #rightstack{flex-direction:row;align-self:start}
  #chips{align-self:end}
  /* clockwise turn: the phone's bottom edge is now on the LEFT, so the deck
     goes with it and the gate padding mirrors. The deck's INTERNAL layout does
     not mirror - b65: flipping align-self here without also flipping `order`
     only dragged both groups to the inner edge of their row, collapsing the
     232px gap above the lens pair. The deck now reads identically in both
     landscapes: lens pair pinned to the top, chip + ana pinned to the bottom. */
  body.flip .deck{right:auto;left:calc(38px + env(safe-area-inset-left))}
  body.flip #frame{padding:0 calc(43px + env(safe-area-inset-right))
                     0 calc(189px + env(safe-area-inset-left))}
  .deck::before{inset:16px 6px}
  /* the original landscape order, restored in b93: lens pair at the top,
     shutter in the middle, gallery and OFF at the bottom. b89 reversed this
     under a mistaken reading of portrait and the owner caught it. */
  #rightstack{order:0}
  #shutterwrap{order:2}
  #chips{order:3;flex-direction:column}
  .spacer{display:none}
  #lensmenu,#anamenu,#findermenu{right:calc(env(safe-area-inset-right) + 190px);left:auto;
            bottom:auto;top:50%;translate:0 -50%}
  body.flip #lensmenu,body.flip #anamenu,body.flip #findermenu{
            right:auto;left:calc(env(safe-area-inset-left) + 190px)}
}

/* ---------- print ---------- */
#print{position:fixed;inset:0;background:var(--k);background-image:var(--grain);
       display:flex;flex-direction:column;
       z-index:10;padding-top:env(safe-area-inset-top);

  border-left:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);
  transform:rotate(45deg)}
.barx{margin-left:auto;display:flex;gap:6px;align-items:center}
/* the edge code: roll letter and frame, the way they are printed along the
   film's rebate. Gold, small, beside the back button. */
#edgecode{margin-left:14px;font:10px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#c9a862;opacity:.85}

           -webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;
           opacity:0;transition:opacity .22s var(--ease),transform .3s var(--ease)}
#stage img.in{opacity:1}
#stage img.watch{-webkit-touch-callout:none;user-select:none;
                 -webkit-user-select:none;pointer-events:none}
/* THE BATH: the print comes up the way a print comes up — blank paper, then
   the dye clouds forming over each other. Yellow develops first (it sits on
   top of the pack), then magenta, then cyan; the three multiply back to
   exactly the finished print, so the hand-off at the end is pixel-identical. */
.bath{position:absolute;inset:0;isolation:isolate;pointer-events:none;
      opacity:0;transform:scale(.965);
      transition:opacity .55s var(--ease),transform 1.6s var(--ease)}
.bath.on{opacity:1;transform:none}
.bath img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bath img.paper{filter:brightness(0) invert(1)}
.bath img.y,.bath img.m,.bath img.c{mix-blend-mode:multiply;opacity:0}
.bath img.y{filter:url(#dyeY);animation:dyein 1.15s var(--ease) .22s forwards}
.bath img.m{filter:url(#dyeM);animation:dyein 1.25s var(--ease) .62s forwards}
.bath img.c{filter:url(#dyeC);animation:dyein 1.40s var(--ease) 1.05s forwards}
@keyframes dyein{to{opacity:1}}
/* a print already seen doesn't need the whole bath again — same three dyes,
   same order, a third of the time: a nod to how it got here */
.bath.quick{transition:opacity .20s var(--ease),transform .70s var(--ease)}
.bath.quick img.y{animation-duration:.40s;animation-delay:.06s}
.bath.quick img.m{animation-duration:.44s;animation-delay:.20s}
.bath.quick img.c{animation-duration:.48s;animation-delay:.34s}
@keyframes comeup{from{opacity:0;filter:brightness(1.8) contrast(.4)}to{opacity:1;filter:none}}
#stage img.fresh{animation:comeup 1.2s ease-out both}
@media(prefers-reduced-motion:reduce){#stage img.fresh{animation:none}}
#print .foot{position:absolute;left:0;right:0;bottom:0;display:flex;
             justify-content:center;pointer-events:none;
             padding:12px 0 calc(14px + env(safe-area-inset-bottom));
             background:linear-gradient(transparent, rgba(10,10,10,.55))}
#strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:0 22px;
       -webkit-overflow-scrolling:touch;pointer-events:auto}
#strip button{flex:0 0 auto;width:44px;height:44px;border-radius:5px;overflow:hidden;
              border:1px solid transparent}
#strip button.sel{border-color:var(--dot)}
#strip button{position:relative}
#strip .tw{position:relative;flex:0 0 auto;width:44px;height:44px}
#strip .tw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
                 -webkit-appearance:auto;border-radius:5px}
#strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#strip img.step{animation:stepup 2.4s var(--ease) both}
#strip .scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
#strip .dot{position:relative;width:6px;height:6px}
#strip .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#strip button.cook{display:grid;place-items:center}
@media (orientation: landscape){
  #print{padding-top:0}
  #print .bar{position:absolute;top:0;left:0;right:0;z-index:2;
              padding:calc(6px + env(safe-area-inset-top)) 14px 6px}
}

@media(prefers-reduced-motion:reduce){
  #print,#stage img,#lensmenu,#chips,#shutterwrap,#rightstack,
  #chip,#chip img,#strip button,#strip img,
  .bath,.bath img{transition:none;animation:none}
</style>

<script type="module">
const $ = id => document.getElementById(id);
const MAX_NEG = 2200;
const aspect = () => matchMedia("(orientation: landscape)").matches ? 5/4 : 4/5;
const calmMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- store ---------- */
const DB = await new Promise((res, rej) => {
  const q = indexedDB.open("emulsify-one", 3);
  q.onupgradeneeded = () => {
    const db = q.result;
    if (!db.objectStoreNames.contains("prints")) db.createObjectStore("prints");
    if (!db.objectStoreNames.contains("thumbs")) db.createObjectStore("thumbs");
    if (!db.objectStoreNames.contains("negs"))   db.createObjectStore("negs");
  };
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
});
const put = (s, k, v) => new Promise((res, rej) => {
  try {
    if (!DB.objectStoreNames.contains(s)) return res();   // store missing: skip
    const t = DB.transaction(s, "readwrite");
    t.objectStore(s).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error);
  } catch (e) { res(); }                                   // archival never blocks
});
const get = (s, k) => new Promise((res, rej) => {
  const r = DB.transaction(s).objectStore(s).get(k);
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
/* prints listing skips easel side-records (keys with ":") */
const allKeys = () => new Promise((res, rej) => {
  const r = DB.transaction("prints").objectStore("prints").getAllKeys();
  r.onsuccess = () => res(r.result.filter(k => !String(k).includes(":")).sort());
  r.onerror = () => rej(r.error);
});
let prints = await allKeys();
let pending = 0;
const cooking = new Set();          /* ids mid-develop right now */
const cookThumbs = new Map();       /* id -> latent-negative data URL */
const unchosen = new Set();         /* vestigial: always empty since v2.3 */
async function scanTray() {
  const raw = await new Promise((res, rej) => {
    const r = DB.transaction("prints").objectStore("prints").getAllKeys();
    r.onsuccess = () => res(r.result.map(String)); r.onerror = () => rej(r.error);
  });
  unchosen.clear();          /* nothing waits on a person any more */
}
await scanTray();

const urls = new Set();
const mkURL = b => { const u = URL.createObjectURL(b); urls.add(u); return u; };
const revokeAll = () => { for (const u of urls) URL.revokeObjectURL(u); urls.clear(); };

async function makeThumb(blob) {
  const bmp = await createImageBitmap(blob);
  const s = 220 / Math.max(bmp.width, bmp.height);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  const t = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  c.width = c.height = 0;
  return t;
}
const printURLs = new Map();          /* full prints, LRU of 8 object URLs */
async function printURL(id) {
  if (printURLs.has(id)) {
    const u = printURLs.get(id); printURLs.delete(id); printURLs.set(id, u);
    return u;
  }
  const b = await get("prints", id); if (!b) return null;
  const u = URL.createObjectURL(b); printURLs.set(id, u);
  if (printURLs.size > 8) {
    const [k0, u0] = printURLs.entries().next().value;
    URL.revokeObjectURL(u0); printURLs.delete(k0);
  }
  return u;
}
const dropPrintURL = id => { const u = printURLs.get(id);
  if (u) { URL.revokeObjectURL(u); printURLs.delete(id); } };
const thumbURLs = new Map();
async function thumbURL(id) {
  if (thumbURLs.has(id)) return thumbURLs.get(id);
  const t = await thumbOf(id); if (!t) return null;
  const u = URL.createObjectURL(t); thumbURLs.set(id, u); return u;
}
const dropThumbURL = id => { const u = thumbURLs.get(id);
  if (u) { URL.revokeObjectURL(u); thumbURLs.delete(id); } };
async function thumbOf(id) {
  let t = await get("thumbs", id);
  if (!t) { const p = await get("prints", id);
    if (!p) return null; t = await makeThumb(p); await put("thumbs", id, t); }
  return t;
}
const revealSeen = new Set();   // circuit breaker: one reveal per frame per session

/* ---------- lab ---------- */
const BUILD = 110;                     /* bump with every ship; lands in EXIF */
/* Pyodide, numpy, scipy and pillow come off jsdelivr on every cold launch.
   sw.js caches those and ONLY those - it never intercepts same-origin, so
   index.html, lab-worker.js and the canon trio the worker fetches at boot all
   still arrive from the network and the upload ritual is untouched. Register
   without a query string: a versioned URL would mint a new registration every
   build and orphan the last. The browser byte-compares sw.js itself on each
   navigation, and updateViaCache "none" keeps the HTTP cache out of that. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(r => r.update())
      .catch(() => {});           /* a failed registration must cost nothing */
  });
}
const worker = new Worker("lab-worker.js?v=" + BUILD);
let msgId = 0; const waits = new Map();
/* ---------- the lab sizes itself to the phone it is running on ----------
   Five rungs. The boot probe predicts this device's develop cost (measured:
   seconds ~= probe_ms x the factor below), so a slower phone starts where it
   can finish. Every develop then reports its real time and the rung adjusts,
   so a hot, throttled, or backgrounded phone drifts down and a cool one
   climbs back. Quality first: rung 0 unless the device says otherwise. */
const RUNGS = [{ px: 1100, dc: true,  k: 0.371 },
               { px: 950,  dc: true,  k: 0.249 },
               { px: 800,  dc: false, k: 0.158 },
               { px: 700,  dc: false, k: 0.117 },
               { px: 600,  dc: false, k: 0.091 }];
const BUDGET = 26;                    /* seconds we are willing to wait */
let rung = (() => { try { const v = parseInt(localStorage["rung"], 10);
  return Number.isFinite(v) ? Math.max(0, Math.min(RUNGS.length - 1, v)) : 0;
} catch (e) { return 0; } })();
/* ---- the memory wall, made survivable ----
   iOS gives a page no memory warning it can act on: the first sign of
   pressure is the kill, and the second kill in a row is Safari's "problem
   repeatedly occurred" screen. Worse, adaptRung climbs after every fast
   develop, so a phone that just died at 1100 relaunches, measures itself
   fast, and sprints straight back into the wall. The flag below is the
   whole diagnosis: written before the worker starts a frame, cleared when
   the worker answers. Found at boot, it means the last session ended
   mid-develop - and the only thing that kills a page mid-develop without
   leaving an error is the OS. The cap it sets is a floor on the rung
   index; eight clean frames at the cap earn one step of trust back, so a
   one-off pressure spike does not demote the phone forever. */
let capIdx = (() => { try { const v = parseInt(localStorage["memcap"], 10);
  return Number.isFinite(v) ? Math.max(0, Math.min(RUNGS.length - 1, v)) : 0;
} catch (e) { return 0; } })();
let capOk = 0;
const saveCap = () => { try { localStorage["memcap"] = capIdx; } catch (e) {} };
(() => {                                   /* did the last session die cooking? */
  let died = null;
  try { died = localStorage["cooking"] ? parseInt(localStorage["cooking"], 10) : null;
        localStorage.removeItem("cooking"); } catch (e) {}
  if (died === null) return;
  const i = RUNGS.findIndex(r => r.px === died);
  capIdx = Math.max(capIdx, Math.min(RUNGS.length - 1, (i < 0 ? 0 : i) + 1));
  saveCap();
  console.warn("EMULSIFY: last session died developing at " + died +
               "px - capped at " + RUNGS[capIdx].px + "px until trust is earned");
})();
const noteCookStart = px => { try { localStorage["cooking"] = String(px); } catch (e) {} };
const noteCookEnd = ok => {
  try { localStorage.removeItem("cooking"); } catch (e) {}
  if (!ok || capIdx === 0) { capOk = 0; return; }
  capOk += 1;
  if (capOk >= 8) { capIdx -= 1; capOk = 0; saveCap(); }
};
const setRung = r => { rung = Math.max(capIdx, Math.min(RUNGS.length - 1, r));
  try { localStorage["rung"] = rung; } catch (e) {} };
setRung(rung);                             /* the restored rung obeys the cap too */
let probed = false;
function sizeFromProbe(ms) {          /* one measurement, before frame one */
  if (!ms || probed) return; probed = true;
  let pick = RUNGS.length - 1;
  for (let i = 0; i < RUNGS.length; i++)
    if (ms * RUNGS[i].k <= BUDGET) { pick = i; break; }
  setRung(pick);
}
function adaptRung(secs) {            /* and the truth, after every frame */
  if (!secs) return;
  if (secs > BUDGET * 1.6) setRung(rung + 1);
  else if (secs < BUDGET * 0.45 && rung > 0) setRung(rung - 1);
}
/* iOS suspends the page when the screen sleeps, which freezes a develop
   mid-chemistry. Hold a screen wake lock while the lab is busy and release
   it the moment the tray is empty. Present from iOS 16.4, but broken in
   home-screen apps before 18.4, so this is a fix for newer phones only and
   silently does nothing on older ones. Backgrounding still suspends us:
   no web API can prevent that. */
let wakeLock = null;
async function labAwake(on) {
  try {
    if (on) {
      if (wakeLock || !navigator.wakeLock) return;
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (wakeLock) {
      const w = wakeLock; wakeLock = null; await w.release();
    }
  } catch (e) { wakeLock = null; }
}
addEventListener("visibilitychange", () => {   /* iOS drops it on return */
  if (document.visibilityState === "visible" && pending > 0) labAwake(true);
});
const jobFrame = new Map();
let workerVer = "";
/* the aura must hug the GLASS, not the frame: in landscape the frame is much
   wider than the gate, and a frame-sized glow stood fully exposed in the
   margins. Pin it to the glass's rectangle, bleeding 14% past each side. */
function fitAura() {

    s: 1, m: 2.5, crop: 1, minE: 20, icon: IC.neewer, tint: null, tintS: 0,
    zooms: [1, 1.5, 2] }
];
/* Off by default: most people have no adapter, and a squeeze applied without
   one stretches every frame. Remembered once set. b64 and earlier stored a
   bare squeeze number, so an old save migrates to the first record whose
   squeeze matches. This list is owned glass only, no placeholders, so a
   squeeze nothing in it provides falls back to OFF - which is the truth. */
let ANA = (() => {
  let v = null; try { v = localStorage["ana"]; } catch (e) {}
  let o = OPTICS.find(x => x.id === v);
  if (!o) { const n = parseFloat(v); o = OPTICS.find(x => x.kind === "ANA" && x.s === n); }
  return Object.assign({}, o || OPTICS[0]);
})();
function paintAnaMenu() {          /* the menu is text; the badge is the glass */
  const m = $("anamenu"); m.innerHTML = "";
  OPTICS.forEach((o, oi) => {
    const b = document.createElement("button");
    b.textContent = o.label;
    b.insertAdjacentHTML("beforeend",
      '<input type="checkbox" switch class="hapov" tabindex="-1" aria-hidden="true">');
    if (o.id === ANA.id) b.className = "cur";
    b.onclick = () => { closeAnaMenu(); setOptic(o.id); };
    m.appendChild(b);
  });
}
function paintAnaBadge() {
  const b = $("ana");
  b.innerHTML = "";
  if (ANA.icon) {
    const i = document.createElement("img");
    i.src = ANA.icon; i.alt = ANA.label; i.decoding = "async";
    b.appendChild(i);
  } else b.textContent = "OFF";
  b.setAttribute("aria-label", ANA.label);
  tickBadge(b);
}
const anaBlocked = () =>
  (typeof ANA === "object" ? ANA.s : 1) > 1.001 &&
  !matchMedia("(orientation: landscape)").matches;
function anaGuard() {
  const w = $("anawarn");
  if (w) w.classList.toggle("on", anaBlocked());
}
let anaPrev = null;                   /* the rung to return to when it is off */
function setOptic(id) {
  const o = OPTICS.find(x => x.id === id) || OPTICS[0];
  ANA = Object.assign({}, o);
  ZOOM = 1;                              /* a new lens starts at its base focal */
  try { localStorage["ana"] = ANA.id; } catch (e) {}
  if (optOn()) { anaPrev = anaPrev === null ? GLASS.mm : anaPrev; applyOpticGlass(); }
  else if (anaPrev !== null) { const back = anaPrev; anaPrev = null; setGlass(back); }
  paintAnaBadge();
  lensView();
  paintAnaMenu();
  paintLensMenu();                    /* the whole ladder greys under any glass */
  $("lens").classList.toggle("locked", optOn() && (ANA.zooms || [1]).length < 2);
  if (optOn()) $("lens").textContent = opticLabel();
  anaGuard();
}
function closeAnaMenu() {
  $("anamenu").classList.remove("on"); $("lensveil").classList.remove("on");
}
$("ana").onclick = () => {
  closeLensMenu(); closeFinderMenu();
  const on = $("anamenu").classList.toggle("on");
  $("lensveil").classList.toggle("on", on);
};
setOptic(ANA.id);
addEventListener("resize", anaGuard);
addEventListener("orientationchange", anaGuard);

function flagError() {
  const chip = $("chip");
  chip.style.borderColor = "#7c2d12";
  setTimeout(() => chip.style.borderColor = "", 2500);
}

/* ---------- chip (finished gallery) + tray (the drying line) ---------- */
const newestProcessed = () =>
  [...prints].reverse().find(k => !unchosen.has(k));
const newestCooking = () => [...cooking].sort().pop() || null;
/* the gallery, newest first: frames still in the bath come before prints */
const galleryIds = () =>
  [...cooking].sort().reverse().concat([...prints].reverse().filter(k => !unchosen.has(k)));
/* one chip, one painter: it wears the bath for as long as there is a bath */
async function paintChip() {
  const chip = $("chip");
  const cook = newestCooking();
  const id = cook || newestProcessed();
  chip.classList.toggle("cooking", !!cook);
  const dot = chip.querySelector(".dot");
  if (dot) dot.classList.toggle("brew", !!cook);
  const u = cook ? (cookThumbs.get(cook) || null) : (id ? await thumbURL(id) : null);
  let sc = chip.querySelector(".scrim");
  if (cook && !sc) { sc = document.createElement("i"); sc.className = "scrim";
                     chip.insertBefore(sc, dot); }
  else if (!cook && sc) { sc.remove(); sc = null; }
  const ims = chip.querySelectorAll("img");
  const top = ims[ims.length - 1];
  if (!u) { for (const o of ims) o.remove(); return; }
  if (!top || top.src !== u) {          /* a new step comes up in the bath */
    const im = document.createElement("img");
    if (cook) im.className = "step";
    im.src = u;
    chip.insertBefore(im, sc || dot);
    setTimeout(() => {
      for (const o of chip.querySelectorAll("img")) if (o !== im) o.remove();
    }, cook ? 2600 : 400);
  }
}
paintChip();
$("chip").onclick = () => { const k = galleryIds()[0]; if (k) openItem(k); };

/* ---------- print view; long-press the print itself to save ---------- */
let current = null, armedFile = null, watching = null, openTok = 0;
async function openPrint(id) {
  current = id; watching = null;
  const tok = ++openTok;              /* a faster tap wins; stale opens bail */
  const stage = $("stage"); stage.innerHTML = "";
  const u = await printURL(id);
  if (!u || tok !== openTok) return;
  try {                                   /* arm the print for hold-to-save */
    const blob = await get("prints", id);
    const secs = localStorage["t" + id] || "", rf = localStorage["rf" + id] || "";
    try { $("edgecode").textContent = rf ? rf[0] + " \u00b7 " + rf.slice(1) + (secs ? "  \u00b7  " + secs + "s" : "") : (secs ? secs + "s" : ""); } catch (e) {}
    armedFile = new File([blob],
      "EMULSIFY" + (rf ? "-" + rf : "") + (secs ? "-" + secs + "s" : "") + "-" + id.slice(-4) + ".jpg",
      { type: "image/jpeg" });
  } catch (e) { armedFile = null; }
  let negD = null;
  try { negD = await get("prints", id + ":neg"); } catch (e) {}
  if (tok !== openTok) return;
  const first = !!negD;                /* the maiden view gets the whole bath */
  if (calmMotion || !first) {          /* stillness asked for, or already seen: just the print,
                                          at once, so the strip can be played like keys */
    const img = document.createElement("img");
    img.src = u;
    img.className = first ? "" : "in";
    stage.appendChild(img);
    if (first) requestAnimationFrame(() => img.classList.add("in"));
  } else {
    let nimg = null;
    if (first) {
      nimg = document.createElement("img");
      nimg.src = "data:image/jpeg;base64," + negD;
      nimg.className = "in watch";
      nimg.style.transform = "scale(.94)";
      stage.appendChild(nimg);
    }
    const bath = document.createElement("div");     /* paper, then the dyes */
    const slow = rung >= 2;            /* modest device: the short bath only */
    bath.className = (first && !slow) ? "bath" : "bath quick";
    for (const k of ["paper", "y", "m", "c"]) {
      const li = document.createElement("img");
      li.className = k; li.src = u; bath.appendChild(li);
    }
    stage.appendChild(bath);
    requestAnimationFrame(() => {
      bath.classList.add("on");
      if (nimg) { nimg.style.transform = ""; nimg.style.opacity = 0; }
    });
    setTimeout(() => {                              /* dyes are in: hand over */
      if (tok !== openTok) return;
      const fimg = document.createElement("img");
      fimg.className = "in"; fimg.src = u;
      stage.appendChild(fimg);
      bath.remove(); if (nimg) nimg.remove();
    }, (first && !slow) ? 2600 : 900);
  }
  if (negD) { try { put("prints", id + ":neg", ""); } catch (e) {} }

  await buildStrip(id);
  humStop(); $("print").classList.add("on");
  setPaged(true);
}
/* the strip IS the gallery: frames still in the bath sit at the front,
   wearing their current stage, and step forward in place as it changes */
async function buildStrip(selId) {
  const strip = $("strip");
  const ids = galleryIds().slice(0, 40);
  const keep = new Set(ids);
  for (const b of [...strip.children]) if (!keep.has(b.dataset.pid)) b.remove();
  for (let i = 0; i < ids.length; i++) {
    const k = ids[i];
    const cook = cooking.has(k);
    let b = strip.querySelector('button[data-pid="' + CSS.escape(k) + '"]');
    let w = b ? b.parentElement : null;
    if (!b) {
      b = document.createElement("button"); b.dataset.pid = k;
      w = document.createElement("span"); w.className = "tw"; w.dataset.pid = k;
      const sw = document.createElement("input");            /* native switch: iOS taptic */
      sw.type = "checkbox"; sw.setAttribute("switch", ""); sw.tabIndex = -1; sw.setAttribute("aria-hidden", "true");
      w.appendChild(b); w.appendChild(sw);
      w.onclick = () => { galleryNote([...strip.children].indexOf(w)); openItem(k); };
    }
    if (strip.children[i] !== w) strip.insertBefore(w, strip.children[i] || null);
    b.classList.toggle("sel", k === selId);
    b.classList.toggle("cook", cook);
    const u = cook ? (cookThumbs.get(k) || null) : await thumbURL(k);
    let sc = b.querySelector(".scrim"), dd = b.querySelector(".dot");
    if (cook) {
      if (!sc) { sc = document.createElement("i"); sc.className = "scrim"; b.appendChild(sc); }
      if (!dd) { dd = document.createElement("span"); dd.className = "dot brew"; b.appendChild(dd); }
    } else { if (sc) sc.remove(); if (dd) dd.remove(); sc = null; dd = null; }
    const ims = b.querySelectorAll("img");
    const top = ims[ims.length - 1];
    if (!u) { for (const o of ims) o.remove(); continue; }
    if (!top || top.src !== u) {
      const im = document.createElement("img");
      if (cook) im.className = "step";
      im.src = u;
      b.insertBefore(im, sc || dd || null);
      setTimeout(() => {
        for (const o of b.querySelectorAll("img")) if (o !== im) o.remove();
      }, cook ? 2600 : 400);
    }
  }
}
/* one door for both: a print opens as a print, a frame in the bath opens
   as itself and keeps developing on the full screen */
function openItem(id) { humStop(); return cooking.has(id) ? openCooking(id) : openPrint(id); }
async function openCooking(id) {
  watching = id; current = null; armedFile = null;
  const stage = $("stage"); stage.innerHTML = "";
  const u = cookThumbs.get(id);
  if (u) {
    const img = document.createElement("img");
    img.className = "in step watch"; img.src = u;
    stage.appendChild(img);
  }
  await buildStrip(id);
  humStop(); $("print").classList.add("on");
  setPaged(true);
}
function paintWatched() {              /* a new stage landed while watching */
  if (!watching || !cooking.has(watching)) return;
  const u = cookThumbs.get(watching); if (!u) return;
  const stage = $("stage");
  const ims = stage.querySelectorAll("img");
  const top = ims[ims.length - 1];
  if (top && top.src === u) return;
  const img = document.createElement("img");
  img.className = "in step watch"; img.src = u;
  stage.appendChild(img);
  setTimeout(() => {
    for (const o of stage.querySelectorAll("img")) if (o !== img) o.remove();
  }, 2600);
}
$("back").onclick = () => { $("print").classList.remove("on"); setPaged(false); if (cocked) humStart();
  watching = null;
  setTimeout(revokeAll, 220); paintChip(); };
/* navigation is the strip: tap a thumb below; hold the print to save */
let HOLD = null;
$("stage").addEventListener("pointerdown", e => {
  HOLD = { t: performance.now(), x: e.clientX, y: e.clientY, moved: false };
});
$("stage").addEventListener("pointermove", e => {
  if (HOLD && Math.hypot(e.clientX - HOLD.x, e.clientY - HOLD.y) > 10)
    HOLD.moved = true;
});
$("stage").addEventListener("pointercancel", () => { HOLD = null; });
$("stage").addEventListener("pointerup", () => {
  const h = HOLD; HOLD = null;
  if (!h || h.moved || watching || performance.now() - h.t < 550) return;
  if (armedFile && navigator.canShare &&
      navigator.canShare({ files: [armedFile] })) {
    navigator.share({ files: [armedFile] }).catch(() => {});
  }
});
</script>
