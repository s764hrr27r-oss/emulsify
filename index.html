*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--k);background-image:var(--grain);color:var(--w);
     font-family:var(--ui);
     font-weight:300;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}

/* ---------- camera (portrait-locked presentation) ---------- */
#camera{position:fixed;inset:0;display:flex;flex-direction:column;
        padding-top:env(safe-area-inset-top);
        transition:transform .26s var(--ease), opacity .24s var(--ease)}
body.paged #camera{transform:scale(.97)}
/* ---------- THE CAMERA BACK ----------
   A status panel of the kind that sits beside the eyepiece: frame count, the
   glass in front, the film speed, and whether the shutter is set. It is the
   thing that makes a small finder read as a finder rather than a bug. */
.top{height:36px;flex:0 0 auto;display:flex;align-items:center;padding:0 18px}
#hapb{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;-webkit-appearance:auto;border-radius:5px;z-index:3}
/* the EV detent's haptic: a rendered but invisible switch that the drag handler
   toggles on every third-stop. iOS plays its Taptic on a switch toggle made
   inside a user input handler, which a pointermove is. */
#hapev,#hapx{position:absolute;left:-2px;top:0;width:2px;height:2px;margin:0;opacity:0;pointer-events:none;-webkit-appearance:auto}
#hapx{top:4px}
#backlcd{flex:1;display:flex;align-items:baseline;gap:5px;flex-wrap:nowrap;overflow:hidden;
  font:500 11px var(--ui);color:var(--mute);
  border:1px solid var(--hair);border-radius:5px;padding:4px 9px;
  background:rgba(255,255,255,.012);white-space:nowrap}
#backlcd .seg{font-size:12.5px;letter-spacing:.05em;color:#cfcdc7;flex:0 0 auto;display:inline-block;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#edgecode,#evrow .val{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#backlcd #lcdframe.late{color:#e0a050}
body.cocked #backlcd #lcdframe.late{color:#f0b060}
/* 5. ODOMETER: a changed digit arrives from below, the way a mechanical counter turns */
#backlcd .seg.tick{animation:odometer .42s cubic-bezier(.2,.8,.2,1)}
@keyframes odometer{0%{transform:translateY(9px);opacity:0;filter:blur(1px)}60%{opacity:1}100%{transform:none;filter:none}}
#backlcd .lbl{font-size:7.5px;letter-spacing:.14em;opacity:.55;margin-right:4px;flex:0 0 auto;transition:color .4s var(--ease),opacity .4s var(--ease)}
#backlcd .lbl.warn{color:#e0a050;opacity:.95;animation:warnpulse 1.8s ease-in-out infinite}
@keyframes warnpulse{0%,100%{opacity:.6}50%{opacity:1}}
#backlcd .state{margin-left:auto;font-size:8.5px;letter-spacing:.14em;opacity:.75;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#backlcd .build{font-size:7.5px;letter-spacing:.04em;opacity:.3;margin-left:6px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#backlcd .build.ready{color:var(--ready);opacity:1;animation:askring 2.4s ease-in-out infinite}
#backlcd .state.flash{color:var(--ready);opacity:1}
#backlcd .more{font-size:10px;color:var(--ready);opacity:.7;margin-left:8px;flex:0 0 auto;line-height:1;align-self:center}
#scopemenu.on ~ * #backlcd .more,#servicemenu.on ~ * #backlcd .more{opacity:1}
#backlcd.selftest .seg,#backlcd.selftest .state{color:#e6c37a;opacity:.85;text-shadow:0 0 6px rgba(229,180,90,.35)}
#backlcd.selftest.overnight .seg,#backlcd.selftest.overnight .state{animation:segflicker 1.5s steps(1) both}
@keyframes segflicker{0%{opacity:0}6%{opacity:.7}9%{opacity:.1}14%{opacity:.8}17%{opacity:.2}24%{opacity:.85}27%{opacity:.35}36%{opacity:.85}40%{opacity:.5}52%{opacity:.85}58%{opacity:.7}100%{opacity:.85}}
/* on the narrowest portrait widths the build yields before anything wraps */
@media (max-width: 420px) and (orientation: portrait){ #backlcd .build:not(.ready){display:none} }
#backlcd .build.ready{display:inline !important;white-space:nowrap;line-height:1.1;font-size:7px}
body.cocked #backlcd .state{color:var(--ready);opacity:1}
body.cocked #backlcd{border-color:rgba(229,180,90,.45)}
#frame{flex:1;display:grid;place-items:center;min-height:0;padding:0 0 6px;position:relative}
/* ---------- THE POCKET UNIVERSE ----------
   When the shutter is set, something is lit behind the finder. Never shown
   directly: it leaks around the edges of the gate the way a lamp shows around
   a door. Five soft sources, emerald, ruby, tanzanite, gold, silver, drifting
   slowly against each other so the leak never settles, plus a slow breath.
   Everything about it is implied. If you can name a colour it is too strong. */
#aura{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;background:transparent;
  transition:opacity 1.4s var(--ease)}
/* Animating box-shadow re-rasterises the blur every frame, which on a phone
   is the difference between a camera and a space heater. So: two children,
   each holding one static shadow state, crossfading on opacity, which the
   compositor does for free. Same drift, no cost. */
#aura::before,#aura::after{content:"";position:absolute;inset:0;background:transparent;
  box-shadow:-20px -8px 46px 5px rgba(214,216,222,.055), 22px -10px 46px 5px rgba(214,216,222,.045),
             18px 20px 46px 5px rgba(214,216,222,.055), -18px 22px 46px 5px rgba(214,216,222,.05), 0 0 30px 2px rgba(236,238,242,.025)}
#aura::after{box-shadow:-12px 20px 46px 5px rgba(214,216,222,.05), -22px -10px 46px 5px rgba(214,216,222,.055),
             20px -16px 46px 5px rgba(214,216,222,.045), 18px 18px 46px 5px rgba(214,216,222,.055), 0 0 32px 2px rgba(236,238,242,.025);
             opacity:0}
body.cocked #aura{opacity:1}
body.cocked #aura::before{animation:seamA 14s ease-in-out infinite alternate}
body.cocked #aura::after{animation:seamB 14s ease-in-out infinite alternate}
@keyframes seamA{from{opacity:1}to{opacity:0}}
@keyframes seamB{from{opacity:0}to{opacity:1}}
body.released #aura{transition:opacity .4s var(--ease);opacity:0;animation:none}
#glass{position:relative;z-index:1}
/* BOKASHI. A graded band of tone at the top and bottom of the gate, the way a
   woodblock printer graded the sky: the black field gets a horizon. Idle only;
   it never touches the open picture. */
#bokashi{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:1;transition:opacity .5s var(--ease);
  background:linear-gradient(180deg, rgba(28,31,38,.85) 0%, rgba(28,31,38,0) 13%, rgba(28,31,38,0) 87%, rgba(28,31,38,.85) 100%)}
body.cocked #bokashi{opacity:0}
/* CAUSTICS. Two hairlines of light crossing the black field, each drifting on
   its own slow cycle at a different angle: the light a crystal throws on a
   wall. The crystal is never in frame. Transforms only. */
#caustic{position:absolute;inset:-20%;pointer-events:none;z-index:2;opacity:0;transition:opacity 1.6s var(--ease)}
#caustic i{position:absolute;left:-10%;right:-10%;top:50%;height:1px;
  background:linear-gradient(90deg, transparent, rgba(240,226,190,.55) 30%, rgba(255,246,220,.8) 50%, rgba(240,226,190,.55) 70%, transparent)}
#caustic i:nth-child(1){animation:caustic1 23s ease-in-out infinite alternate}
#caustic i:nth-child(2){animation:caustic2 31s ease-in-out infinite alternate;opacity:.7}
@keyframes caustic1{from{transform:rotate(-23deg) translateY(-110px)}to{transform:rotate(-19deg) translateY(90px)}}
@keyframes caustic2{from{transform:rotate(31deg) translateY(120px)}to{transform:rotate(27deg) translateY(-100px)}}
body.cocked #caustic{opacity:.035}
/* VAN GOGH: for three seconds after a frame everything moves faster, then calms */
body.charged #caustic i:nth-child(1){animation-duration:7s}
body.charged #caustic i:nth-child(2){animation-duration:10s}
body.charged.cocked #sparkle i{animation-duration:3.1s}
body.charged.cocked #sparkle i:nth-child(2){animation-duration:3.7s}
/* LIT FROM BELOW. A three percent warmth rising from the bottom edge of the
   gate: something golden beneath, out of frame. */
#below{position:absolute;left:0;right:0;bottom:0;height:38%;pointer-events:none;z-index:2;opacity:0;transition:opacity 1.8s var(--ease);
  background:linear-gradient(180deg, transparent, rgba(229,180,90,.06) 70%, rgba(229,180,90,.09))}
body.cocked #below{opacity:.5}
body.released #caustic,body.released #below{transition:opacity .3s var(--ease);opacity:0}
/* SPARKLE. Twelve points in four groups, each group a static raster that
   twinkles on opacity with its own period, so no two groups peak together.
   No mask, no filter: nothing here repaints. Idle they do not exist. */
#sparkle{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .9s var(--ease)}
#sparkle i{position:absolute;inset:0;opacity:0}
#sparkle i:nth-child(1){background-image:
  radial-gradient(circle at 3% 12%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
  radial-gradient(circle at 96% 91%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
  radial-gradient(circle at 48% 2%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px)}
#sparkle i:nth-child(2){background-image:
  radial-gradient(circle at 97% 9%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
  radial-gradient(circle at 5% 88%, rgba(240,242,246,.9) 0 .6px, transparent 1.2px),
  radial-gradient(circle at 53% 98%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px)}
#sparkle i:nth-child(3){background-image:
  radial-gradient(circle at 2% 50%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px),
  radial-gradient(circle at 12% 4%, rgba(255,236,200,.85) 0 .5px, transparent 1.1px),
  radial-gradient(circle at 94% 70%, rgba(240,242,246,.8) 0 .4px, transparent 1px)}
#sparkle i:nth-child(4){background-image:
  radial-gradient(circle at 98% 44%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px),
  radial-gradient(circle at 90% 96%, rgba(255,236,200,.85) 0 .5px, transparent 1.1px),
  radial-gradient(circle at 7% 30%, rgba(240,242,246,.8) 0 .4px, transparent 1px)}
body.cocked #sparkle{opacity:1}
#sparkle i:nth-child(3),#sparkle i:nth-child(4){display:none}      /* eight points, not twelve: dust, not gems */
body.cocked #sparkle i{animation:twinkle 9.3s ease-in-out infinite}
body.cocked #sparkle i:nth-child(2){animation-duration:11.1s;animation-delay:-3.1s}
/* a change in the room: every point lights at once, then they go back to their own rhythms */
body.cocked.glint #sparkle i{animation:none;opacity:.6;transition:opacity .18s var(--ease)}
@keyframes twinkle{0%,72%,100%{opacity:0}82%{opacity:.5}90%{opacity:.1}}
body.released #sparkle{transition:opacity .3s var(--ease);opacity:0}
/* the readouts turn gold and radiate when the shutter is set */
#backlcd .seg{transition:color .6s var(--ease), text-shadow .6s var(--ease)}
body.cocked #backlcd .seg{color:#e6c37a;
  text-shadow:0 0 5px rgba(236,196,106,.35), 0 0 14px rgba(229,180,90,.14)}
body.cocked #backlcd .lbl{color:#c9a862;opacity:.7;transition:color .6s var(--ease)}
body.cocked #backlcd{background:rgba(229,180,90,.02)}
/* ---------- EXPENSIVE LINES ----------
   A flat 1px hairline is a wireframe. A 1px line that carries a gradient,
   catches a highlight at one corner and falls to shadow at the other, is a
   jewelry box. Every outline gets the treatment; when the shutter is set the
   highlights turn to silver and gold and breathe, slightly out of phase, so
   nothing on the back of the camera is ever quite still. */
.deck::before,.lensbtn,#chip,#wind,#backlcd{
  border-color:transparent !important;
  background-image:linear-gradient(var(--edge-a,135deg),
     rgba(214,214,208,.30) 0%, rgba(96,96,92,.14) 38%, rgba(40,40,38,.18) 62%, rgba(196,196,190,.24) 100%);
  background-origin:border-box;background-clip:border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);mask-composite:exclude}
/* the ones that also hold content keep it: mask only the ring layer via a pseudo */
.lensbtn,#chip,#wind,#backlcd{-webkit-mask:none;mask:none;background-image:none;position:relative}
.lensbtn::after,#chip::after,#wind::after,#backlcd::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;
  pointer-events:none;padding:1px;
  background:linear-gradient(135deg, rgba(214,214,208,.34), rgba(96,96,92,.14) 40%, rgba(40,40,38,.16) 60%, rgba(196,196,190,.26));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask-composite:exclude;
  transition:opacity .6s var(--ease)}
/* set: silver brightens to a live sheen and breathes; the wind and panel go gold */
body.cocked .lensbtn::after,body.cocked #chip::after{
  background:linear-gradient(135deg, rgba(240,240,236,.85), rgba(150,150,146,.35) 42%, rgba(70,70,68,.3) 58%, rgba(230,230,226,.7));
  animation:silverbreath 3.2s ease-in-out infinite}
body.cocked #finder::after{animation-delay:-.6s}
body.cocked #lens::after{animation-delay:-1.3s}
body.cocked #ana::after{animation-delay:-2.1s}
body.cocked #chip::after{animation-delay:-1.7s}
@keyframes silverbreath{0%,100%{opacity:.5}50%{opacity:1}}
body.cocked #backlcd::after{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 .5px, transparent .5px 2px),      /* KLIMT: leaf tiling, 1px, felt not seen */
    repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 .5px, transparent .5px 2px),
    linear-gradient(135deg, rgba(246,220,150,.9), rgba(196,150,70,.35) 40%, rgba(120,90,40,.3) 60%, rgba(236,196,106,.85));
  animation:goldbreath 5s ease-in-out infinite}
@keyframes goldbreath{0%,100%{opacity:.7}50%{opacity:1}}
/* the deck outline: a silver hairline that lights when set */
.deck::before{opacity:.75;transition:opacity .6s var(--ease)}
body.cocked .deck::before{opacity:1;
  background-image:linear-gradient(135deg, rgba(236,236,232,.55), rgba(120,120,116,.16) 40%, rgba(60,60,58,.18) 60%, rgba(220,220,216,.45))}
/* the shutter rim turns to metal when set: the rings are a static box-shadow;
   the breathing gold halo is a pseudo ring cross-fading on opacity */
#shutter{position:relative;transition:opacity .25s var(--ease), box-shadow .6s var(--ease)}
body.cocked #shutter{box-shadow:0 0 0 1px rgba(236,236,232,.55), 0 0 0 3px rgba(20,20,20,1), 0 0 0 4px rgba(214,214,208,.35)}
/* THE PEARL. One specular at ten o'clock on the rim, and its brightness is the
   room's: it follows the meter. A whole button lit by a single point. */
#shutter::before{content:"";position:absolute;left:12%;top:9%;width:24%;height:24%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 42% 40%, rgba(255,255,255,var(--pearl,.45)), rgba(255,255,255,0) 68%);
  transition:opacity 1.2s var(--ease);z-index:2}
#shutter::after{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none;opacity:0;
  box-shadow:0 0 0 1px rgba(246,246,242,.5), 0 0 26px rgba(229,180,90,.26)}
body.cocked #shutter::after{animation:rimbreath 3.2s ease-in-out infinite}
@keyframes rimbreath{0%,100%{opacity:.25}50%{opacity:1}}
body.cocked.slowlight #shutter{box-shadow:0 0 0 1px rgba(236,236,232,.55), 0 0 0 3px rgba(20,20,20,1), 0 0 0 4px rgba(224,160,80,.55), 0 0 22px rgba(236,150,60,.26)}
body.cocked.slowlight #shutter::after{animation:none;opacity:0}
/* THE GRID IS LIT, and the fire is not a filter. The glow is drawn INTO the
   gradient as two wider, softer lines under the 1px core and rasterised once.
   The breath is a second copy (::after) with a hotter sheath, cross-fading on
   opacity: the compositor does that without repainting a pixel. */
#lockgrid::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:
   linear-gradient(to right, transparent calc(33.33% - 8px), rgba(236,150,60,.22) 33.33%, transparent calc(33.33% + 8px)),
   linear-gradient(to right, transparent calc(33.33% - 2.4px), rgba(255,236,200,.55) 33.33%, transparent calc(33.33% + 2.4px)),
   linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + 1px)),
   linear-gradient(to right, transparent calc(66.66% - 8px), rgba(236,150,60,.22) 66.66%, transparent calc(66.66% + 8px)),
   linear-gradient(to right, transparent calc(66.66% - 2.4px), rgba(255,236,200,.55) 66.66%, transparent calc(66.66% + 2.4px)),
   linear-gradient(to right, transparent calc(66.66% - 1px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + 1px)),
   linear-gradient(to bottom, transparent calc(33.33% - 8px), rgba(236,150,60,.22) 33.33%, transparent calc(33.33% + 8px)),
   linear-gradient(to bottom, transparent calc(33.33% - 2.4px), rgba(255,236,200,.55) 33.33%, transparent calc(33.33% + 2.4px)),
   linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + 1px)),
   linear-gradient(to bottom, transparent calc(66.66% - 8px), rgba(236,150,60,.22) 66.66%, transparent calc(66.66% + 8px)),
   linear-gradient(to bottom, transparent calc(66.66% - 2.4px), rgba(255,236,200,.55) 66.66%, transparent calc(66.66% + 2.4px)),
   linear-gradient(to bottom, transparent calc(66.66% - 1px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + 1px))}
body.cocked.f-grid #lockgrid::after{animation:saber 3.6s ease-in-out .5s infinite}
@keyframes saber{0%,100%{opacity:0}50%{opacity:1}}
/* THE RANGEFINDER PATCH, set. Blue core kept. Heat is a static box-shadow, one
   raster; a duplicate ring behind it carries the peak and breathes on opacity.
   Brackets take a static warmth and never animate. */
#rf b{transition:border-color .5s var(--ease), box-shadow .5s var(--ease)}
body.cocked #rf b{border-color:rgba(59,130,246,.95);
  box-shadow:0 0 2px rgba(255,220,170,.55), 0 0 9px rgba(240,140,50,.30), 0 0 22px rgba(236,120,40,.14)}
#rf b::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 0 3px rgba(255,232,190,.9), 0 0 14px rgba(244,140,44,.5), 0 0 30px rgba(236,120,40,.28)}
body.cocked #rf b::after{animation:rfire 2.6s ease-in-out .4s infinite}
@keyframes rfire{0%,100%{opacity:0}50%{opacity:1}}
body.cocked #rf i{border-color:rgba(255,236,206,.9);
  filter:drop-shadow(0 0 1.5px rgba(255,220,170,.5)) drop-shadow(0 0 6px rgba(236,140,50,.2))}
/* MORANDI. Buttons as objects on a table: a barely-there fill so they are
   solids, and a soft contact shadow beneath each so they sit on the body. */
.lensbtn,#chip{background:rgba(255,255,255,.028);box-shadow:0 2px 3px rgba(0,0,0,.55), 0 6px 10px -4px rgba(0,0,0,.5)}
#windwrap{filter:none}
#wind{background:rgba(255,255,255,.02);box-shadow:0 2px 3px rgba(0,0,0,.5), 0 6px 10px -4px rgba(0,0,0,.45)}
/* HARING. Two rings leave the button on the release and fade: the energy of
   the press going out of the disc. Transform and opacity only. */
#shutterwrap .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(233,236,242,.7);pointer-events:none;opacity:0;transform:scale(1)}
body.radiate #shutterwrap .ring{animation:radiate .42s cubic-bezier(.2,.7,.3,1) both}
body.radiate #shutterwrap .ring:nth-child(2){animation-delay:.09s}
@keyframes radiate{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
/* IRWIN. A disc lit from four lamps floats on four faint shadows. */
#shutterwrap::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:0 -7px 16px -8px rgba(0,0,0,.6), 0 7px 16px -8px rgba(0,0,0,.6), -7px 0 16px -8px rgba(0,0,0,.6), 7px 0 16px -8px rgba(0,0,0,.6)}
/* the tension corners: a static warmth */
body.cocked #tension i{animation:drawin .34s var(--ease) both;border-color:rgba(255,240,205,.95);
  box-shadow:0 0 8px rgba(229,180,90,.30)}
body.cocked #tension{opacity:var(--room,1);transition:opacity 1.2s var(--ease)}
/* MATISSE. Not four corners: one line, drawn in one gesture, closing the frame
   around the gate as the shutter sets. The corners are retired. */
#tension{display:none}
#lockline{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none;overflow:visible;opacity:0}
#lockline rect{fill:none;stroke:rgba(255,246,222,.9);stroke-width:1.2;vector-effect:non-scaling-stroke;
  stroke-dasharray:1;stroke-dashoffset:1}
body.cocked #lockline{opacity:var(--room,1);transition:opacity 1.2s var(--ease)}
body.cocked #lockline rect{animation:oneline .72s cubic-bezier(.3,.6,.15,1) .12s both}
@keyframes oneline{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
body.released #lockline{opacity:0;transition:opacity .25s var(--ease)}
/* hairlines at device pixels: on a 3x screen a 1px line is three pixels wide */
@media (min-resolution: 2dppx){
  #rf b{border-width:.5px}
  .lensbtn::after,#chip::after,#wind::after,#backlcd::after{padding:.5px}
  .deck::before{border-width:.5px}
  #grid,#quad,#cross{opacity:.35}
}
/* RESTRAINT. Smaller type, wider tracking, less of it; one thing moves. */
#backlcd .seg{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink)}
#backlcd .lbl{font-size:7px;font-weight:600;letter-spacing:.14em;opacity:.5;color:var(--silver)}
#backlcd .state{font-size:8px;font-weight:600;letter-spacing:.14em;opacity:.65;color:var(--silver)}

#backlcd .more{font-size:0;width:4px;height:4px;border-radius:50%;background:var(--ready);opacity:.55;margin-left:10px}

body:not(.cocked) #wind b{animation-duration:6s}

@keyframes bootin{from{opacity:0;transform:scale(.965)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#chips{animation:rise .5s var(--ease) both .08s}
#shutterwrap{animation:rise .5s var(--ease) both .16s}
#rightstack{animation:rise .5s var(--ease) both .24s}
.ghost{opacity:0 !important;pointer-events:none}
#glass{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#000;
       animation:bootin .5s var(--ease) both}
#screen{position:absolute;inset:0;transform-origin:50% 50%;overflow:hidden;
        transition:transform .58s cubic-bezier(.16,.9,.22,1),
                   box-shadow .4s var(--ease),border-radius .5s var(--ease)}
#glass video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             opacity:0;transition:opacity .4s var(--ease)}
/* idle: the finder is a small bright window in the middle of the camera back */
body:not(.cocked) #screen{transform:scale(.26);border-radius:3px;
                          box-shadow:0 0 0 1px rgba(255,255,255,.28), 0 0 26px rgba(0,0,0,.9)}
body.cocked #screen{transform:none;border-radius:0}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 26px 6px rgba(0,0,0,.72), inset 0 0 4px rgba(0,0,0,.6);
  border-radius:inherit;opacity:1;transition:opacity .5s var(--ease)}
/* on the open finder the eyepiece is still there, just further away: a soft
   edge only, never reaching the picture. It is an overlay on the LIVE VIEW and
   is never part of a capture; the print is taken from the video, not the DOM. */
body.cocked #screen::after{opacity:1;box-shadow:inset 0 0 34px 0 rgba(0,0,0,.30), inset 0 0 3px rgba(0,0,0,.35)}
body.released #screen{transition:transform .24s cubic-bezier(.5,0,.9,.4)}
#glass video.live{opacity:1}
/* ---------- finder overlays ----------
   Each mode draws only under its own body class, so no mode is "the absence
   of the others" - that pattern is what let RF and OFF look identical for a
   while. The marks themselves are as they were: b70 restyled the grid and the
   rangefinder and both were worse. */
#grid{position:absolute;inset:0;pointer-events:none;display:none;opacity:.5;
  background:
   linear-gradient(to right, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to right, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px)),
   linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px))}
body.f-grid #grid{display:block}
/* AGNES MARTIN. The lines vary in weight along their length, heavier where a
   hand pressed and lighter where it lifted. Two static masks: one for the
   verticals, darkened along their length by a vertical gradient; one for the
   horizontals, darkened along theirs. Nothing here ever repaints. */
#grid::before,#grid::after{content:"";position:absolute;inset:0;pointer-events:none}
#grid::before{background:linear-gradient(to bottom, rgba(0,0,0,.42) 0%, rgba(0,0,0,.05) 16%, rgba(0,0,0,.30) 37%, rgba(0,0,0,.02) 52%, rgba(0,0,0,.26) 71%, rgba(0,0,0,.08) 86%, rgba(0,0,0,.4) 100%);
  -webkit-mask:linear-gradient(to right, transparent calc(33.33% - .6px), #000 33.33%, transparent calc(33.33% + .6px)), linear-gradient(to right, transparent calc(66.66% - .6px), #000 66.66%, transparent calc(66.66% + .6px));
  mask:linear-gradient(to right, transparent calc(33.33% - .6px), #000 33.33%, transparent calc(33.33% + .6px)), linear-gradient(to right, transparent calc(66.66% - .6px), #000 66.66%, transparent calc(66.66% + .6px))}
#grid::after{background:linear-gradient(to right, rgba(0,0,0,.36) 0%, rgba(0,0,0,.04) 19%, rgba(0,0,0,.28) 44%, rgba(0,0,0,.06) 58%, rgba(0,0,0,.32) 79%, rgba(0,0,0,.38) 100%);
  -webkit-mask:linear-gradient(to bottom, transparent calc(33.33% - .6px), #000 33.33%, transparent calc(33.33% + .6px)), linear-gradient(to bottom, transparent calc(66.66% - .6px), #000 66.66%, transparent calc(66.66% + .6px));
  mask:linear-gradient(to bottom, transparent calc(33.33% - .6px), #000 33.33%, transparent calc(33.33% + .6px)), linear-gradient(to bottom, transparent calc(66.66% - .6px), #000 66.66%, transparent calc(66.66% + .6px))}
/* QUADRANTS - halves rather than thirds. Same weight as the grid on purpose:
   it is the same kind of mark, just two lines instead of four. */
#quad{position:absolute;inset:0;pointer-events:none;display:none;opacity:.5;
  background:
   linear-gradient(to right, transparent calc(50% - .5px), rgba(244,242,237,.45) 50%, transparent calc(50% + .5px)),
   linear-gradient(to bottom, transparent calc(50% - .5px), rgba(244,242,237,.45) 50%, transparent calc(50% + .5px))}
body.f-quad #quad{display:block}
/* SPOT - a reticle, not a grid, so it is drawn at full strength like the
   rangefinder marks. Width is a percentage of the glass, so it stays a circle
   and cannot collapse the way a bare aspect-ratio box would. */
#spot{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;
      translate:-50% -50%;display:none;pointer-events:none;
      border:1px solid rgba(244,242,237,.65);border-radius:50%}
body.f-spot #spot{display:block}
#spot::before{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;
  translate:-50% -50%;border-radius:50%;background:rgba(244,242,237,.85)}
#spot i{position:absolute;background:rgba(244,242,237,.85)}
#spot i:nth-child(-n+2){left:50%;width:1px;height:26%;translate:-50% 0}
#spot i:nth-child(1){top:-38%}
#spot i:nth-child(2){bottom:-38%}
#spot i:nth-child(n+3){top:50%;height:1px;width:26%;translate:0 -50%}
#spot i:nth-child(3){left:-38%}
#spot i:nth-child(4){right:-38%}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;
       translate:-50% -50%;display:none;pointer-events:none;
       filter:drop-shadow(0 0 1.4px rgba(0,0,0,.8))}
body.f-cross #cross{display:block}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(244,242,237,.85)}
/* a gap at dead centre: a solid cross hides the very thing it points at */
#cross::before{left:0;right:0;top:50%;height:1px;
  -webkit-mask:linear-gradient(to right,#000 0 38%,transparent 38% 62%,#000 62% 100%);
          mask:linear-gradient(to right,#000 0 38%,transparent 38% 62%,#000 62% 100%)}
#cross::after{top:0;bottom:0;left:50%;width:1px;
  -webkit-mask:linear-gradient(to bottom,#000 0 38%,transparent 38% 62%,#000 62% 100%);
          mask:linear-gradient(to bottom,#000 0 38%,transparent 38% 62%,#000 62% 100%)}
#anawarn{position:absolute;inset:0;z-index:4;display:none;pointer-events:none;
   background:#000;place-items:center;align-content:center;gap:18px;
   color:var(--mute);animation:bootin .4s var(--ease) both}
#anawarn.on{display:grid}

#anawarn span{font-family:var(--ui);font-weight:500;font-size:11px;
   letter-spacing:.14em;text-align:center;padding:0 24px;opacity:.85}
#evrow{position:absolute;left:10px;top:50%;translate:0 -50%;height:min(58%,300px);
  width:34px;display:grid;justify-items:center;touch-action:none;z-index:2}
#evrow .track{position:relative;width:1px;height:100%;background:var(--hair)}
#evrow .tick{position:absolute;top:50%;left:-3px;height:1px;width:7px;
  background:var(--mute);opacity:.6}

@media(prefers-reduced-motion:reduce){#evrow .thumb,#evrow .val{transition:none}}
#rf{position:absolute;inset:0;pointer-events:none;display:none}
body.f-rf #rf{display:block}
#rf i{position:absolute;width:18px;height:18px;border:0 solid rgba(244,242,237,.8)}
#rf i:nth-child(1){left:7%;top:7%;border-left-width:2px;border-top-width:2px}
#rf i:nth-child(2){right:7%;top:7%;border-right-width:2px;border-top-width:2px}
#rf i:nth-child(3){left:7%;bottom:7%;border-left-width:2px;border-bottom-width:2px}
#rf i:nth-child(4){right:7%;bottom:7%;border-right-width:2px;border-bottom-width:2px}
#rf b{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:5/3;
      translate:-50% -50%;border:1px solid rgba(59,130,246,.75)}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .1s}
/* asleep: the finder and the back fall away until touched */
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:4}
/* PAIK: one bright line rolls down the finder once, the tube warming */
#scan{position:absolute;left:0;right:0;top:0;height:2px;pointer-events:none;z-index:5;opacity:0;
  background:linear-gradient(90deg, transparent, rgba(233,236,242,.85) 20%, rgba(233,236,242,.85) 80%, transparent)}
body.scan #scan{animation:scan .6s cubic-bezier(.3,.4,.4,1) both}
@keyframes scan{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}90%{opacity:.6}100%{opacity:0;transform:translateY(calc(100cqh - 2px))}}
#glass{container-type:size}
.ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:3;
  transform:scale(1);transform-origin:50% 50%;transition:transform .34s cubic-bezier(.3,.7,.3,1), opacity .3s var(--ease)}
/* THE CURTAINS. Inside the finder window itself, so they close over the
   picture and travel with it as it shrinks. Two focal-plane blinds meet across
   the frame after the exposure, hold while the back changes state behind them,
   and part on the small live view. Slow enough to be seen: 140 ms to close,
   380 ms to open. Transforms only. */
#curtains{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
#curtains i{position:absolute;top:0;bottom:0;width:51%;background:linear-gradient(180deg,#0c0c0c,#060606 50%,#0b0b0b);
  transition:transform .46s cubic-bezier(.2,.75,.2,1)}
#curtains .l{left:0;transform:translateX(-102%);box-shadow:inset -4px 0 8px rgba(0,0,0,.95), 1px 0 0 rgba(255,255,255,.10)}
#curtains .r{right:0;transform:translateX(102%);box-shadow:inset 4px 0 8px rgba(0,0,0,.95), -1px 0 0 rgba(255,255,255,.10)}
body.curtain #curtains i{transform:none;transition:transform .14s cubic-bezier(.4,0,1,1)}
/* light through the gap: as the blinds part, a hairline of warm light at the
   meeting line for a few frames, before they have cleared */
#curtains .leak{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg, rgba(255,214,150,.9), rgba(255,246,226,.95) 50%, rgba(170,200,255,.85))}   /* light through a facet: warm edge, cool edge */
body.reentry #curtains .leak{animation:leak .5s ease-out both}
@keyframes leak{0%{opacity:0;transform:scaleX(1)}18%{opacity:.9;transform:scaleX(1.6)}100%{opacity:0;transform:scaleX(6)}}
body.sleep #dim{opacity:.8;transition:opacity 1.6s var(--ease)}
/* asleep, the finder shows the last frame, faint, the way a camera shows its
   last shot on the back; awake, the live view */
#lastframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;
  transition:opacity 1.6s var(--ease);z-index:5}
body.sleep #lastframe[src]{opacity:.6}
body.sleep .deck,body.sleep #backlcd{opacity:.3 !important;transition:opacity 1.6s var(--ease)}
body.sleep #aura,body.sleep #sparkle{opacity:0 !important}
/* TINGUELY: the deck shudders half a pixel with each beat of the motor */
.deck.rattle{animation:rattle .12s steps(2) both}
@keyframes rattle{0%{transform:translate(0,0)}50%{transform:translate(.5px,-.5px)}100%{transform:translate(0,0)}}
/* the back is open: dark while the roll rewinds, the film running backwards */
body.rewinding #dim{opacity:.96}
body.rewinding #scopes{opacity:.15;transition:opacity .6s var(--ease)}
body.rewinding #backlcd .seg{color:var(--mute);text-shadow:none}
body.rewinding #lcdframe{color:#e0a050 !important}
body.rewinding #lcdstate{color:var(--ready)}
body.rewinding #wind .perf{animation:filmback .5s linear infinite;transition:none}
@keyframes filmback{from{transform:translateX(0)}to{transform:translateX(20px)}}
/* a digit arriving from above: the counter running down */
#backlcd .seg.down{animation:odometerdown .12s cubic-bezier(.2,.8,.2,1)}
@keyframes odometerdown{0%{transform:translateY(-7px);opacity:.2}100%{transform:none;opacity:1}}
/* the roll letter turns over like a card */
#backlcd .seg.flip{animation:rollflip .52s cubic-bezier(.3,.7,.2,1)}
@keyframes rollflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg);opacity:.3}51%{opacity:.3}100%{transform:rotateX(0);opacity:1}}
/* ---------- THE ADVANCE ----------
   A camera will not fire until the film is wound on. The strip below the
   finder is that wind: pressing it drags one frame of perforations past and
   cocks the shutter. The finder tightens while cocked and lets go when the
   frame is taken, which is the whole tension of shooting film. */
#windwrap{display:block;position:relative;width:100%;margin:0;height:34px}
#haw{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
     -webkit-appearance:auto;border-radius:8px}   /* native switch = real Taptic on iOS */
/* THE STRIP, minimal: a capsule, a hairline, one dot and the words. Red while
   it asks; emerald, pulsing, once the shutter is set. The film-perforation
   strip is retired; the capsule says everything with two colours. */
#wind{display:block;width:100%;margin:0;height:34px;position:relative;
  background:none;border:1px solid rgba(214,216,222,.20);border-radius:17px;overflow:hidden;padding:0;
  -webkit-tap-highlight-color:transparent}
#wind .perf{display:none;position:absolute;inset:0;
  background-image:radial-gradient(circle at 10px 50%, var(--hair) 0 3.2px, transparent 3.3px);
  background-size:20px 100%;background-repeat:repeat-x;opacity:.85;
  /* the sprocket holes sit one pitch further along for every frame on the
     roll, so the film is visibly somewhere in its travel; a new roll snaps back */
  background-position-x:calc(var(--film,0) * -20px);
  transform:translateX(0);transition:background-position-x .6s var(--ease)}
#wind b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
  font:600 9px var(--ui);letter-spacing:.16em;color:#cf4a44;opacity:.72;transition:color .5s var(--ease)}
#wind b::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
/* set: the words go emerald and breathe. Opacity only; the glow is static. */
body.cocked #wind b{color:#2fd68c;opacity:1;text-shadow:0 0 8px rgba(47,214,140,.35);animation:readypulse 2.2s ease-in-out infinite}
/* in the bath (b172): unwound with a frame developing, the capsule turns fire
   opal and names the stage beneath. It is the deterrent: a double armed
   mid-bath is what killed the page. Opacity only; the glow is static. */
body.processing #wind b{color:#ff6b35;opacity:1;padding-bottom:9px;text-shadow:0 0 8px rgba(255,107,53,.42);animation:readypulse 1.5s ease-in-out infinite}
#windstage{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:500 6.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;
  color:#ff6b35;opacity:0;transition:opacity .3s var(--ease);pointer-events:none}
body.processing #windstage{opacity:.8}
@keyframes readypulse{0%,100%{opacity:.55}50%{opacity:1}}
/* BOCCIONI: on the tap the word snaps wide for a frame and settles. 220 ms, once. */
#wind b.flinch{animation:flinch .22s cubic-bezier(.2,.9,.3,1) both}
@keyframes flinch{0%{letter-spacing:.16em}25%{letter-spacing:.34em}100%{letter-spacing:.16em}}
/* NAUMAN: the READY tube flickers, rarely */
body.cocked #wind b.neon{animation:neon .16s steps(1) both}
@keyframes neon{0%{opacity:1}30%{opacity:.35}45%{opacity:.95}70%{opacity:.5}100%{opacity:1}}
#wind:active{border-color:rgba(214,216,222,.45)}
#wind.winding .perf{transition:transform .58s cubic-bezier(.18,.85,.28,1);transform:translateX(-60px)}
#wind.winding b{opacity:.25}
body.cocked #wind{border-color:rgba(214,216,222,.28);opacity:1}

/* ---------- THE INSTRUMENTS ----------
   Real objects, not charts. Each is a small piece of equipment set into the
   camera back: a machined bezel, a dark glass face, an etched graticule, and
   an amber phosphor trace that decays instead of blinking. They live only in
   the black field around the small finder. Winding on, they swell and fade as
   the eye comes to the eyepiece; firing, they shrink back with the hole. */
#scopes{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:1;transform-origin:50% 50%;overflow:hidden;
  transition:opacity .42s var(--ease), transform .58s cubic-bezier(.16,.9,.22,1)}
/* the approach: the instruments lean toward the eye by 2% and fade. 2% is the
   most the outer cards can grow before their corners would reach the gate,
   given the 12px the layout keeps inside the frame lines; it is chosen so that no state, mid-
   transition or otherwise, can put an instrument pixel outside the black. */
body.cocked #scopes,body.curtain #scopes{opacity:0;transform:scale(1.02)}
/* re-entry after a frame: the field settles from 2% too close, slowly, while
   the blinds are still parting; the individual instruments wake behind it */
body.reentry:not(.cocked) #scopes{transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.16,.8,.2,1)}
body.released #scopes{transition:opacity .26s var(--ease), transform .24s cubic-bezier(.5,0,.9,.4)}
body.sleep #scopes{opacity:0}
#scopes .slot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
#scopes .slot.top,#scopes .slot.bottom{flex-direction:row;align-items:flex-end}
#scopes .card{display:none;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;padding:5px;box-sizing:border-box;animation-delay:0ms}
#scopes .card.on{display:flex}
/* THE HOUSING. Black-painted steel that has been used: the paint is worn
   through to bare metal along the edges and at the corners where fingers go,
   the surface is dull with fine scratches, and it is screwed to the body. Not
   a period piece; a tool. */
#scopes .face{position:relative;border-radius:5px;padding:5px;
  background:
    repeating-linear-gradient(97deg, rgba(255,255,255,.022) 0 1px, transparent 1px 4px),   /* fine scratches, one way */
    repeating-linear-gradient(-63deg, rgba(0,0,0,.18) 0 1px, transparent 1px 7px),          /* and another */
    radial-gradient(90% 70% at 20% 0%, rgba(255,255,255,.07), transparent 55%),
    linear-gradient(160deg, #2d2f31 0%, #1c1d1f 40%, #26282a 65%, #131415 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.95), 0 0 0 1px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.7)}
/* the worn edge: paint gone, steel showing, brighter where it is handled */
#scopes .face::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg, rgba(200,204,210,.75) 0%, rgba(120,124,130,.25) 18%, rgba(60,62,66,.15) 45%, rgba(150,154,160,.4) 78%, rgba(210,214,220,.7) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask-composite:exclude}
/* wear on the paint: chips at the corners, a scuff where a thumb rests, scratches */
#scopes .wear{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(10px 7px at 2% 3%, rgba(190,194,200,.55), rgba(190,194,200,0) 70%),       /* corner chip */
    radial-gradient(8px 6px at 98% 96%, rgba(190,194,200,.5), rgba(190,194,200,0) 70%),
    radial-gradient(6px 9px at 99% 30%, rgba(190,194,200,.35), rgba(190,194,200,0) 70%),
    radial-gradient(34% 26% at 74% 80%, rgba(255,255,255,.05), transparent 70%),               /* thumb scuff */
    radial-gradient(26% 20% at 16% 66%, rgba(0,0,0,.30), transparent 70%),
    linear-gradient(17deg, transparent 41.7%, rgba(220,224,230,.22) 42%, transparent 42.4%),   /* scratches */
    linear-gradient(-37deg, transparent 58.2%, rgba(220,224,230,.16) 58.5%, transparent 58.8%),
    linear-gradient(81deg, transparent 22.6%, rgba(0,0,0,.4) 22.8%, transparent 23.1%),
    linear-gradient(-9deg, transparent 77.1%, rgba(220,224,230,.12) 77.3%, transparent 77.5%)}
/* screws: steel, slotted, each turned a little differently, one of them marred */
#scopes .screw{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%, #a9adb3, #5a5d62 60%, #22242a);
  box-shadow:0 0 0 1px rgba(0,0,0,.8), inset 0 0 1px rgba(255,255,255,.4)}
#scopes .screw::after{content:"";position:absolute;left:1px;right:1px;top:2.5px;height:1px;background:rgba(0,0,0,.9);transform:rotate(var(--turn,0deg))}
#scopes .screw.tl{left:-1px;top:-1px} #scopes .screw.tr{right:-1px;top:-1px}
#scopes .screw.bl{left:-1px;bottom:-1px} #scopes .screw.br{right:-1px;bottom:-1px}
/* the glass over the face */
#scopes canvas{display:block;border-radius:3px;
  box-shadow:inset 0 0 8px rgba(0,0,0,.9), inset 0 0 1px rgba(255,255,255,.08), 0 0 0 1px rgba(0,0,0,.9)}
#scopes .card.vec canvas,#scopes .card.vec .face,#scopes .card.vec .wear{border-radius:50%}
#scopes .card.vec .screw{display:none}
/* the nameplate: engraved into the steel below the face */
#scopes .lbl{font:600 6.5px/9px var(--ui);height:9px;letter-spacing:.16em;color:#8b8f95;opacity:.9;
  max-width:100%;white-space:nowrap;overflow:hidden;
  text-shadow:0 -1px 0 rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.12)}
/* the glass: a soft curved specular across the upper face; the lamp: a warm
   glow along the top inside edge of the bezel, lighting the dial from above */
#scopes .face::after{content:"";position:absolute;inset:5px;border-radius:3px;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -20%, rgba(220,226,235,.09), transparent 60%),
    linear-gradient(172deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.03) 28%, transparent 46%),
    linear-gradient(var(--g1a,28deg), transparent calc(var(--g1p,34%) - .3%), rgba(255,255,255,var(--g1o,.1)) var(--g1p,34%), transparent calc(var(--g1p,34%) + .4%)),
    linear-gradient(var(--g2a,-52deg), transparent calc(var(--g2p,61%) - .2%), rgba(255,255,255,var(--g2o,.07)) var(--g2p,61%), transparent calc(var(--g2p,61%) + .3%)),
    linear-gradient(var(--g3a,11deg), transparent calc(var(--g3p,80%) - .2%), rgba(255,255,255,var(--g3o,.05)) var(--g3p,80%), transparent calc(var(--g3p,80%) + .3%))}
#scopes .card.vec .face::after{border-radius:50%;inset:5px}
/* WARM-UP: switched on, the face glows up from dark over half a second */
#scopes .card.warm{animation:warmup .7s cubic-bezier(.25,.6,.2,1) both}
@keyframes warmup{0%{opacity:0;transform:translateY(3px)}100%{opacity:1;transform:none}}
/* THE TINY FINDER. Between frames the camera has only a small bright window
   of the scene, sharp and real, sitting in the middle of the dark. Winding on
   enlarges it to the full gate over exactly the length of the lever stroke, so
   the picture grows while the ratchet runs. */
#glass{transition:transform .3s var(--ease)}
body:not(.cocked) #grid,body:not(.cocked) #quad{opacity:.10}
body:not(.cocked) #rf,body:not(.cocked) #spot,body:not(.cocked) #cross{opacity:.2}
body:not(.cocked) .deck{opacity:.6;transition:opacity .3s var(--ease)}
#backlcd{opacity:var(--ambient,1);transition:opacity 1.2s var(--ease)}
/* LOCK IN: the grid goes from a grey suggestion to a hard white frame line.
   Idle it is barely there; set, it is the brightest thing on the glass. */
#lockgrid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  background:
   linear-gradient(to right, transparent calc(33.33% - 5px), rgba(236,150,60,.13) 33.33%, transparent calc(33.33% + 5px)),
   linear-gradient(to right, transparent calc(33.33% - 1.6px), rgba(255,236,200,.38) 33.33%, transparent calc(33.33% + 1.6px)),
   linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + 1px)),
   linear-gradient(to right, transparent calc(66.66% - 5px), rgba(236,150,60,.13) 66.66%, transparent calc(66.66% + 5px)),
   linear-gradient(to right, transparent calc(66.66% - 1.6px), rgba(255,236,200,.38) 66.66%, transparent calc(66.66% + 1.6px)),
   linear-gradient(to right, transparent calc(66.66% - 1px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + 1px)),
   linear-gradient(to bottom, transparent calc(33.33% - 5px), rgba(236,150,60,.13) 33.33%, transparent calc(33.33% + 5px)),
   linear-gradient(to bottom, transparent calc(33.33% - 1.6px), rgba(255,236,200,.38) 33.33%, transparent calc(33.33% + 1.6px)),
   linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,1) 33.33%, transparent calc(33.33% + 1px)),
   linear-gradient(to bottom, transparent calc(66.66% - 5px), rgba(236,150,60,.13) 66.66%, transparent calc(66.66% + 5px)),
   linear-gradient(to bottom, transparent calc(66.66% - 1.6px), rgba(255,236,200,.38) 66.66%, transparent calc(66.66% + 1.6px)),
   linear-gradient(to bottom, transparent calc(66.66% - 1px), rgba(255,255,255,1) 66.66%, transparent calc(66.66% + 1px))}
body.cocked.f-grid #lockgrid{opacity:var(--room,1);animation:lockin .5s cubic-bezier(.16,.9,.22,1) both;transition:opacity 1.2s var(--ease)}
@keyframes lockin{0%{transform:scale(1.2);opacity:0}55%{opacity:1}72%{transform:scale(.992)}100%{transform:none;opacity:1}}
body.released #lockgrid{animation:lockout .32s var(--ease) both}
@keyframes lockout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.9)}}
/* ---------- THE TURN (b179): rotation as one continuous motion ----------
   iOS cuts a PWA from one layout to the other. The body turns in from where it
   was (1), overshoots and settles (3); the world under it counter-rotates so
   the scene holds still (2, 17). The blinds meet, the turn happens on the
   body, the blinds part with the leak along the new seam (6). The deck rides
   its rail (13), the finder grows into its gate (15), the panel re-contacts
   (7), the caustics stay with the room's light (12), the sheet turns as one
   (18), the strip hangs in landscape (19), the squeeze plate leans (20).
   All transform/opacity; the rest is in turnChoreo(). */
@keyframes bodyturn{0%{transform:rotate(var(--turnfrom,0deg))}78%{transform:rotate(calc(var(--turnfrom,0deg) * -0.0133))}100%{transform:rotate(0deg)}}
@keyframes worldstay{0%{transform:rotate(var(--turnback,0deg))}78%{transform:rotate(calc(var(--turnback,0deg) * -0.0133))}100%{transform:rotate(0deg)}}
body.turning #camera,body.turning #contact.on,body.turning #print.on{animation:bodyturn .5s cubic-bezier(.16,.9,.22,1) both}
body.turning #video,body.turning #stage img.in{animation:worldstay .5s cubic-bezier(.16,.9,.22,1) both}
@keyframes deckride{from{transform:translate(var(--deckx,0),var(--decky,0))}to{transform:none}}
body.turning .deck{animation:deckride .45s cubic-bezier(.16,.9,.22,1) .05s both;--deckx:34%;--decky:-40%}
@keyframes gategrow{from{transform:scale(.97)}to{transform:scale(1)}}
body.turning #glass{animation:gategrow .4s cubic-bezier(.16,.9,.22,1) .26s both}
#backlcd.recontact .seg,#backlcd.recontact .state{animation:segflicker .6s steps(1) both}
@keyframes lean{0%{transform:rotate(0)}40%{transform:rotate(4deg)}100%{transform:rotate(0)}}
#anawarn.lean{animation:lean .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes leakY{0%{opacity:0;transform:scaleY(1)}18%{opacity:.9;transform:scaleY(1.6)}100%{opacity:0;transform:scaleY(6)}}
@media (orientation: landscape){
  body.turning .deck{--deckx:-40%;--decky:34%}
  #caustic{transform:rotate(-90deg)}
  body.flip #caustic{transform:rotate(90deg)}
  /* the blinds hang top and bottom for a horizontal gate; the seam is horizontal */
  #curtains i{top:auto;bottom:auto;left:0;right:0;width:100%;height:51%;background:linear-gradient(90deg,#0c0c0c,#060606 50%,#0b0b0b)}
  #curtains .l{top:0;transform:translateY(-102%);box-shadow:inset 0 -4px 8px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.10)}
  #curtains .r{bottom:0;transform:translateY(102%);box-shadow:inset 0 4px 8px rgba(0,0,0,.95), 0 -1px 0 rgba(255,255,255,.10)}
  #curtains .leak{left:0;right:0;top:50%;bottom:auto;width:auto;height:3px;margin:-1.5px 0 0 0;
    background:linear-gradient(180deg, var(--lka, rgba(255,214,150,.9)), var(--lkm, rgba(255,246,226,.95)) 50%, var(--lkb, rgba(170,200,255,.85)))}
  body.reentry #curtains .leak{animation:leakY .5s ease-out both}
}
/* ---------- FIFTEEN (b176): alive, caused, opacity/transform only ----------
   1 the dust drifts and one point is mostly away. 2 the writing and the line
   warm in the hand. 3 the counter tires near the end of its travel. 4 the hand
   holding the camera. 6 low light hazes the finder. 7 gold arrives after the
   silver. 9 the wet negative breathes. 10 the new print dries. 13 an empty
   chip is an unexposed frame. 15 the shelf drifts. (5, 8, 11, 12, 14 in JS.) */
@keyframes dustdrift1{from{transform:translate(0,0)}to{transform:translate(3px,-2px)}}
@keyframes dustdrift2{from{transform:translate(0,0)}to{transform:translate(-2px,3px)}}
body.cocked #sparkle i:nth-child(1){animation:twinkle 9.3s ease-in-out infinite, dustdrift1 41s ease-in-out infinite alternate}
body.cocked #sparkle i:nth-child(2){animation:twinkle 11.1s ease-in-out -3.1s infinite, dustdrift2 53s ease-in-out infinite alternate}
#sparkle i:nth-child(5){display:block;background-image:radial-gradient(circle at 71% 23%, rgba(240,242,246,.9) 0 .5px, transparent 1.1px)}
body.cocked #sparkle i:nth-child(5){animation:twinkle 41s ease-in-out infinite, dustdrift2 61s ease-in-out infinite alternate}
body.warmbody #backlcd .seg,body.warmbody #backlcd .lbl{color:#dad4c9;transition:color 90s linear}
body.warmbody #lockline rect{stroke:rgba(255,236,204,.9);transition:stroke 90s linear}
#backlcd .seg.tick.heavy{animation-duration:.6s;animation-timing-function:cubic-bezier(.25,.9,.15,1)}
#backlcd .seg.tick.last{animation-duration:.9s}
@keyframes handx{from{transform:translateX(0)}to{transform:translateX(.5px)}}
@keyframes handy{from{transform:translateY(0)}to{transform:translateY(-.5px)}}
body.cocked #lockline{animation:handx 8s ease-in-out infinite alternate}
body.cocked #lockline rect{animation:oneline .72s cubic-bezier(.3,.6,.15,1) .12s both, handy 13s ease-in-out infinite alternate}
#curtains .leak{background:linear-gradient(90deg, var(--lka, rgba(255,214,150,.9)), var(--lkm, rgba(255,246,226,.95)) 50%, var(--lkb, rgba(170,200,255,.85)))}
#lowbloom{position:absolute;inset:-10%;pointer-events:none;z-index:2;opacity:0;transition:opacity 2.4s var(--ease);mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 46%, rgba(255,188,120,.11), rgba(255,160,90,.045) 46%, transparent 72%)}
body.dimlight #lowbloom{opacity:1}
body.sleep #lowbloom{opacity:0}
body.cocked #below{opacity:.5;transition-delay:.2s}
@keyframes wet{0%,100%{opacity:.8}50%{opacity:1}}
#chip.cooking > img:not(.step){animation:wet 4s ease-in-out infinite}
#stage.wet{overflow:hidden}
#stage.wet::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.16) 50%, transparent 62%);animation:sheen .9s cubic-bezier(.4,0,.2,1) .1s both}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
#chip:not(.hasimg):not(.cooking){background-image:
  repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,255,255,.09) 5px 7px),
  repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,255,255,.09) 5px 7px);
  background-size:100% 3px,100% 3px;background-repeat:repeat-x;background-position:0 4px,0 calc(100% - 4px)}
#chip:not(.hasimg) .play{opacity:0}
#lastframe{transition:opacity 2.4s cubic-bezier(.4,0,.2,1)}
@keyframes shelfdrift{from{transform:scale(1)}to{transform:scale(1.015)}}
body.sleep #lastframe[src]{animation:shelfdrift 20s linear both}
/* ---------- THE OTHER MARKS SET (b161) ----------
   Quad, spot and cross join the shutter-set state under the same doctrine as
   the grid and the patch: glow drawn into the raster once, breath on a second
   copy cross-fading on opacity, everything else class-toggled opacity or
   transform. One lamp feeds the glass; it dies with the shutter. */
/* QUADRANTS, set: the same kind of mark as thirds, so the same lock. The
   ::after is the horizon alone, breathing on the grid's own saber 1.2s behind
   it - one lamp circuit, two rooms. */
#lockquad{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  background:
   linear-gradient(to right, transparent calc(50% - 5px), rgba(236,150,60,.13) 50%, transparent calc(50% + 5px)),
   linear-gradient(to right, transparent calc(50% - 1.6px), rgba(255,236,200,.38) 50%, transparent calc(50% + 1.6px)),
   linear-gradient(to right, transparent calc(50% - 1px), rgba(255,255,255,1) 50%, transparent calc(50% + 1px)),
   linear-gradient(to bottom, transparent calc(50% - 5px), rgba(236,150,60,.13) 50%, transparent calc(50% + 5px)),
   linear-gradient(to bottom, transparent calc(50% - 1.6px), rgba(255,236,200,.38) 50%, transparent calc(50% + 1.6px)),
   linear-gradient(to bottom, transparent calc(50% - 1px), rgba(255,255,255,1) 50%, transparent calc(50% + 1px))}
#lockquad::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:
   linear-gradient(to bottom, transparent calc(50% - 8px), rgba(236,150,60,.22) 50%, transparent calc(50% + 8px)),
   linear-gradient(to bottom, transparent calc(50% - 2.4px), rgba(255,236,200,.55) 50%, transparent calc(50% + 2.4px)),
   linear-gradient(to bottom, transparent calc(50% - 1px), rgba(255,255,255,1) 50%, transparent calc(50% + 1px))}
body.cocked.f-quad #lockquad{opacity:var(--room,1);animation:lockin .5s cubic-bezier(.16,.9,.22,1) both;transition:opacity 1.2s var(--ease)}
body.cocked.f-quad #lockquad::after{animation:saber 3.6s ease-in-out 1.7s infinite}
body.released #lockquad{animation:lockout .32s var(--ease) both}
/* the crossing keeps a void, like the cross: a solid crossing hides the one
   thing it points at. Cut from base and lock layers alike, rasterised once. */
#quad,#lockquad,#lockquad::after{
  -webkit-mask:radial-gradient(circle at 50% 50%, transparent 0 8px, #000 15px);
          mask:radial-gradient(circle at 50% 50%, transparent 0 8px, #000 15px)}
/* SPOT, set: the meter takes hold. Arms extend inward from their outer ends;
   the ring takes the patch's heat, breath on a duplicate ring behind, its own
   period so the glass never pulses in unison. */
#spot{transition:border-color .5s var(--ease), box-shadow .5s var(--ease)}
#spot i{transition:transform .45s var(--ease)}
#spot i:nth-child(1){transform-origin:50% 0}
#spot i:nth-child(2){transform-origin:50% 100%}
#spot i:nth-child(3){transform-origin:0 50%}
#spot i:nth-child(4){transform-origin:100% 50%}
body.cocked #spot i:nth-child(-n+2){transform:scaleY(1.3)}
body.cocked #spot i:nth-child(n+3){transform:scaleX(1.3)}
body.cocked #spot{border-color:rgba(255,236,206,.9);
  box-shadow:0 0 2px rgba(255,220,170,.55), 0 0 9px rgba(240,140,50,.30), 0 0 22px rgba(236,120,40,.14)}
#spot::after{content:"";position:absolute;inset:-1px;border-radius:50%;pointer-events:none;opacity:0;
  box-shadow:0 0 3px rgba(255,232,190,.9), 0 0 14px rgba(244,140,44,.5), 0 0 30px rgba(236,120,40,.28)}
body.cocked #spot::after{animation:rfire 3.4s ease-in-out .9s infinite}
/* the cell: the dot follows the metered light, stepped on the panel's 2.5 Hz
   clock and smoothed by its transition - a meter, not a lamp. */
#spot::before{opacity:calc(.35 + .6*var(--cell,.55));transition:opacity .4s linear}
/* the blind: a closed shutter is the one thing the cell cannot see past. The
   reticle collapses to its dot for the cage silence and comes back dim. */
body.released #spot{animation:spotblind .9s var(--ease) both}
@keyframes spotblind{0%{transform:none}30%{transform:scale(.08)}68%{transform:scale(.08)}100%{transform:none}}
/* CROSS, set: collimated. A second cross, prebuilt with a tighter void and a
   warm sheath, cross-fades over the idle one - two rasters, one fade. On cock
   its arms strike from the centre on the lock-in curve, once. */
#lockcross{position:absolute;left:50%;top:50%;width:22px;height:22px;
  translate:-50% -50%;display:none;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  filter:drop-shadow(0 0 1.5px rgba(255,220,170,.5)) drop-shadow(0 0 6px rgba(236,140,50,.2))}
body.f-cross #lockcross{display:block}
#lockcross::before,#lockcross::after{content:"";position:absolute;background:rgba(255,255,255,.95)}
#lockcross::before{left:0;right:0;top:50%;height:1px;
  -webkit-mask:linear-gradient(to right,#000 0 42%,transparent 42% 58%,#000 58% 100%);
          mask:linear-gradient(to right,#000 0 42%,transparent 42% 58%,#000 58% 100%)}
#lockcross::after{top:0;bottom:0;left:50%;width:1px;
  -webkit-mask:linear-gradient(to bottom,#000 0 42%,transparent 42% 58%,#000 58% 100%);
          mask:linear-gradient(to bottom,#000 0 42%,transparent 42% 58%,#000 58% 100%)}
body.cocked.f-cross #lockcross{opacity:1}
body.cocked.f-cross #cross{opacity:0;transition:opacity .3s var(--ease)}
body.cocked.f-cross #lockcross::before{animation:lampx .4s cubic-bezier(.16,.9,.22,1) both}
body.cocked.f-cross #lockcross::after{animation:lampy .4s cubic-bezier(.16,.9,.22,1) both}
@keyframes lampx{from{transform:scaleX(0)}to{transform:none}}
@keyframes lampy{from{transform:scaleY(0)}to{transform:none}}
body.released #lockcross{animation:lockout .32s var(--ease) both}
/* tension: corner marks that draw in when the shutter is cocked */
#tension{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .28s var(--ease)}
#tension i{position:absolute;width:20px;height:20px;border:2px solid rgba(255,255,255,.95)}
#tension i:nth-child(1){top:10px;left:10px;border-right:0;border-bottom:0}
#tension i:nth-child(2){top:10px;right:10px;border-left:0;border-bottom:0}
#tension i:nth-child(3){bottom:10px;left:10px;border-right:0;border-top:0}
#tension i:nth-child(4){bottom:10px;right:10px;border-left:0;border-top:0}
body.cocked #tension{opacity:1}
body.cocked #tension i{animation:drawin .34s var(--ease) both}
@keyframes drawin{from{transform:translate(var(--dx,0),var(--dy,0)) scale(1.9);opacity:0}
                  to{transform:none;opacity:1}}
/* the finder itself leans in while cocked, and lets go on release */

body.cocked #grid,body.cocked #quad{opacity:.85}
body.released #glass{animation:letgo .42s cubic-bezier(.34,1.56,.64,1) both}
@keyframes letgo{0%{transform:scale(1.012)}45%{transform:scale(.994)}100%{transform:none}}
/* shutter sits dark until the film is wound */
#shutter{transition:opacity .25s var(--ease)}
body:not(.cocked) #shutter{opacity:.38}
#wind.nudge{animation:nudge .3s}
/* ASKING. Everything else on the idle back is still, so the one thing that

body:not(.cocked) #wind b{animation:askglow 4.6s ease-in-out infinite;text-shadow:0 0 8px rgba(207,74,68,.25)}
@keyframes askglow{0%,100%{opacity:.5}50%{opacity:.95}}

@keyframes askring{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#denied{position:absolute;inset:0;display:none;place-items:center;

#chip .scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
#fly{position:fixed;z-index:80;object-fit:cover;border-radius:5px;pointer-events:none;transform-origin:0 0;opacity:.95;
     transition:transform .46s cubic-bezier(.2,.75,.2,1), opacity .26s var(--ease)}
#lablog{position:fixed;inset:0;z-index:90;display:none;margin:0;padding:calc(env(safe-area-inset-top) + 24px) 18px 40px;background:rgba(5,5,6,.97);
  color:#d1d5dd;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;overflow:auto;-webkit-user-select:text;user-select:text}

#contact .head .close{font:600 10px var(--ui);letter-spacing:.14em;color:var(--silver);border:1px solid var(--hair);border-radius:999px;padding:7px 12px;flex:0 0 auto}
#contact .head .tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
#contact .head .tabs button{font:600 10px var(--ui);letter-spacing:.12em;color:var(--mute);border:1px solid var(--hair);border-radius:999px;padding:7px 11px;white-space:nowrap}
#contact .head .tabs button.cur{color:#c9a862;border-color:rgba(201,168,98,.55)}
#contact .head .of{color:var(--mute);font-size:9px;flex:0 0 auto}
#contact .head .share{font:600 10px var(--ui);letter-spacing:.14em;color:#c9a862;border:1px solid rgba(201,168,98,.4);border-radius:999px;padding:7px 12px;flex:0 0 auto}
#contact .frames .hint{grid-column:1 / -1;text-align:center;padding:14px 0 4px;font:600 8px var(--ui);letter-spacing:.16em;color:var(--mute);opacity:.6}
#contact .frames{flex:1;display:grid;grid-template-columns:repeat(6, 1fr);gap:6px 6px;align-content:start;overflow:auto}
#contact .cell{position:relative;aspect-ratio:5/4;background:#0d0e11;border:1px solid var(--hair);border-radius:2px;overflow:hidden;
  animation:cellwake .5s var(--ease) both}
@keyframes cellwake{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#contact .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#contact .cell b{position:absolute;left:3px;bottom:2px;font:600 6px var(--ui);letter-spacing:.12em;color:#c9a862;opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.9)}
/* WESTON, turned (b178): the sheet keeps portrait's cell size in landscape. The
   grid's width is the device's short side either way, centred; rows size to
   their cells and never stretch to fill the height, so a 5:4 frame stays 5:4. */
#contact .frames{align-items:start;grid-auto-rows:max-content}
@media (orientation: landscape){
  #contact .frames{width:calc(100vh - 32px);max-width:100%;margin:0 auto}
}
#chip .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:#000}
#chip .mosaic img{position:static;width:100%;height:100%;object-fit:cover;display:block}
#chip .play{position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:0;height:0;border-left:9px solid rgba(244,242,237,.92);
  border-top:6px solid transparent;border-bottom:6px solid transparent;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.8));pointer-events:none}
#chip.hasimg .play{opacity:.85}
#chip .dot{position:relative;display:none}
#chip.cooking .dot{display:inline-block}
#chip .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#chip,#strip button{transition:transform .22s var(--ease)}
#chip:active,#strip button:active{transform:scale(.94);transition-duration:.07s}
#back:active{opacity:.55}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes chipin{from{opacity:0;transform:scale(.9)}}
@keyframes stepup{
  from{opacity:0;filter:brightness(1.65) contrast(.55) saturate(.85)}
  55%{opacity:1}
  to{opacity:1;filter:none}}
#shutterwrap{position:relative;flex:0 0 auto}
#shutter{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--w);
         display:grid;place-items:center}
#shutter i{width:64px;height:64px;border-radius:50%;background:var(--w);
           display:block;transition:transform .22s var(--ease)}
#shutter:active i, #shutter.pressed i{transform:scale(.88);transition-duration:.07s}
/* a real, invisible native switch rides the shutter: the finger's own tap
   toggles it, so iOS plays the Taptic tick — no script, nothing to patch */
#hap{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
     clip-path:circle(50%);-webkit-appearance:auto}
.lensbtn{position:relative;width:46px;height:46px;flex:0 0 auto;border-radius:50%;
  transition:opacity .3s var(--ease);
  border:1px solid var(--hair);color:var(--mute);
  font-family:var(--ui);font-weight:600;font-size:11.5px;letter-spacing:.06em;color:var(--silver)}
.lensbtn.locked{opacity:.45}
.lensbtn img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);
  object-fit:contain;pointer-events:none;display:block}
.lensbtn:active{color:var(--w);border-color:var(--mute)}
#anamenu{left:24px;right:auto}
#lensmenu,#anamenu,#findermenu,#scopemenu,#servicemenu{position:fixed;display:none;flex-direction:column;gap:2px;z-index:12;
  background-color:var(--k);background-image:var(--grain);
  border:1px solid var(--hair);border-radius:14px;
  padding:8px 4px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 106px)}

#lensmenu button,#anamenu button,#findermenu button,#scopemenu button,#servicemenu button{font-family:var(--ui);font-weight:500;font-size:13px;letter-spacing:.04em;color:var(--ink);

.hapov{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
       -webkit-appearance:auto}
#lensmenu button.cur,#anamenu button.cur,#findermenu button.cur{color:var(--dot)}
#scopemenu button.cur{color:var(--ready)}
#scopemenu,#servicemenu{right:auto;left:18px;bottom:auto;top:calc(env(safe-area-inset-top) + 96px)}
#scopemenu .hint{font:600 9px var(--ui);letter-spacing:.12em;color:var(--mute);opacity:.6;padding:4px 18px 6px}
#lensmenu button:disabled,#anamenu button:disabled,#findermenu button:disabled{opacity:.25}
#lensveil{position:fixed;inset:0;display:none;z-index:11}
#lensveil.on{display:block}
#lensmenu,#anamenu,#findermenu,#scopemenu,#servicemenu{display:flex;opacity:0;pointer-events:none;
  transform:translateY(8px) scale(.97);
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
#lensmenu.on,#anamenu.on,#findermenu.on,#scopemenu.on,#servicemenu.on{opacity:1;pointer-events:auto;transform:none}

/* ---------- landscape: 5:4 horizontal format, controls on the right ---------- */
@media (orientation: landscape){
  /* the back panel keeps its row in landscape, sized down, and spans only the
     gate's width so it never runs under the deck or the version */
  .top{height:26px;padding:0}
  /* four exposed edges instead of two: the seam carries a third of the light here */
  body.cocked #aura{opacity:.34}
  #backlcd{position:absolute;top:calc(3px + env(safe-area-inset-top));
           left:calc(43px + env(safe-area-inset-left));right:calc(189px + env(safe-area-inset-right));
           flex:none;padding:2px 10px;gap:5px}
  #backlcd .seg{font-size:12px}
  #backlcd .lbl{font-size:7.5px;margin-right:4px}
  #backlcd .state{font-size:8.5px}
  body.flip #backlcd{left:calc(189px + env(safe-area-inset-left));right:calc(43px + env(safe-area-inset-right))}
  body.ana #backlcd{left:calc(6px + env(safe-area-inset-left));right:calc(184px + env(safe-area-inset-right))}
  body.flip.ana #backlcd{left:calc(184px + env(safe-area-inset-left));right:calc(6px + env(safe-area-inset-right))}

  #frame{padding:0 calc(189px + env(safe-area-inset-right))
                 0 calc(43px + env(safe-area-inset-left))}
  #glass{width:auto;height:100%;aspect-ratio:5/4}
  /* one dimension must be real: aspect-ratio alone cannot size a box whose
     only child is absolutely positioned, and it collapsed to nothing. The
     frame is width-limited at every squeeze on a phone, so take the width
     and let the ratio give the height. */
  body.ana #glass{width:100%;height:auto;max-height:100%;
                  aspect-ratio:calc(1.25 * var(--sq, 1))}
  body.ana #frame{padding:0 calc(184px + env(safe-area-inset-right))
                    0 calc(6px + env(safe-area-inset-left))}
  body.flip.ana #frame{padding:0 calc(6px + env(safe-area-inset-right))
                         0 calc(184px + env(safe-area-inset-left))}
  body.ana #glass video{right:auto;left:50%;translate:-50% 0;
                        width:calc(100% / var(--sq, 1))}
  .deck{position:absolute;top:0;bottom:0;
        right:calc(38px + env(safe-area-inset-right));width:138px;
        display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto auto 1fr;
        align-items:center;justify-items:center;padding:34px 12px;gap:12px 0}
  /* the strip sits IN the column, between the lens pair and the shutter. It
     is a short horizontal strip here, same perforations as portrait, because
     the column is only 138px wide and a vertical rail beside it was the wrong
     place from the start. */
  #windwrap{position:static;width:100%;height:30px;margin:0;grid-column:auto;grid-row:auto;order:1}
  #wind{height:30px}
  #wind b{font-size:8px;letter-spacing:.14em}
  #chips,#shutterwrap,#rightstack{grid-column:auto;grid-row:auto}
  #chips,#shutterwrap,#rightstack{justify-self:center}
  #rightstack{flex-direction:row;align-self:start}
  #chips{align-self:end}
  /* clockwise turn: the phone's bottom edge is now on the LEFT, so the deck
     goes with it and the gate padding mirrors. The deck's INTERNAL layout does
     not mirror - b65: flipping align-self here without also flipping `order`
     only dragged both groups to the inner edge of their row, collapsing the
     232px gap above the lens pair. The deck now reads identically in both
     landscapes: lens pair pinned to the top, chip + ana pinned to the bottom. */
  body.flip .deck{right:auto;left:calc(38px + env(safe-area-inset-left))}
  body.flip #frame{padding:0 calc(43px + env(safe-area-inset-right))
                     0 calc(189px + env(safe-area-inset-left))}
  .deck::before{inset:16px 6px}
  /* the original landscape order, restored in b93: lens pair at the top,
     shutter in the middle, gallery and OFF at the bottom. b89 reversed this
     under a mistaken reading of portrait and the owner caught it. */
  #rightstack{order:0}
  #shutterwrap{order:2}
  #chips{order:3;flex-direction:column}
  .spacer{display:none}
  #lensmenu,#anamenu,#findermenu{right:calc(env(safe-area-inset-right) + 190px);left:auto;
            bottom:auto;top:50%;translate:0 -50%}
  body.flip #lensmenu,body.flip #anamenu,body.flip #findermenu{
            right:auto;left:calc(env(safe-area-inset-left) + 190px)}
}

/* ---------- print ---------- */
#print{position:fixed;inset:0;background:var(--k);background-image:var(--grain);
       display:flex;flex-direction:column;
       z-index:10;padding-top:env(safe-area-inset-top);
       opacity:0;pointer-events:none;transform:scale(.985);
       transition:opacity .26s var(--ease),transform .26s var(--ease)}
#print.on{opacity:1;pointer-events:auto;transform:none}
#print .bar{display:flex;align-items:center;padding:12px 18px}
#ver{display:none}      /* the build now lives inside the back panel */
#back{width:34px;height:34px;position:relative}
#back::before{content:"";position:absolute;left:11px;top:9px;width:12px;height:12px;
  border-left:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);
  transform:rotate(45deg)}
.barx{margin-left:auto;display:flex;gap:6px;align-items:center}
/* the edge code: roll letter and frame, the way they are printed along the
   film's rebate. Gold, small, beside the back button. */
#edgecode{margin-left:14px;font:500 10px var(--ui);letter-spacing:.14em;color:#c9a862;opacity:.85}
#stage{flex:1;position:relative;min-height:0;margin:0 16px calc(70px + env(safe-area-inset-bottom))}   /* b182: the foot is absolute; leave its height so the print centres above it */
/* REMBRANDT. The print is the only lit object in the room: a soft light from
   the upper left, and the field falling to true black at the edges. */
#print{background:#050506}
#stage::after{content:"";position:absolute;inset:-16px;pointer-events:none;z-index:4;
  background:radial-gradient(125% 110% at 24% 14%, rgba(0,0,0,0) 34%, rgba(0,0,0,.28) 72%, rgba(0,0,0,.62) 100%)}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           -webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;
           opacity:0;transition:opacity .22s var(--ease),transform .3s var(--ease)}
#stage img.in{opacity:1}
#stage img.watch{-webkit-touch-callout:none;user-select:none;
                 -webkit-user-select:none;pointer-events:none}
/* THE BATH: the print comes up the way a print comes up — blank paper, then
   the dye clouds forming over each other. Yellow develops first (it sits on
   top of the pack), then magenta, then cyan; the three multiply back to
   exactly the finished print, so the hand-off at the end is pixel-identical. */
.bath{position:absolute;inset:0;isolation:isolate;pointer-events:none;
      opacity:0;transform:scale(.965);
      transition:opacity .55s var(--ease),transform 1.6s var(--ease)}
.bath.on{opacity:1;transform:none}
.bath img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* TURNER. The maiden print does not come up from dark; it condenses out of
   light. The paper stage is a bright wash that the image is drawn out of. */
.bath img.paper{filter:brightness(0) invert(1) brightness(1.15);animation:wash 1.6s var(--ease) both}
@keyframes wash{0%{opacity:0}30%{opacity:1}100%{opacity:1}}
.bath img.y,.bath img.m,.bath img.c{mix-blend-mode:multiply;opacity:0}
.bath img.y{filter:url(#dyeY);animation:dyein 1.15s var(--ease) .22s forwards}
.bath img.m{filter:url(#dyeM);animation:dyein 1.25s var(--ease) .62s forwards}
.bath img.c{filter:url(#dyeC);animation:dyein 1.40s var(--ease) 1.05s forwards}
@keyframes dyein{to{opacity:1}}
/* a print already seen doesn't need the whole bath again — same three dyes,
   same order, a third of the time: a nod to how it got here */
.bath.quick{transition:opacity .20s var(--ease),transform .70s var(--ease)}
.bath.quick img.y{animation-duration:.40s;animation-delay:.06s}
.bath.quick img.m{animation-duration:.44s;animation-delay:.20s}
.bath.quick img.c{animation-duration:.48s;animation-delay:.34s}
@keyframes comeup{from{opacity:0;filter:brightness(1.8) contrast(.4)}to{opacity:1;filter:none}}
#stage img.fresh{animation:comeup 1.2s ease-out both}
@media(prefers-reduced-motion:reduce){#stage img.fresh{animation:none}}
#print .foot{position:absolute;left:0;right:0;bottom:0;display:flex;
             justify-content:center;pointer-events:none;
             padding:12px 0 calc(14px + env(safe-area-inset-bottom));
             background:linear-gradient(transparent, rgba(10,10,10,.55))}
#strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:0 22px;
       -webkit-overflow-scrolling:touch;pointer-events:auto}
#strip button{flex:0 0 auto;width:44px;height:44px;border-radius:5px;overflow:hidden;
              border:1px solid transparent}
#strip button.sel{border-color:var(--dot)}
#strip button.sing{animation:sing .9s var(--ease) both}
@keyframes sing{0%{box-shadow:0 0 0 1.5px var(--note,#fff), 0 0 10px var(--note,#fff)}100%{box-shadow:0 0 0 0 transparent, 0 0 0 transparent}}
#strip button{position:relative}
#strip .tw{position:relative;flex:0 0 auto;width:44px;height:44px}
#strip .tw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
                 -webkit-appearance:auto;border-radius:5px;
                 touch-action:pan-x pan-y}   /* a drag across a switch is a scroll, not a slide */
#strip{touch-action:pan-x;cursor:grab}
#strip.dragging{cursor:grabbing;scroll-snap-type:none}
#strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#strip img.step{animation:stepup 2.4s var(--ease) both}
#strip .scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
#strip .dot{position:relative;width:6px;height:6px}
#strip .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#strip button.cook{display:grid;place-items:center}
@media (orientation: landscape){
  #print{padding-top:0}
  /* the strip hangs to dry down the right side (b182: placed after the base
     rules - written earlier, left:0 from the base won and hung it on the left) */
  #print .foot{left:auto;right:0;top:calc(44px + env(safe-area-inset-top));bottom:0;width:110px;flex-direction:column;justify-content:flex-start;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(90deg, transparent, rgba(10,10,10,.55))}
  #strip{flex-direction:column;overflow-y:auto;overflow-x:hidden;max-width:none;max-height:100%;padding:22px 0;touch-action:pan-y;align-items:center}
  #stage{margin:0 calc(110px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
  /* b183: the strip hangs on the side the phone's bottom edge is on, like the deck */
  body.flip #print .foot{right:auto;left:0;background:linear-gradient(270deg, transparent, rgba(10,10,10,.55))}
  body.flip #stage{margin:0 calc(16px + env(safe-area-inset-right)) 0 calc(110px + env(safe-area-inset-left))}
  #print .bar{position:absolute;top:0;left:0;right:0;z-index:2;
              padding:calc(6px + env(safe-area-inset-top)) 14px 6px}
}

@media(prefers-reduced-motion:reduce){
  #print,#stage img,#lensmenu,#chips,#shutterwrap,#rightstack,
  #chip,#chip img,#strip button,#strip img,
  .bath,.bath img{transition:none;animation:none}
</style>
</head>
