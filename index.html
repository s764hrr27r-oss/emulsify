*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--k);background-image:var(--grain);color:var(--w);
     font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif;
     font-weight:300;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}

/* ---------- camera (portrait-locked presentation) ---------- */
#camera{position:fixed;inset:0;display:flex;flex-direction:column;
        padding-top:env(safe-area-inset-top);
        transition:transform .26s var(--ease), opacity .24s var(--ease)}
body.paged #camera{transform:scale(.97)}
body.rot #camera,body.rot #print,body.rot #ring{
  opacity:0 !important;
  transform:scale(.94) rotate(var(--turnhint,0deg)) !important;
  transition:opacity .16s ease,transform .16s ease !important}
body.settle #camera,body.settle #print,body.settle #ring{
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.top{display:flex;align-items:center;justify-content:center;padding:16px 0 12px}
#frame{flex:1;display:grid;place-items:center;min-height:0;padding:0 0 6px}
@keyframes bootin{from{opacity:0;transform:scale(.965)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#chips{animation:rise .5s var(--ease) both .08s}
#shutterwrap{animation:rise .5s var(--ease) both .16s}
#rightstack{animation:rise .5s var(--ease) both .24s}
.ghost{opacity:0 !important;pointer-events:none}
#glass{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#000;
       animation:bootin .5s var(--ease) both}
#glass video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             opacity:0;transition:opacity .4s var(--ease)}
#glass video.live{opacity:1}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
   linear-gradient(to right, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to right, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px)),
   linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(244,242,237,.45) 33.33%, transparent calc(33.33% + .5px)),
   linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(244,242,237,.45) 66.66%, transparent calc(66.66% + .5px))}
body.f-off #grid,body.f-rf #grid,body.f-cross #grid{display:none}
#cross{position:absolute;left:50%;top:50%;width:16px;height:16px;
       translate:-50% -50%;display:none;pointer-events:none}
body.f-cross #cross{display:block}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(244,242,237,.8)}
#cross::before{left:0;right:0;top:50%;height:1px}
#cross::after{top:0;bottom:0;left:50%;width:1px}
#evrow{position:absolute;left:10px;top:50%;translate:0 -50%;height:min(58%,300px);
  width:34px;display:grid;justify-items:center;touch-action:none;z-index:2}
#evrow .track{position:relative;width:1px;height:100%;background:var(--hair)}
#evrow .tick{position:absolute;top:50%;left:-3px;height:1px;width:7px;
  background:var(--mute);opacity:.6}
#evrow .fill{position:absolute;left:0;width:1px;background:var(--dot)}
#evrow .thumb{position:absolute;left:50%;top:50%;width:12px;height:12px;
  border-radius:50%;background:var(--w);translate:-50% -50%;
  transition:translate .18s var(--ease)}
#evrow .val{position:absolute;left:14px;top:50%;translate:0 -50%;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;
  color:var(--dot);opacity:0;transition:opacity .22s var(--ease)}
#evrow.live .val{opacity:1}
@media(prefers-reduced-motion:reduce){#evrow .thumb,#evrow .val{transition:none}}
#rf{position:absolute;inset:0;pointer-events:none;display:none}
body.f-rf #rf{display:block}
#rf i{position:absolute;width:18px;height:18px;border:0 solid rgba(244,242,237,.8)}
#rf i:nth-child(1){left:7%;top:7%;border-left-width:2px;border-top-width:2px}
#rf i:nth-child(2){right:7%;top:7%;border-right-width:2px;border-top-width:2px}
#rf i:nth-child(3){left:7%;bottom:7%;border-left-width:2px;border-bottom-width:2px}
#rf i:nth-child(4){right:7%;bottom:7%;border-right-width:2px;border-bottom-width:2px}
#rf b{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:5/3;
      translate:-50% -50%;border:1px solid rgba(59,130,246,.75)}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .1s}
#denied{position:absolute;inset:0;display:none;place-items:center;
        font-size:13px;color:var(--mute);text-align:center;padding:40px}
.deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
      padding:18px 34px calc(22px + env(safe-area-inset-bottom));position:relative}
.deck::before{content:"";position:absolute;pointer-events:none;
      inset:6px 16px calc(env(safe-area-inset-bottom) + 10px);
      border:1px solid var(--hair);border-radius:16px}
#chips{display:flex;gap:10px;align-items:center;justify-self:start}
#rightstack{justify-self:end;display:flex;flex-direction:column;gap:10px;align-items:center}
#shutterwrap{justify-self:center}
#chip{width:46px;height:46px;border-radius:5px;border:1px solid var(--hair);
      overflow:hidden;position:relative;display:grid;place-items:center;flex:0 0 auto}
#chip img{width:100%;height:100%;object-fit:cover;display:block;
          transition:opacity .22s var(--ease)}
#chip,#tray,#strip button,#traymenu button{transition:transform .22s var(--ease)}
#chip:active,#tray:active,#strip button:active,#traymenu button:active{
  transform:scale(.94);transition-duration:.07s}
#back:active,#traybar:active{opacity:.55}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes chipin{from{opacity:0;transform:scale(.9)}}
#tray{width:46px;height:46px;border-radius:5px;border:1px solid var(--hair);
      display:grid;place-items:center;flex:0 0 auto;position:relative;overflow:hidden;
      animation:chipin .24s var(--ease)}
#tray img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tray img.step{animation:stepup 2.4s var(--ease) both}
#tray .scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
#tray .dot{position:relative}
#tray .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#traymenu{position:fixed;display:none;flex-direction:column;gap:6px;z-index:12;
  background-color:var(--k);background-image:var(--grain);
  border:1px solid var(--hair);border-radius:14px;
  padding:8px;left:24px;bottom:calc(env(safe-area-inset-bottom) + 106px);
  max-height:52vh;overflow-y:auto}
#traymenu button{width:180px;height:180px;border-radius:12px;overflow:hidden;
  border:1px solid var(--hair);display:grid;place-items:center;position:relative}
@keyframes stepup{
  from{opacity:0;filter:brightness(1.65) contrast(.55) saturate(.85)}
  55%{opacity:1}
  to{opacity:1;filter:none}}
#traymenu img{animation:stepup 3.2s var(--ease) both}
#traymenu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#traymenu .scrim{position:absolute;inset:0;background:rgba(10,10,10,.45)}
#traymenu .dot{position:relative}
#traymenu .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#shutterwrap{position:relative;flex:0 0 auto}
#shutter{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--w);
         display:grid;place-items:center}
#shutter i{width:64px;height:64px;border-radius:50%;background:var(--w);
           display:block;transition:transform .22s var(--ease)}
#shutter:active i, #shutter.pressed i{transform:scale(.88);transition-duration:.07s}
/* a real, invisible native switch rides the shutter: the finger's own tap
   toggles it, so iOS plays the Taptic tick — no script, nothing to patch */
#hap{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
     clip-path:circle(50%);-webkit-appearance:auto}
.lensbtn{position:relative;width:46px;height:46px;flex:0 0 auto;border-radius:50%;
  transition:opacity .3s var(--ease);
  border:1px solid var(--hair);color:var(--mute);
  font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.05em}
.lensbtn:active{color:var(--w);border-color:var(--mute)}
#lensmenu{position:fixed;display:none;flex-direction:column;gap:2px;z-index:12;
  background-color:var(--k);background-image:var(--grain);
  border:1px solid var(--hair);border-radius:14px;
  padding:8px 4px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 106px)}

#lensmenu button{font-family:ui-monospace,Menlo,monospace;font-size:12px;
  letter-spacing:.05em;color:var(--mute);padding:8px 18px;border-radius:8px;
  position:relative}
.hapov{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;
       -webkit-appearance:auto}
#lensmenu button.cur{color:var(--dot)}
#lensmenu button:disabled{opacity:.25}
#lensveil{position:fixed;inset:0;display:none;z-index:11}
#lensveil.on{display:block}
#lensmenu,#traymenu{display:flex;opacity:0;pointer-events:none;
  transform:translateY(8px) scale(.97);
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
#lensmenu.on,#traymenu.on{opacity:1;pointer-events:auto;transform:none}

/* ---------- landscape: 5:4 horizontal format, controls on the right ---------- */
@media (orientation: landscape){
  .top{position:absolute;top:calc(4px + env(safe-area-inset-top));left:0;right:0;
       z-index:3;padding:8px 0}
  #frame{padding:calc(12px + env(safe-area-inset-top)) 104px 8px
                 calc(6px + env(safe-area-inset-left))}
  body.flip #frame{padding:calc(12px + env(safe-area-inset-top))
                   calc(6px + env(safe-area-inset-right)) 8px 104px}
  #glass{width:auto;height:100%;aspect-ratio:5/4}
  .deck{position:absolute;top:0;bottom:0;display:flex;
        right:calc(env(safe-area-inset-right));width:100px;
        flex-direction:column;justify-content:center;gap:20px;padding:0}
  .deck::before{inset:auto 6px auto 6px;top:50%;translate:0 -50%;height:372px}
  body.flip .deck{right:auto;left:calc(env(safe-area-inset-left))}
  #shutterwrap{order:1}
  #shutter{width:70px;height:70px}
  #shutter i{width:57px;height:57px}
  #chips{order:2;flex-direction:column}
  .spacer{display:none}
  #lensmenu{right:calc(env(safe-area-inset-right) + 122px);bottom:auto;
            top:50%;translate:0 -50%}
  #traymenu{left:auto;right:calc(env(safe-area-inset-right) + 122px);
            bottom:auto;top:50%;translate:0 -50%}
  body.flip #lensmenu,body.flip #traymenu{
            right:auto;left:calc(env(safe-area-inset-left) + 122px)}
}

/* ---------- print ---------- */
#print{position:fixed;inset:0;background:var(--k);background-image:var(--grain);
       display:flex;flex-direction:column;
       z-index:10;padding-top:env(safe-area-inset-top);
       opacity:0;pointer-events:none;transform:scale(.985);
       transition:opacity .26s var(--ease),transform .26s var(--ease)}
#print.on{opacity:1;pointer-events:auto;transform:none}
#print .bar{display:flex;align-items:center;padding:12px 18px}
#back{width:34px;height:34px;position:relative}
#back::before{content:"";position:absolute;left:11px;top:9px;width:12px;height:12px;
  border-left:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);
  transform:rotate(45deg)}
.barx{margin-left:auto;display:flex;gap:6px;align-items:center}
#traybar{width:34px;height:34px;position:relative;display:none;place-items:center}
#traybar.on{display:grid}
#traybar .dot{width:7px;height:7px}
#traybar .dot.brew{animation:breathe 1.6s ease-in-out infinite}
#stage{flex:1;position:relative;min-height:0;margin:0 16px}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           -webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;
           opacity:0;transition:opacity .22s var(--ease),transform .3s var(--ease)}
#stage img.in{opacity:1}
@keyframes comeup{from{opacity:0;filter:brightness(1.8) contrast(.4)}to{opacity:1;filter:none}}
#stage img.fresh{animation:comeup 1.2s ease-out both}
@media(prefers-reduced-motion:reduce){#stage img.fresh{animation:none}}
#print .foot{position:absolute;left:0;right:0;bottom:0;display:flex;
             justify-content:center;pointer-events:none;
             padding:12px 0 calc(14px + env(safe-area-inset-bottom));
             background:linear-gradient(transparent, rgba(10,10,10,.55))}
#strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:0 22px;
       -webkit-overflow-scrolling:touch;pointer-events:auto}
#strip button{flex:0 0 auto;width:44px;height:44px;border-radius:5px;overflow:hidden;
              border:1px solid transparent}

#strip img{width:100%;height:100%;object-fit:cover;display:block}
@media (orientation: landscape){
  #print{padding-top:0}
  #print .bar{position:absolute;top:0;left:0;right:0;z-index:2;
              padding:calc(6px + env(safe-area-inset-top)) 14px 6px}
}

@media(prefers-reduced-motion:reduce){
  #print,#stage img,#lensmenu,#traymenu,#tray,#chips,#shutterwrap,#rightstack,
  #chip,#strip button,#traymenu button,#traymenu img,#tray img{
    transition:none;animation:none}
  body.rot #camera,body.rot #print{transform:none !important}
</style>
</head>
<body>

<div id="camera">
  <div class="top"><span class="dot"></span></div>
  <div id="frame">
    <div id="glass">
      <video id="video" autoplay playsinline muted></video>
      <div id="grid"></div>
      <div id="rf"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="cross"></div>
      <div id="evrow"><div class="track"><i class="tick"></i><i class="fill"></i><i class="thumb"></i><span class="val"></span></div></div>
      <div id="flash"></div>
      <div id="denied">Allow camera access in Settings › Safari.</div>
    </div>
  </div>
  <div class="deck">
    <div id="chips">

    <span id="rightstack"><button id="finder" class="lensbtn" aria-label="Finder"></button><button id="lens" class="lensbtn" aria-label="Lens">33mm</button></span>
  </div>
</div>

<div id="lensveil"></div>
<div id="lensmenu"></div>
<div id="traymenu"></div>


<div id="print">
  <div class="bar"><button id="back" aria-label="Close"></button><span class="barx"><button id="traybar" aria-label="Developing"><span class="dot"></span></button></span></div>
  <div id="stage"></div>
  <div class="foot">
    <div id="strip"></div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const MAX_NEG = 2200;
const aspect = () => matchMedia("(orientation: landscape)").matches ? 5/4 : 4/5;
const calmMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- store ---------- */
const DB = await new Promise((res, rej) => {
  const q = indexedDB.open("emulsify-one", 3);
  q.onupgradeneeded = () => {
    const db = q.result;
    if (!db.objectStoreNames.contains("prints")) db.createObjectStore("prints");
    if (!db.objectStoreNames.contains("thumbs")) db.createObjectStore("thumbs");
    if (!db.objectStoreNames.contains("negs"))   db.createObjectStore("negs");
  };
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
});
const put = (s, k, v) => new Promise((res, rej) => {
  try {
    if (!DB.objectStoreNames.contains(s)) return res();   // store missing: skip
    const t = DB.transaction(s, "readwrite");
    t.objectStore(s).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error);
  } catch (e) { res(); }                                   // archival never blocks
});
const get = (s, k) => new Promise((res, rej) => {
  const r = DB.transaction(s).objectStore(s).get(k);
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
/* prints listing skips easel side-records (keys with ":") */
const allKeys = () => new Promise((res, rej) => {
  const r = DB.transaction("prints").objectStore("prints").getAllKeys();
  r.onsuccess = () => res(r.result.filter(k => !String(k).includes(":")).sort());
  r.onerror = () => rej(r.error);
});
let prints = await allKeys();
let pending = 0;
const cooking = new Set();          /* ids mid-develop right now */
const cookThumbs = new Map();       /* id -> latent-negative data URL */
const unchosen = new Set();         /* vestigial: always empty since v2.3 */
async function scanTray() {
  const raw = await new Promise((res, rej) => {
    const r = DB.transaction("prints").objectStore("prints").getAllKeys();
    r.onsuccess = () => res(r.result.map(String)); r.onerror = () => rej(r.error);
  });
  unchosen.clear();          /* nothing waits on a person any more */
}
await scanTray();

const urls = new Set();
const mkURL = b => { const u = URL.createObjectURL(b); urls.add(u); return u; };
const revokeAll = () => { for (const u of urls) URL.revokeObjectURL(u); urls.clear(); };

async function makeThumb(blob) {
  const bmp = await createImageBitmap(blob);
  const s = 220 / Math.max(bmp.width, bmp.height);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  const t = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  c.width = c.height = 0;
  return t;
}
const printURLs = new Map();          /* full prints, LRU of 8 object URLs */
async function printURL(id) {
  if (printURLs.has(id)) {
    const u = printURLs.get(id); printURLs.delete(id); printURLs.set(id, u);
    return u;
  }
  const b = await get("prints", id); if (!b) return null;
  const u = URL.createObjectURL(b); printURLs.set(id, u);
  if (printURLs.size > 8) {
    const [k0, u0] = printURLs.entries().next().value;
    URL.revokeObjectURL(u0); printURLs.delete(k0);
  }
  return u;
}
const dropPrintURL = id => { const u = printURLs.get(id);
  if (u) { URL.revokeObjectURL(u); printURLs.delete(id); } };
const thumbURLs = new Map();
async function thumbURL(id) {
  if (thumbURLs.has(id)) return thumbURLs.get(id);
  const t = await thumbOf(id); if (!t) return null;
  const u = URL.createObjectURL(t); thumbURLs.set(id, u); return u;
}
const dropThumbURL = id => { const u = thumbURLs.get(id);
  if (u) { URL.revokeObjectURL(u); thumbURLs.delete(id); } };
async function thumbOf(id) {
  let t = await get("thumbs", id);
  if (!t) { const p = await get("prints", id);
    if (!p) return null; t = await makeThumb(p); await put("thumbs", id, t); }
  return t;
}
const revealSeen = new Set();   // circuit breaker: one reveal per frame per session

/* ---------- lab ---------- */
const worker = new Worker("lab-worker.js?v=22");
let msgId = 0; const waits = new Map();
const jobFrame = new Map();
worker.onmessage = e => {
  const { id, ok, result, secs, error, ready } = e.data;
  if (ready !== undefined || e.data.progress) return;
  if (e.data.stage) {                 /* the bath, live: the negative forms */
    const f = jobFrame.get(id);
    if (f && cooking.has(f) && e.data.stage === "neg") {
      cookThumbs.set(f, "data:image/jpeg;base64," + e.data.b64);
      try { put("prints", f + ":neg", e.data.b64); } catch (err) {}
      paintTray();
    }
    return;
  }
  const w = waits.get(id); if (!w) return; waits.delete(id);
  jobFrame.delete(id);
  ok ? w.res({ jpg: result, secs }) : w.rej(new Error(error));
};
const labDevelop = (buf, seed, fid) => {
  const id = ++msgId;
  return new Promise((res, rej) => {
    waits.set(id, { res, rej });
    if (fid) jobFrame.set(id, fid);
    worker.postMessage({ id, neg: buf, profile: "honey", seed: seed, ev: EV.v });
  });
};
const _labBake_unused = (buf, w, t, secs) => {
  const id = ++msgId;
  return new Promise((res, rej) => {
    waits.set(id, { res, rej });
    worker.postMessage({ id, bake: true, jpg: buf, w: w, t: t, secs: secs });
  });
};

/* ---------- camera: multi-lens, no rotation handling by design ---------- */
let stream = null, restarting = false;
async function startCamera(deviceId) {
  if (restarting) return; restarting = true;
  try {
    stream?.getTracks().forEach(t => t.stop());
    $("video").srcObject = null;
    const video = deviceId
      ? { deviceId: { exact: deviceId },
          width: { ideal: 4032 }, height: { ideal: 3024 } }
      : { facingMode: "environment",
          width: { ideal: 4032 }, height: { ideal: 3024 } };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    $("video").srcObject = stream;
    $("denied").style.display = "none";
    lensView();
    discoverLenses();
  } catch { $("denied").style.display = "grid"; }
  restarting = false;
}
/* GLASS — the ladder, named at the ends. WIDE is the ultra's true eye
   (13e, uncropped); 22–55 are elevens realized from the longest glass at or
   below them; the ladder tops at 44 — past it the crops thin (diminishing
   that still fills the negative). Tap the badge: menu. */
const tickBadge = el => el.insertAdjacentHTML("beforeend",
  '<input type="checkbox" switch class="hapov" tabindex="-1" aria-hidden="true">');
const LADDER = [
  { k: "WIDE", F: 13 }, { k: "22mm", F: 22 }, { k: "33mm", F: 33 },
  { k: "44mm", F: 44 }        /* the ladder tops at 44: past it, crops thin */
];
const labelOf = F => (LADDER.find(l => l.F === F) || { k: F + "mm" }).k;
let phys = [];                        /* [{id, e}] native 35mm-e per camera */
const GLASS = { mm: 33, id: null, crop: 1 };
tickBadge($("lens"));                 /* visible from frame one, live on discovery */
function realize(F) {
  let c = null;
  for (const p of phys) if (p.e <= F) c = p;
  return c ? { id: c.id, crop: F / c.e } : null;
}
function lensView() {                 /* WYSIWYG: the glass shows the crop */
  $("video").style.transform = GLASS.crop > 1.001 ? "scale(" + GLASS.crop + ")" : "none";
}
function setGlass(F) {
  const r = realize(F);
  if (!r) return;
  const sameDev = r.id === GLASS.id;
  if (!sameDev && restarting) return;
  GLASS.mm = F; GLASS.id = r.id; GLASS.crop = r.crop;
  $("lens").textContent = labelOf(F);
  tickBadge($("lens"));
  lensView();
  paintLensMenu();
  if (!sameDev) startCamera(r.id);    /* crops on the same glass are instant */
}
async function discoverLenses() {
  if (phys.length) return;
  const devs = await navigator.mediaDevices.enumerateDevices();
  const back = devs.filter(d => d.kind === "videoinput" &&
                                !/front|user/i.test(d.label));
  const E = l => /ultra/i.test(l) ? 13 : /tele/i.test(l) ? 77 : 26;
  const seen = new Set();
  phys = back.map(d => ({ id: d.deviceId, e: E(d.label) }))
             .sort((a, b) => a.e - b.e)
             .filter(q => !seen.has(q.e) && seen.add(q.e));
  if (!phys.length) return;
  const r = realize(GLASS.mm) || realize(33);
  if (!r) return;
  GLASS.id = r.id; GLASS.crop = r.crop;
  $("lens").textContent = labelOf(GLASS.mm);
  tickBadge($("lens"));
  lensView();
  paintLensMenu();
}
function paintLensMenu() {
  const m = $("lensmenu"); m.innerHTML = "";
  for (const { k, F } of LADDER) {
    const b = document.createElement("button");
    b.textContent = k;
    if (!realize(F)) b.disabled = true;
    else b.insertAdjacentHTML("beforeend",
      '<input type="checkbox" switch class="hapov" tabindex="-1" aria-hidden="true">');
    if (F === GLASS.mm) b.className = "cur";
    b.onclick = () => { closeLensMenu(); setGlass(F); };
    m.appendChild(b);
  }
}
const closeLensMenu = () => {
  $("lensmenu").classList.remove("on"); $("lensveil").classList.remove("on");
};
$("lens").onclick = () => {
  if (!phys.length) return;
  closeTrayMenu();
  const on = $("lensmenu").classList.toggle("on");
  $("lensveil").classList.toggle("on", on);
};
$("lensveil").onclick = () => { closeLensMenu(); closeTrayMenu(); };

/* ---------- exposure compensation: a real dial into the chemistry ------ */
const EV = { v: 0 };
function setEV(v) {
  v = Math.max(-2, Math.min(2, v));
  v = Math.round(v * 3) / 3;
  if (Math.abs(v) < 0.17) v = 0;                    /* zero detent */
  EV.v = v;
  const t = $("evrow").querySelector(".thumb");
  const f = $("evrow").querySelector(".fill");
  const lab = $("evrow").querySelector(".val");
  const pct = 50 - v / 2 * 50;                 /* up = brighter */
  t.style.top = pct + "%";
  lab.style.top = pct + "%";
  if (v === 0) { f.style.top = "50%"; f.style.height = "0"; }
  else if (v > 0) { f.style.top = pct + "%"; f.style.height = (50 - pct) + "%"; }
  else { f.style.top = "50%"; f.style.height = (pct - 50) + "%"; }
  lab.textContent = (v > 0 ? "+" : "") + v.toFixed(1).replace(/\.0$/, "");
  $("evrow").classList.toggle("live", v !== 0);
  $("video").style.filter = v ? "brightness(" + Math.pow(2, v).toFixed(3) + ")" : "";
  try { localStorage["ev"] = v; } catch (e) {}
}
setEV((() => { try { return parseFloat(localStorage["ev"]) || 0; }
               catch (e) { return 0; } })());
let EVD = null;
function evFromY(y) {
  const r = $("evrow").querySelector(".track").getBoundingClientRect();
  return (0.5 - (y - r.top) / r.height) * 4;
}
$("evrow").addEventListener("pointerdown", e => {
  try { $("evrow").setPointerCapture(e.pointerId); } catch (err) {}
  EVD = true; setEV(evFromY(e.clientY));
});
$("evrow").addEventListener("pointermove", e => { if (EVD) setEV(evFromY(e.clientY)); });
const evEnd = () => { EVD = null; };
$("evrow").addEventListener("pointerup", evEnd);
$("evrow").addEventListener("pointercancel", evEnd);

/* ---------- the finder: GRID -> RF -> OFF (remembered) ---------- */
const FINDERS = ["grid", "rf", "cross", "off"];
function setFinder(m) {
  document.body.classList.remove("f-rf", "f-cross", "f-off");
  if (m === "rf") document.body.classList.add("f-rf");
  if (m === "cross") document.body.classList.add("f-cross");
  if (m === "off") document.body.classList.add("f-off");
  $("finder").textContent =
    m === "grid" ? "GRID" : m === "rf" ? "RF" : m === "cross" ? "CROSS" : "OFF";
  $("finder").insertAdjacentHTML("beforeend",
    '<input type="checkbox" switch class="hapov" tabindex="-1" aria-hidden="true">');
  try { localStorage["finder"] = m; } catch (e) {}
}
setFinder((() => { try { return FINDERS.includes(localStorage["finder"])
  ? localStorage["finder"] : "grid"; } catch (e) { return "grid"; } })());
$("finder").addEventListener("click", () => {
  const cur = (() => { try { return localStorage["finder"] || "grid"; }
                       catch (e) { return "grid"; } })();
  setFinder(FINDERS[(FINDERS.indexOf(cur) + 1) % FINDERS.length]);
});
startCamera();
$("video").addEventListener("loadeddata", () => $("video").classList.add("live"));
const setPaged = b => document.body.classList.toggle("paged", b);
const inpr = document.createElement("div");
inpr.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;" +
  "padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)";
document.body.appendChild(inpr);
function alignDeck() {
  const cs = getComputedStyle(inpr);
  const L = parseFloat(cs.paddingLeft) || 0, Rr = parseFloat(cs.paddingRight) || 0;
  /* island on the right = clockwise turn = grip left: the deck flips */
  document.body.classList.toggle("flip", Rr > L + 1);
}
alignDeck();
let rotT = 0, rotS = 0, lastLand = 90, rotResized = false;
addEventListener("resize", () => {
  if (document.body.classList.contains("rot")) { rotResized = true; alignDeck(); }
});
function onTurn() {
  /* the curtain is a move now: content tips a few degrees toward the turn
     as it fades (.16s), holds through iOS's own choreography (~700ms with
     the feed re-orient), then blooms back over half a second. */
  let a = 0;
  try {
    if (screen.orientation && typeof screen.orientation.angle === "number")
      a = screen.orientation.angle;
    else if (typeof window.orientation === "number")
      a = window.orientation === -90 ? 270 : window.orientation === 90 ? 90 : 0;
  } catch (e) {}
  const hint = a === 90 ? 5 : a === 270 ? -5 : (lastLand === 90 ? -5 : 5);
  if (a === 90 || a === 270) lastLand = a;
  document.documentElement.style.setProperty("--turnhint", hint + "deg");
  alignDeck();
  const si = $("stage").querySelector("img");
  if (si) si.style.transform = "";
  document.body.classList.add("rot");
  document.body.classList.remove("settle");
  rotResized = false;
  clearTimeout(rotT); clearTimeout(rotS);
  const release = () => {
    document.body.classList.remove("rot");
    document.body.classList.add("settle");
    rotS = setTimeout(() => document.body.classList.remove("settle"), 540);
  };
  rotT = setTimeout(() => {           /* wait for the layout to have swapped */
    if (rotResized) release();
    else rotT = setTimeout(release, 320);
  }, 600);
}
matchMedia("(orientation: landscape)").addEventListener("change", onTurn);
addEventListener("orientationchange", onTurn);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible")
    setTimeout(() => startCamera(GLASS.id || undefined), 250);
});

/* ---------- snap feedback ----------
   Haptic: the invisible native switch over the shutter ticks the Taptic
   Engine on the physical tap itself (iOS 17.4+, survives the 26.5 patch);
   navigator.vibrate covers Android. Sound: a synthesized kachunk — curtain
   snap, low thump, claw tick — honest Web Audio, no asset, and it respects
   the mute switch like a real camera. */
let AC = null;
function shutterVoice() {
  /* THE VOICE — chosen on the boards: Honey 70 claw, small gate, Leica wind.
     Deterministic (mulberry32 seed 222): the camera sounds exactly like this,
     every frame, forever. MASTER calibrated in the mirror to peak 0.35. */
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const cold = AC.state === "suspended";
    if (cold) AC.resume();
    let sd = 222 | 0;
    const rnd = () => {
      sd = sd + 0x6D2B79F5 | 0;
      let t = Math.imul(sd ^ sd >>> 15, 1 | sd);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    const t0 = AC.currentTime + (cold ? 0.06 : 0.001);
    const out = AC.createGain(); out.gain.value = 1.013; out.connect(AC.destination);
    const noiseSrc = (dur, p) => {
      const n = Math.max(8, (AC.sampleRate * dur) | 0);
      const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / n, p);
      const s = AC.createBufferSource(); s.buffer = b; return s;
    };
    const bandChain = (lo, hi, dest) => {
      const h = AC.createBiquadFilter(); h.type = "highpass";
      h.frequency.value = lo; h.Q.value = 0.7071;
      const l = AC.createBiquadFilter(); l.type = "lowpass";
      l.frequency.value = hi; l.Q.value = 0.7071;
      h.connect(l); l.connect(dest); return h;
    };
    /* claw: 10 clicks, 1.7 ms apart, 2100-6800 Hz, decay .82 */
    const clawG = AC.createGain(); clawG.gain.value = 0.8; clawG.connect(out);
    const clawIn = bandChain(2100, 6800, clawG);
    let ct = 0, ca = 1;
    for (let i = 0; i < 10; i++) {
      const g = AC.createGain(); g.gain.value = ca; g.connect(clawIn);
      const s = noiseSrc(0.0012, 2.5); s.connect(g); s.start(t0 + ct);
      ct += 0.0017; ca *= 0.82;
    }
    /* gate: 10 ms knock at 21 ms -> LP 950 -> 1.0 ms comb (the box) */
    const gateG = AC.createGain(); gateG.gain.value = 1.3; gateG.connect(out);
    const gl = AC.createBiquadFilter(); gl.type = "lowpass";
    gl.frequency.value = 950; gl.Q.value = 0.7071;
    const dly = AC.createDelay(0.01); dly.delayTime.value = 0.001;
    const cg = AC.createGain(); cg.gain.value = 0.5;
    gl.connect(gateG); gl.connect(dly); dly.connect(cg); cg.connect(gateG);
    const gs = noiseSrc(0.010, 2.0); gs.connect(gl); gs.start(t0 + 0.021);
    /* wind: 14 fine clicks from 55 ms, spacing x1.06, 2000-5000 Hz, decay .90 */
    const windG = AC.createGain(); windG.gain.value = 0.28; windG.connect(out);
    const windIn = bandChain(2000, 5000, windG);
    let wt = 0.055, wa = 1, gap = 0.0012;
    for (let i = 0; i < 14; i++) {
      const g = AC.createGain(); g.gain.value = wa; g.connect(windIn);
      const s = noiseSrc(0.0012, 2.5); s.connect(g); s.start(t0 + wt);
      wt += gap; gap *= 1.06; wa *= 0.90;
    }
  } catch (e) {}
}
const hapEl = $("hap");
hapEl.addEventListener("pointerdown", () => $("shutter").classList.add("pressed"));
const unpress = () => $("shutter").classList.remove("pressed");
hapEl.addEventListener("pointerup", unpress);
hapEl.addEventListener("pointercancel", unpress);

/* shutter: crop the sensor to the exact 4:5 the frame shows (cover-centered)
   The develop never interrupts: the chip carries the news; the easel waits
   inside the print's first opening. */
$("shutterwrap").onclick = async () => {
  const v = $("video");
  if (!v.videoWidth || restarting || pending > 2) return;
  const vw = v.videoWidth, vh = v.videoHeight, A = aspect();
  let cw, ch;
  if (vw / vh > A) { ch = vh; cw = Math.round(vh * A); }
  else { cw = vw; ch = Math.round(vw / A); }
  let sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
  const f = GLASS.crop || 1;
  if (f > 1) {
    const cw2 = Math.round(cw / f), ch2 = Math.round(ch / f);
    sx += Math.round((cw - cw2) / 2); sy += Math.round((ch - ch2) / 2);
    cw = cw2; ch = ch2;
  }
  const s = Math.min(1, MAX_NEG / Math.max(cw, ch));
  const c = document.createElement("canvas");
  c.width = Math.round(cw * s); c.height = Math.round(ch * s);
  c.getContext("2d").drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  const id = String(Date.now());
  const seed = (Number(id) % 9000) + 1;
  try {                       /* latent image: the tray's face while it cooks */
    const tc = document.createElement("canvas");
    const ts = 120 / Math.max(c.width, c.height);
    tc.width = Math.round(c.width * ts); tc.height = Math.round(c.height * ts);
    tc.getContext("2d").drawImage(c, 0, 0, tc.width, tc.height);
    cookThumbs.set(id, tc.toDataURL("image/jpeg", 0.7));
    tc.width = tc.height = 0;
  } catch (e) {}
  closeLensMenu(); closeTrayMenu();
  $("flash").style.opacity = 1;
  setTimeout(() => $("flash").style.opacity = 0, 110);
  shutterVoice();
  try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.93));
  c.width = c.height = 0;
  pending++; cooking.add(id); paintChip(); paintTray();
  try {
    const { jpg, secs } = await labDevelop(await blob.arrayBuffer(), seed, id);
    try { localStorage["t" + id] = secs || ""; } catch (e) {}
    const printBlob = new Blob([jpg], { type: "image/jpeg" });
    await put("prints", id, printBlob);          // balanced in the lab: final
    await put("thumbs", id, await makeThumb(printBlob));
    prints.push(id);
  } catch (e) { console.error(e); flagError(); }
  cooking.delete(id); cookThumbs.delete(id);
  pending--; paintChip(); paintTray();
};
function flagError() {
  const chip = $("chip");
  chip.style.borderColor = "#7c2d12";
  setTimeout(() => chip.style.borderColor = "", 2500);
}

/* ---------- chip (finished gallery) + tray (the drying line) ---------- */
const newestProcessed = () =>
  [...prints].reverse().find(k => !unchosen.has(k));
async function paintChip() {
  const chip = $("chip");
  const last = newestProcessed();
  const u = last ? await thumbURL(last) : null;
  let im = chip.querySelector("img");
  if (!u) { chip.innerHTML = ""; return; }
  if (!im) { im = document.createElement("img"); chip.appendChild(im); }
  if (im.src !== u) { im.style.opacity = 0;
    im.onload = () => { im.style.opacity = ""; }; im.src = u; }
}
async function paintTray() {
  const busy = pending > 0, any = busy || unchosen.size > 0;
  const t = $("tray");
  t.style.display = any ? "" : "none";     /* nothing to process: one square */
  t.querySelector(".dot").classList.toggle("brew", busy);
  const tb = $("traybar");                 /* the line, reachable from gallery */
  tb.classList.toggle("on", any);
  tb.querySelector(".dot").classList.toggle("brew", busy);
  if (!any) {
    closeTrayMenu();
    t.querySelector("img")?.remove(); t.querySelector(".scrim")?.remove();
    return;
  }
  const items = [...new Set([...cooking, ...unchosen])].sort();
  const newest = items[items.length - 1];
  const u = cooking.has(newest) ? (cookThumbs.get(newest) || null)
                                : await thumbURL(newest);
  let sc = t.querySelector(".scrim");
  const ims = t.querySelectorAll("img");
  const top = ims[ims.length - 1];
  if (u) {
    if (!sc) { sc = document.createElement("i"); sc.className = "scrim";
               t.insertBefore(sc, t.querySelector(".dot")); }
    if (!top || top.src !== u) {     /* a new step comes up in the bath */
      const im = document.createElement("img");
      im.className = "step"; im.src = u;
      t.insertBefore(im, sc);
      setTimeout(() => {
        for (const o of t.querySelectorAll("img")) if (o !== im) o.remove();
      }, 2600);
    }
  } else { for (const o of ims) o.remove(); sc?.remove(); }
  if ($("traymenu").classList.contains("on")) buildTrayMenu();
}
async function buildTrayMenu() {
  const m = $("traymenu");
  const items = [...new Set([...cooking, ...unchosen])].sort().reverse();
  const keep = new Set(items);
  for (const b of [...m.children]) if (!keep.has(b.dataset.id)) b.remove();
  for (let i = 0; i < items.length; i++) {
    const id = items[i];
    let b = m.querySelector('button[data-id="' + id + '"]');
    if (!b) { b = document.createElement("button"); b.dataset.id = id; }
    if (m.children[i] !== b) m.insertBefore(b, m.children[i] || null);
    const cook = cooking.has(id);
    const u = cook ? (cookThumbs.get(id) || null) : await thumbURL(id);
    const img = b.querySelector("img");
    if (u && (!img || img.src !== u)) {     /* only a new step fades in */
      const ni = document.createElement("img"); ni.src = u;
      b.insertBefore(ni, b.firstChild);
      setTimeout(() => {
        for (const o of b.querySelectorAll("img")) if (o !== ni) o.remove();
      }, 3400);
    } else if (!u && img) img.remove();
    let sc = b.querySelector(".scrim"), dd = b.querySelector(".dot");
    if (cook) {
      if (!sc) b.insertAdjacentHTML("beforeend", '<i class="scrim"></i>');
      if (!dd) b.insertAdjacentHTML("beforeend", '<span class="dot brew"></span>');
      b.onclick = null;
    } else {
      if (sc) sc.remove();
      if (dd) dd.remove();
      b.onclick = () => { closeTrayMenu(); openPrint(id); };  /* continue it */
    }
  }
}
const closeTrayMenu = () => { $("traymenu").classList.remove("on");
  if (!$("lensmenu").classList.contains("on")) $("lensveil").classList.remove("on"); };
function toggleTrayMenu() {
  closeLensMenu();
  const on = $("traymenu").classList.toggle("on");
  $("lensveil").classList.toggle("on", on);
  if (on) buildTrayMenu();
}
$("tray").onclick = toggleTrayMenu;
$("traybar").onclick = toggleTrayMenu;
paintChip(); paintTray();
$("chip").onclick = () => { const k = newestProcessed(); if (k) openPrint(k); };

/* ---------- print view; long-press the print itself to save ---------- */
let current = null, armedFile = null;
async function openPrint(id) {
  current = id;
  const stage = $("stage"); stage.innerHTML = "";
  const u = await printURL(id);
  if (!u) return;
  try {                                   /* arm the print for hold-to-save */
    const blob = await get("prints", id);
    const secs = localStorage["t" + id] || "";
    armedFile = new File([blob],
      "EMULSIFY-222" + (secs ? "-" + secs + "s" : "") + "-" + id.slice(-4) + ".jpg",
      { type: "image/jpeg" });
  } catch (e) { armedFile = null; }
  let negD = null;
  try { negD = await get("prints", id + ":neg"); } catch (e) {}
  if (negD && !calmMotion) {           /* first open: the print develops in */
    const nimg = document.createElement("img");
    nimg.src = "data:image/jpeg;base64," + negD;
    nimg.className = "in";
    nimg.style.transform = "scale(.94)";
    stage.appendChild(nimg);
    const fimg = document.createElement("img");
    fimg.src = u;
    fimg.style.transition = "opacity 1.5s var(--ease), transform 1.5s var(--ease)";
    fimg.style.transform = "scale(.94)";
    stage.appendChild(fimg);
    requestAnimationFrame(() => { nimg.style.transform = ""; });
    setTimeout(() => { fimg.classList.add("in"); fimg.style.transform = ""; }, 700);
    setTimeout(() => { nimg.remove(); }, 2400);
    try { put("prints", id + ":neg", ""); } catch (e) {}
  } else {
    const img = document.createElement("img");
    img.src = u;
    stage.appendChild(img);
    requestAnimationFrame(() => img.classList.add("in"));
    if (negD) { try { put("prints", id + ":neg", ""); } catch (e) {} }
  }

  const strip = $("strip"); strip.innerHTML = "";
  const ids = [...prints].reverse().filter(k => !unchosen.has(k)).slice(0, 40);
  const us = await Promise.all(ids.map(thumbURL));
  ids.forEach((k, i) => {
    if (!us[i]) return;
    const b = document.createElement("button");
    b.dataset.pid = k;
    if (k === id) b.className = "sel";
    const ti = document.createElement("img"); ti.src = us[i];
    b.appendChild(ti); b.onclick = () => openPrint(k);
    strip.appendChild(b);
  });
  $("print").classList.add("on");
  setPaged(true);
}
$("back").onclick = () => { $("print").classList.remove("on"); setPaged(false);
  setTimeout(revokeAll, 220); paintChip(); };
/* navigation is the strip: tap a thumb below; hold the print to save */
let HOLD = null;
$("stage").addEventListener("pointerdown", e => {
  HOLD = { t: performance.now(), x: e.clientX, y: e.clientY, moved: false };
});
$("stage").addEventListener("pointermove", e => {
  if (HOLD && Math.hypot(e.clientX - HOLD.x, e.clientY - HOLD.y) > 10)
    HOLD.moved = true;
});
$("stage").addEventListener("pointercancel", () => { HOLD = null; });
$("stage").addEventListener("pointerup", () => {
  const h = HOLD; HOLD = null;
  if (!h || h.moved || performance.now() - h.t < 550) return;
  if (armedFile && navigator.canShare &&
      navigator.canShare({ files: [armedFile] })) {
    navigator.share({ files: [armedFile] }).catch(() => {});
  }
});
</script>
