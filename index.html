<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>EMULSIFY</title>
<style>
/* b213 BARE BONES. One camera, one shutter, one bath, one print. Everything the
   page used to carry - the instruments, the sounds, the haptics, the curtains,
   the roll rituals, the lens ladder, the speed ladder, the contact sheet, the
   share card, the gold - is gone. What remains is the part that makes a
   photograph: capture a negative, hand it to the lab, show the print, save it.
   The lab (lab-worker.js) and the canon are untouched. */
:root { --bg:#0a0a0a; --ink:#e6e2da; --mute:#7a7d82; --line:#1e2024; --warn:#e0a050; --ok:#8fb996; --ui:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:500 12px/1.3 var(--ui); letter-spacing:.06em; overflow:hidden; overscroll-behavior:none; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; letter-spacing:inherit; }
.screen { position:fixed; inset:0; display:none; flex-direction:column; }
.screen.on { display:flex; }

/* the camera */
#cam { padding-top:env(safe-area-inset-top); }
#top { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; color:var(--mute); text-transform:uppercase; }
#top b { font-weight:500; color:var(--ink); }
#state.busy { color:var(--warn); }
#state.dead { color:#d0605a; }
#gate { flex:1; position:relative; min-height:0; margin:0 16px; display:flex; align-items:center; justify-content:center; }
/* --sq is the anamorphic squeeze (1 = spherical). The gate widens by it and
   the frame is stretched to fill, so the finder shows the framing the PRINT
   will have once the lab desqueezes it. */
:root { --sq:1; --zw:1; --zh:1; }
#finder { position:relative; width:100%; aspect-ratio:calc(4 * var(--sq)) / 5; max-height:100%; overflow:hidden; background:#000; }
/* b222 THE FINDER SHOWS THE NEGATIVE. capture() cuts the centre 4:5 (5:4 turned)
   of the frame, then the centre 1/crop of that for the 22 and the 33. Until b221
   the finder showed the whole frame, so the print was the middle 79% of what
   was framed at 33. Now the video element is sized (--zw, --zh from fitFinder)
   so that exactly the negative's window fills the gate and the gate clips the
   rest. No transform: iOS drops a transformed video layer black (b218). The
   squeeze is object-fit:fill - the gate is --sq wider than the negative and the
   frame is stretched to it; the latent shown in the bath is the negative itself. */
#video { position:absolute; left:calc(50% - 50% * var(--zw)); top:calc(50% - 50% * var(--zh)); width:calc(100% * var(--zw)); height:calc(100% * var(--zh)); object-fit:fill; }
#bath img { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
#finder::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); pointer-events:none; }
#bath { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#000; color:var(--warn); text-transform:uppercase; }
#bath.on { display:flex; }
#bath img { filter:blur(14px) saturate(.5) brightness(.55); }
#bath span { position:relative; }
/* THE FOOT. Strip on the left, then lens, shutter, menu on the right: the
   portrait row. Landscape is this same row turned WITH THE PHONE - see the
   landscape block - so the shutter is wherever the rotation carried it. */
#foot { height:calc(112px + env(safe-area-inset-bottom)); padding:0 16px env(safe-area-inset-bottom); display:flex; align-items:center; }
#tray { display:flex; flex:1; min-width:0; height:56px; align-items:center; }
#strip { display:flex; gap:6px; overflow-x:auto; flex:1; min-width:0; height:56px; align-items:center; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
#strip::-webkit-scrollbar { display:none; }
#strip img { height:56px; width:auto; flex:0 0 auto; border-radius:2px; opacity:.9; }
#lens { width:44px; height:44px; border-radius:50%; margin-left:12px; flex:0 0 auto; border:1px solid var(--mute); color:var(--ink); font-size:11px; letter-spacing:.02em; }
#lens.ana::after { content:"A"; position:absolute; margin:-16px 0 0 20px; font-size:8px; color:var(--warn); }
#shutter { width:72px; height:72px; border-radius:50%; margin-left:16px; border:3px solid var(--ink); background:radial-gradient(circle,#dcd8d0 0 58%,transparent 60%); flex:0 0 auto; transition:transform .12s; }
#shutter:active { transform:scale(.92); }
#shutter:disabled { opacity:.35; }
#menu { width:44px; height:44px; color:var(--mute); font-size:18px; margin-left:8px; flex:0 0 auto; }

/* the print */
#print { background:#000; }
#pbar { height:calc(44px + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 12px 0 12px; display:flex; align-items:center; gap:14px; color:var(--mute); text-transform:uppercase; }
#back { width:44px; height:44px; font-size:20px; color:var(--ink); }
#pstage { flex:1; position:relative; min-height:0; margin:0 16px calc(24px + env(safe-area-inset-bottom)); }
#pimg { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; -webkit-touch-callout:none; user-select:none; }
#phint { position:absolute; left:0; right:0; bottom:-20px; text-align:center; color:var(--mute); text-transform:uppercase; font-size:10px; }

/* the panel */
#panel { position:fixed; inset:0; display:none; flex-direction:column; justify-content:flex-end; background:rgba(0,0,0,.72); }
#panel.on { display:flex; }
#panel .sheet { background:#121316; border-top:1px solid var(--line); padding:8px 0 calc(12px + env(safe-area-inset-bottom)); }
#panel button { display:block; width:100%; text-align:left; padding:16px 24px; text-transform:uppercase; border-bottom:1px solid var(--line); }
#panel button:last-child { border-bottom:0; color:var(--mute); }
#panel button.warn { color:var(--warn); }
#panel button.ok { color:var(--ok); }
#log { display:none; position:fixed; inset:0; background:#000; color:var(--ink); padding:calc(16px + env(safe-area-inset-top)) 16px 16px; font:11px/1.4 ui-monospace,Menlo,monospace; letter-spacing:0; white-space:pre-wrap; overflow:auto; }
#log.on { display:block; }
#flash { position:fixed; left:50%; top:calc(56px + env(safe-area-inset-top)); transform:translateX(-50%); background:#1a1c20; border:1px solid var(--line); padding:8px 14px; text-transform:uppercase; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
#flash.on { opacity:1; }

/* LANDSCAPE. The phone turned counter-clockwise (island on the left) carries the
   bottom edge to the RIGHT edge, running bottom-to-top: so the foot is a column on
   the right, strip at the bottom, then lens, shutter, menu at the top - the
   portrait row seen through the rotation, every margin kept. Turned clockwise
   (island on the right: html.landr) the bottom edge lands on the LEFT edge,
   top-to-bottom, and the whole thing mirrors. The top bar becomes the opposite
   column, reading top-to-bottom because it is text. */
@media (orientation:landscape) {
  #cam { flex-direction:row; padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  #top { height:auto; width:92px; flex:0 0 auto; flex-direction:column; justify-content:center; align-items:flex-start; gap:12px; padding:0 6px 0 12px; font-size:10px; }
  #top span { white-space:normal; line-height:1.35; }
  #gate { margin:16px 0; }
  #finder { aspect-ratio:calc(5 * var(--sq)) / 4; width:auto; height:100%; max-width:100%; }
  #foot { height:auto; width:112px; flex:0 0 auto; flex-direction:column-reverse; justify-content:flex-start; align-items:center; padding:16px 0 16px 0; }
  #tray { flex:1; min-height:0; height:auto; width:56px; flex-direction:column-reverse; align-items:center; }
  #strip { flex:1; min-height:0; height:auto; width:56px; flex-direction:column-reverse; overflow-y:auto; overflow-x:hidden; }
  #strip img { width:56px; height:auto; }
  #lens { margin:0 0 12px 0; }
  #shutter { margin:0 0 16px 0; }
  #menu { margin:0 0 8px 0; }
  html.landr #cam { flex-direction:row-reverse; }
  html.landr #foot, html.landr #tray, html.landr #strip { flex-direction:column; }
  html.landr #lens { margin:12px 0 0 0; }
  html.landr #shutter { margin:16px 0 0 0; }
  html.landr #menu { margin:8px 0 0 0; }
  #print { flex-direction:row; padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  html.landr #print { flex-direction:row-reverse; }
  #pbar { height:auto; width:92px; flex:0 0 auto; flex-direction:column; justify-content:center; align-items:flex-start; gap:12px; padding:0 6px 0 8px; font-size:10px; }
  #pbar span { white-space:normal; line-height:1.35; }
  #pstage { margin:16px 12px 16px 0; }
  html.landr #pstage { margin:16px 0 16px 12px; }
  #phint { display:none; }
}
</style>
</head>
<body>

<div id="cam" class="screen on">
  <div id="top"><span id="rf">A 01</span><span id="state">LAB LOADING</span><span id="ver"></span></div>
  <div id="gate"><div id="finder">
    <video id="video" autoplay playsinline muted></video>
    <div id="bath"><img id="latent" alt=""><span id="bathtext">DEVELOPING</span></div>
  </div></div>
  <div id="foot"><div id="tray"><div id="strip"></div><button id="lens" aria-label="Lens">33</button></div><button id="shutter" aria-label="Shutter" disabled></button><button id="menu" aria-label="Menu">&#9776;</button></div>
</div>

<div id="print" class="screen">
  <div id="pbar"><button id="back" aria-label="Back">&#8592;</button><span id="pcode"></span></div>
  <div id="pstage"><img id="pimg" alt=""><div id="phint">hold to save</div></div>
</div>

<div id="panel"><div class="sheet">
  <button id="psize">PRINT SIZE 1100</button>
  <button id="pana">ANAMORPHIC 1.33 OFF</button>
  <button id="pupdate">CHECK FOR UPDATES</button>
  <button id="prestart">RESTART LAB</button>
  <button id="plog">LAB LOG</button>
  <button id="pclose">CLOSE</button>
</div></div>
<div id="log"></div>
<div id="flash"></div>

<script type="module">
const BUILD = 222;
const $ = id => document.getElementById(id);

/* ---------- state, declared before anything reads it ---------- */
const SIZES = [1100, 950, 800];
const MAX_NEG = 2200;           /* long edge of the negative handed to the lab */
/* THE GLASS. WIDE is the ultra-wide's own eye; the numbers are realised from the
   longest physical camera at or under them, cropped for the rest (33 on a 26mm
   main is a 1.27x centre crop). Which cameras exist is only known once the
   first stream is up and the labels can be read. */
const LENSES = [{ label: "WIDE", mm: 13 }, { label: "22", mm: 22 }, { label: "33", mm: 33 }];
let lensIdx = (() => { try { const i = LENSES.findIndex(l => l.label === localStorage.lens); return i < 0 ? 2 : i; } catch (e) { return 2; } })();
let phys = [];                                  /* [{id, e}] back cameras by 35mm-equivalent */
let glass = { id: null, e: 26, crop: 33 / 26, mm: 33 };
const SQUEEZE = 1.33;
let anaOn = (() => { try { return localStorage.ana === "1"; } catch (e) { return false; } })();
let size = (() => { try { const v = parseInt(localStorage.size, 10); return SIZES.includes(v) ? v : 1100; } catch (e) { return 1100; } })();
let frameNo = 0, ROLL = "A";
try { frameNo = parseInt(localStorage.frameNo || "0", 10) || 0; ROLL = localStorage.roll || "A"; } catch (e) {}
let stream = null, worker = null, workerVer = "", labLog = "", labDead = false;
let busy = false, current = null, currentFile = null, hold = null;
const cooking = new Set();      /* frames in the bath right now: recovery must not touch them */
let msgId = 0; const waits = new Map();
let lastCheck = 0, pending = 0;

const flash = (t, ms = 1800) => { const f = $("flash"); f.textContent = t; f.classList.add("on"); clearTimeout(flash.t); flash.t = setTimeout(() => f.classList.remove("on"), ms); };
const setState = (t, cls = "") => { const s = $("state"); s.textContent = t; s.className = cls; };
const paintTop = () => { $("rf").textContent = ROLL + " " + String(frameNo + 1).padStart(2, "0"); $("ver").textContent = "b" + BUILD + (workerVer ? " · w" + workerVer : "") + " · " + size;
  $("lens").textContent = LENSES[lensIdx].label; $("lens").classList.toggle("ana", anaOn);
  document.documentElement.style.setProperty("--sq", anaOn ? SQUEEZE : 1); $("finder").classList.toggle("sq", anaOn); };

/* ---------- the store: same database and stores as every build before, so the
   prints already on the phone are still here ---------- */
const DB = await new Promise((res, rej) => {
  const q = indexedDB.open("emulsify-one", 3);
  q.onupgradeneeded = () => { const db = q.result; for (const s of ["prints", "thumbs", "negs"]) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); };
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
});
const put = (s, k, v) => new Promise((res, rej) => { const t = DB.transaction(s, "readwrite"); t.objectStore(s).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
const get = (s, k) => new Promise((res, rej) => { const r = DB.transaction(s).objectStore(s).get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const del = (s, k) => new Promise(res => { try { const t = DB.transaction(s, "readwrite"); t.objectStore(s).delete(k); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } });
const keys = s => new Promise(res => { try { const r = DB.transaction(s).objectStore(s).getAllKeys(); r.onsuccess = () => res(r.result.map(String).filter(k => !k.includes(":")).sort()); r.onerror = () => res([]); } catch (e) { res([]); } });
let prints = await keys("prints");

/* ---------- the lab ---------- */
function spawnLab() {
  try { worker && worker.terminate(); } catch (e) {}
  workerVer = ""; labDead = false; paintTop();
  worker = new Worker("lab-worker.js?v=" + BUILD);
  worker.onmessage = e => {
    const d = e.data;
    if (d.progress) { setState((d.step ? d.step + "/" + d.steps + " " : "") + String(d.progress).toUpperCase()); return; }
    if (d.ready) { workerVer = d.ver || ""; paintTop(); if (!busy) { setState("READY"); $("shutter").disabled = false; } return; }
    if (d.bootError) { labLog = String(d.bootError); labDead = true; const last = labLog.trim().split("\n").pop(); setState("LAB FAILED: " + last.slice(0, 60), "dead"); return; }
    if (d.stage) { if (d.stage === "neg" && d.b64) { $("latent").src = "data:image/jpeg;base64," + d.b64; } setState("DEVELOPING · " + String(d.stage).toUpperCase(), "busy"); return; }
    const w = waits.get(d.id); if (!w) return; waits.delete(d.id);
    d.ok ? w.res({ jpg: d.result, secs: d.secs }) : w.rej(new Error(d.error));
  };
  worker.onerror = e => { labLog = "LAB ERROR: " + ((e && (e.message || e.filename)) || "script failed to load"); labDead = true; setState("LAB FAILED", "dead"); };
  setState("LAB LOADING"); $("shutter").disabled = true;
}
const develop = (buf, seed, leak, px) => new Promise((res, rej) => {
  const id = ++msgId; waits.set(id, { res, rej });
  setTimeout(() => { const w = waits.get(id); if (w) { waits.delete(id); w.rej(new Error("LAB TIMEOUT")); } }, 180000);
  worker.postMessage({ id, neg: buf, profile: "honey", seed, ev: 0, build: BUILD, ana: anaOn ? SQUEEZE : 1, mm: glass.mm,
                       leak, optic: "", tint: "", tintS: 0, size: px, dc: true }, [buf]);
});

/* ---------- the camera ---------- */
function realize(mm) {                /* the longest glass at or under mm; crop makes up the rest */
  let c = null; for (const p of phys) if (p.e <= mm) c = p;
  if (!c) c = phys[0] || null;
  const e = c ? c.e : 26;
  return { id: c ? c.id : null, e, crop: Math.max(1, mm / e), mm: Math.max(mm, e) };
}
async function discover() {           /* labels are readable only once a stream has been granted */
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const back = devs.filter(d => d.kind === "videoinput" && !/front|user/i.test(d.label));
    const E = l => /ultra/i.test(l) ? 13 : /tele/i.test(l) ? 77 : 26;
    const virt = l => /dual|triple/i.test(l) ? 1 : 0;      /* iOS's auto-switching multi-cams: real lenses first */
    const seen = new Set();
    phys = back.map(d => ({ id: d.deviceId, e: E(d.label || ""), v: virt(d.label || "") }))
               .sort((a, b) => a.e - b.e || a.v - b.v).filter(q => !seen.has(q.e) && seen.add(q.e));
  } catch (e) { phys = []; }
}
async function startCamera() {
  if (stream) return;
  try {
    glass = realize(LENSES[lensIdx].mm);
    const need = Math.min(4032, Math.ceil(MAX_NEG * glass.crop * 1.15 / 16) * 16);
    const video = { width: { ideal: need }, height: { ideal: Math.round(need * 3 / 4) } };
    if (glass.id) video.deviceId = { exact: glass.id }; else video.facingMode = "environment";
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
    const v = $("video"); v.srcObject = stream; v.play && v.play().catch(() => {});
    if (!phys.length) {                 /* first stream: now the cameras can be read, and the lens realised properly */
      await discover();
      const want = realize(LENSES[lensIdx].mm);
      const have = (stream.getVideoTracks()[0].getSettings() || {}).deviceId;
      if (want.id && want.id !== have) { stopCamera(); return startCamera(); }
      glass = want;
    }
    fitFinder();
  } catch (e) { flash("CAMERA: " + String(e && e.name || e).toUpperCase(), 4000); }
}
function stopCamera() { try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {} stream = null; $("video").srcObject = null; }
async function setLens(i) {
  lensIdx = (i + LENSES.length) % LENSES.length; try { localStorage.lens = LENSES[lensIdx].label; } catch (e) {}
  paintTop();
  if (busy) return;                     /* the bath owns the camera; the new glass is picked up when it returns */
  const want = realize(LENSES[lensIdx].mm);
  const have = stream ? (stream.getVideoTracks()[0].getSettings() || {}).deviceId : null;
  if (!stream || want.id !== have || want.crop !== glass.crop) { stopCamera(); await startCamera(); }
  fitFinder();
  flash(LENSES[lensIdx].label === "WIDE" ? "WIDE" + (glass.e !== 13 ? " - NO ULTRA-WIDE, " + glass.e + "MM" : "") : glass.mm + "MM");
}
const aspect = () => matchMedia("(orientation: landscape)").matches ? 5 / 4 : 4 / 5;
/* the finder shows what capture() will cut: the A-box's share of the frame (wf, hf), then 1/crop of it */
function fitFinder() {
  const v = $("video"); const vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return;
  const A = aspect(), va = vw / vh;
  const wf = va >= A ? A / va : 1, hf = va >= A ? 1 : va / A;
  const r = document.documentElement.style;
  r.setProperty("--zw", (glass.crop / wf).toFixed(5)); r.setProperty("--zh", (glass.crop / hf).toFixed(5));
}

function capture() {                 /* the negative: centre crop for the 33, long edge capped */
  const v = $("video"); if (!v.videoWidth) return null;
  const vw = v.videoWidth, vh = v.videoHeight, A = aspect();
  let cw, ch;
  if (vw / vh > A) { ch = vh; cw = Math.round(vh * A); } else { cw = vw; ch = Math.round(vw / A); }
  cw = Math.round(cw / glass.crop); ch = Math.round(ch / glass.crop);
  const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
  const s = Math.min(1, MAX_NEG / Math.max(cw, ch));
  const c = document.createElement("canvas");
  c.width = Math.round(cw * s); c.height = Math.round(ch * s);
  c.getContext("2d").drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  return c;
}

/* ---------- shutter -> bath -> print ---------- */
async function shoot() {
  if (busy || labDead || !workerVer) return;
  const c = capture(); if (!c) { flash("NO FRAME"); return; }
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.93)); c.width = c.height = 0;
  if (!blob) { flash("NEGATIVE FAILED"); return; }
  const id = String(Date.now());
  frameNo += 1;
  if (frameNo > 36) { frameNo = 1; ROLL = String.fromCharCode(((ROLL.charCodeAt(0) - 65 + 1) % 26) + 65); }
  const rf = ROLL + String(frameNo).padStart(2, "0");
  try { localStorage.frameNo = String(frameNo); localStorage.roll = ROLL; localStorage["rf" + id] = rf; } catch (e) {}
  paintTop();
  const leak = frameNo === 1 ? 0.9 : 0;            /* loading a roll exposes the leader */
  /* the negative is on disk BEFORE the bath: a crash costs the wait, not the frame */
  try { await put("negs", id, { blob, seed: (Number(id) % 9000) + 1, leak, size, rf, at: Date.now(), tries: 0 }); } catch (e) { flash("NEGATIVE NOT SAVED"); }
  const latent = URL.createObjectURL(blob); $("latent").src = latent;
  await bath(id, blob, (Number(id) % 9000) + 1, leak, size);
  URL.revokeObjectURL(latent);
}

async function bath(id, blob, seed, leak, px) {
  if (busy) return;                    /* one frame at a time, always */
  busy = true; cooking.add(id); $("shutter").disabled = true; $("bath").classList.add("on"); setState("DEVELOPING", "busy");
  stopCamera();                        /* the bath gets the phone to itself */
  let wake = null; try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  const t0 = Date.now(); const tick = setInterval(() => { $("bathtext").textContent = "DEVELOPING  " + Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
  let ok = false;
  try {
    const { jpg, secs } = await develop(await blob.arrayBuffer(), seed, leak, px);
    const printBlob = new Blob([jpg], { type: "image/jpeg" });
    await put("prints", id, printBlob);
    await put("thumbs", id, await makeThumb(printBlob));
    try { localStorage["t" + id] = secs ? Number(secs).toFixed(2) : ""; } catch (e) {}
    if (!prints.includes(id)) prints.push(id);
    await del("negs", id);
    ok = true;
  } catch (e) { labLog = String(e && e.message || e) + "\n" + labLog; flash(String(e && e.message || e).slice(0, 40).toUpperCase(), 4000); }
  clearInterval(tick); try { wake && wake.release(); } catch (e) {}
  $("bath").classList.remove("on"); busy = false; cooking.delete(id);
  paintStrip();
  if (ok) { await openPrint(id); }
  /* a fresh lab for the next frame: Pyodide's heap only grows, so the worker is
     retired after every bath and warms up again while the print is being looked at */
  spawnLab();
  startCamera();
}

async function makeThumb(blob) {
  const im = await createImageBitmap(blob);
  const s = 220 / Math.max(im.width, im.height);
  const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); im.close && im.close();
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.7));
}

/* anything still in negs at boot is a bath that never finished. Re-developed
   oldest first, one size smaller each time it has failed, and given up after two. */
async function recover() {
  let lost = [];
  try { const all = await new Promise(res => { const r = DB.transaction("negs").objectStore("negs").getAllKeys(); r.onsuccess = () => res(r.result.map(String).sort()); r.onerror = () => res([]); }); lost = all.filter(k => !prints.includes(k) && !cooking.has(k)); } catch (e) { return; }
  for (const id of lost) {
    if (cooking.has(id) || prints.includes(id)) continue;
    const rec = await get("negs", id).catch(() => null);
    if (!rec || !rec.blob) { await del("negs", id); continue; }
    if ((rec.tries || 0) >= 2) { flash("FRAME " + (rec.rf || id.slice(-4)) + " GAVE UP TWICE", 3000); continue; }
    const px = SIZES[Math.min(SIZES.length - 1, SIZES.indexOf(rec.size) < 0 ? 0 : SIZES.indexOf(rec.size) + (rec.tries || 0))];
    await put("negs", id, Object.assign({}, rec, { tries: (rec.tries || 0) + 1 }));
    try { if (rec.rf && !localStorage["rf" + id]) localStorage["rf" + id] = rec.rf; } catch (e) {}
    flash("RECOVERING " + (rec.rf || "FRAME") + " AT " + px, 2500);
    while ((!workerVer || busy) && !labDead) await new Promise(r => setTimeout(r, 250));
    if (labDead) return;
    await bath(id, rec.blob, rec.seed || 1, rec.leak || 0, px);
  }
}

/* ---------- prints ---------- */
const urls = new Set(); const mkURL = b => { const u = URL.createObjectURL(b); urls.add(u); return u; };
const revokeAll = () => { for (const u of urls) URL.revokeObjectURL(u); urls.clear(); };
async function paintStrip() {
  const el = $("strip"); el.innerHTML = ""; revokeAll();
  for (const id of prints.slice(-12).reverse()) {
    const t = await get("thumbs", id).catch(() => null); if (!t) continue;
    const im = document.createElement("img"); im.src = mkURL(t); im.onclick = () => openPrint(id); el.appendChild(im);
  }
}
async function openPrint(id) {
  const blob = await get("prints", id).catch(() => null); if (!blob) return;
  current = id;
  const rf = localStorage["rf" + id] || "", secs = localStorage["t" + id] || "";
  currentFile = new File([blob], "EMULSIFY" + (rf ? "-" + rf : "") + (secs ? "-" + secs + "s" : "") + "-" + id.slice(-4) + ".jpg", { type: "image/jpeg" });
  $("pcode").textContent = (rf ? rf[0] + " · " + rf.slice(1) : "") + (secs ? "  ·  " + secs + "s" : "");
  const old = $("pimg").src; $("pimg").src = URL.createObjectURL(blob); if (old) URL.revokeObjectURL(old);
  $("cam").classList.remove("on"); $("print").classList.add("on");
}
function closePrint() { $("print").classList.remove("on"); $("cam").classList.add("on"); current = null; }
$("back").onclick = closePrint;
/* hold the print to save: share() must run inside the gesture, so it fires on the pointerup that ends a long enough hold */
$("pstage").addEventListener("pointerdown", e => { hold = { t: performance.now(), x: e.clientX, y: e.clientY, moved: false }; });
$("pstage").addEventListener("pointermove", e => { if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 12) hold.moved = true; });
$("pstage").addEventListener("pointercancel", () => { hold = null; });
$("pstage").addEventListener("pointerup", async () => {
  const h = hold; hold = null; if (!h || h.moved || !currentFile) return;
  if (performance.now() - h.t < 550) return;
  try { if (navigator.canShare && navigator.canShare({ files: [currentFile] })) await navigator.share({ files: [currentFile] }); else flash("SHARE NOT AVAILABLE"); } catch (e) {}
});
$("pstage").addEventListener("contextmenu", e => e.preventDefault());

/* ---------- panel ---------- */
const paintPanel = () => { $("psize").textContent = "PRINT SIZE " + size; $("pana").textContent = "ANAMORPHIC " + SQUEEZE + (anaOn ? " ON" : " OFF"); };
$("pana").onclick = () => { anaOn = !anaOn; try { localStorage.ana = anaOn ? "1" : "0"; } catch (e) {} paintPanel(); paintTop(); flash(anaOn ? "SQUEEZE " + SQUEEZE + "X - THE LAB DESQUEEZES" : "SPHERICAL"); };
$("lens").onclick = () => setLens(lensIdx + 1);
$("menu").onclick = () => { paintPanel(); $("panel").classList.add("on"); };
$("pclose").onclick = () => $("panel").classList.remove("on");
$("panel").onclick = e => { if (e.target === $("panel")) $("panel").classList.remove("on"); };
$("psize").onclick = () => { size = SIZES[(SIZES.indexOf(size) + 1) % SIZES.length]; try { localStorage.size = size; } catch (e) {} paintPanel(); paintTop(); flash("PRINT SIZE " + size); };
$("prestart").onclick = () => { $("panel").classList.remove("on"); if (busy) { flash("AFTER DEVELOPING"); return; } spawnLab(); flash("LAB RESTARTED"); };
$("plog").onclick = () => { $("panel").classList.remove("on"); $("log").textContent = "b" + BUILD + "  w" + (workerVer || "?") + "  size " + size + "  " + turned + "\n\n" + (labLog || "(nothing logged)") + "\n\n(tap to close)"; $("log").classList.add("on"); };
$("log").onclick = () => $("log").classList.remove("on");
$("pupdate").onclick = () => { $("panel").classList.remove("on"); checkUpdate(true); };

/* ---------- updates: the live index's build number against this one ---------- */
async function checkUpdate(manual) {
  if (!manual && performance.now() - lastCheck < 600000) return; lastCheck = performance.now();
  try {
    const r = await fetch(location.pathname.replace(/[^/]*$/, "") + "index.html?u=" + Date.now(), { cache: "no-store" });
    const m = /const BUILD = (\d+);/.exec(r.ok ? await r.text() : ""); const found = m ? parseInt(m[1], 10) : 0;
    if (found > BUILD) { pending = found; if (manual) { flash("UPDATING TO b" + found); setTimeout(applyUpdate, 700); } else if (!busy) applyUpdate(); }
    else if (manual) flash(found ? (found === BUILD ? "SERVER HAS b" + found + " - SAME" : "SERVER HAS b" + found + " - OLDER") : "NO CONNECTION", 3000);
  } catch (e) { if (manual) flash("NO CONNECTION"); }
}
function applyUpdate() { if (busy) { setTimeout(applyUpdate, 1500); return; } location.replace(location.pathname.replace(/[^/]*$/, "") + "index.html?v=" + pending); }

/* ---------- boot ---------- */
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }); } catch (e) {} }
paintTop(); paintPanel();
$("shutter").onclick = shoot;
spawnLab();
startCamera();
paintStrip();
setTimeout(recover, 1500);
setTimeout(() => checkUpdate(false), 4000);
document.addEventListener("visibilitychange", () => { if (document.hidden) { if (!busy) stopCamera(); } else { if (!busy) startCamera(); checkUpdate(false); } });
/* iOS can drop a live <video> to black after the reflow of a rotation. play() alone
   was not enough on the owner's phone; re-attaching the stream rebuilds the layer. */
/* which way the phone turned. Apple: window.orientation 90 is the screen turned to
   the left (island on the left), -90 to the right. Reported in the LAB LOG. */
let turned = "";
function orient() {
  let a = (typeof window.orientation === "number") ? window.orientation
        : (screen.orientation && screen.orientation.type === "landscape-secondary") ? -90 : 90;
  const land = matchMedia("(orientation: landscape)").matches;
  document.documentElement.classList.toggle("landr", land && (a === -90 || a === 270));
  turned = !land ? "portrait" : (a === -90 || a === 270) ? "landscape, top of phone on the RIGHT" : "landscape, top of phone on the LEFT";
  fitFinder();
}
orient();
$("video").addEventListener("loadedmetadata", fitFinder); $("video").addEventListener("resize", fitFinder);
const reattach = () => { orient(); const v = $("video"); if (!stream || busy) return; v.srcObject = null; v.srcObject = stream; v.play && v.play().catch(() => {}); };
addEventListener("orientationchange", () => setTimeout(reattach, 350));
matchMedia("(orientation: landscape)").addEventListener("change", () => setTimeout(reattach, 350));
</script>
